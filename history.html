<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情怀：我们一起走过的日子</title>
    <link rel="icon" href="icon.jpg" type="image/jpeg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimHei', 'STHeiti', 'Heiti SC', '黑体', 'Noto Sans CJK SC', sans-serif;
            overflow: hidden;
            background: #0a0a1a;
            color: #fff;
            height: 100vh;
            width: 100vw;
        }

        /* ====== 返回按钮 ====== */
        .back-to-mobile {
            position: fixed;
            top: 0.8rem;
            left: 0.8rem;
            z-index: 1000;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 0.45rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.3s ease;
        }
        .back-to-mobile:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        /* ====== 加载层 ====== */
        #loaderLayer {
            position: fixed;
            inset: 0;
            z-index: 900;
            background: linear-gradient(180deg, #1a0a2e 0%, #0d0d0d 50%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease;
        }
        #loaderLayer.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 拼图动画 */
        .puzzle-loader {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .puzzle-piece {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 4px;
            opacity: 0.9;
        }
        .puzzle-piece:nth-child(1) { top: 0; left: 0; animation: puzzleMove1 2s infinite ease-in-out; }
        .puzzle-piece:nth-child(2) { top: 0; right: 0; animation: puzzleMove2 2s infinite ease-in-out 0.3s; }
        .puzzle-piece:nth-child(3) { bottom: 0; left: 0; animation: puzzleMove3 2s infinite ease-in-out 0.6s; }
        .puzzle-piece:nth-child(4) { bottom: 0; right: 0; animation: puzzleMove4 2s infinite ease-in-out 0.9s; }

        @keyframes puzzleMove1 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(44px,0) rotate(90deg); }
            50% { transform: translate(44px,44px) rotate(180deg); }
            75% { transform: translate(0,44px) rotate(270deg); }
        }
        @keyframes puzzleMove2 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(0,44px) rotate(90deg); }
            50% { transform: translate(-44px,44px) rotate(180deg); }
            75% { transform: translate(-44px,0) rotate(270deg); }
        }
        @keyframes puzzleMove3 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(0,-44px) rotate(90deg); }
            50% { transform: translate(44px,-44px) rotate(180deg); }
            75% { transform: translate(44px,0) rotate(270deg); }
        }
        @keyframes puzzleMove4 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(-44px,0) rotate(90deg); }
            50% { transform: translate(-44px,-44px) rotate(180deg); }
            75% { transform: translate(0,-44px) rotate(270deg); }
        }

        .loader-text {
            margin-top: 1.8rem;
            font-size: 1rem;
            color: #fff;
            letter-spacing: 0.15em;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* ====== 诗句层 ====== */
        #poemLayer {
            position: fixed;
            inset: 0;
            z-index: 800;
            background: linear-gradient(180deg, #1a0a2e 0%, #0d0d0d 50%, #000000 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            padding: 0;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #poemLayer.active {
            display: flex;
            opacity: 1;
        }
        .poem-scroll-area {
            flex: 1;
            overflow: hidden;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .poem-scroll-inner {
            width: 100%;
            padding: 2rem;
            text-align: center;
            animation: poemScrollUp 40s linear infinite;
        }
        @keyframes poemScrollUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }
        .poem-lines {
            text-align: center;
            line-height: 2.2;
            font-size: 1.05rem;
            color: rgba(255,255,255,0.9);
            max-width: 90vw;
        }
        .poem-lines .highlight {
            color: #ffd700;
            font-size: 1.25rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,215,0,0.4);
        }
        .poem-footer {
            flex-shrink: 0;
            padding: 1.2rem 0 2rem;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .explore-btn {
            padding: 0.85rem 2.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 2rem;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 20px rgba(102,126,234,0.4);
            transition: all 0.3s ease;
        }
        .explore-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(102,126,234,0.6);
        }

        /* ====== 时光穿梭层 ====== */
        #warpLayer {
            position: fixed;
            inset: 0;
            z-index: 850;
            background: #000;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #warpLayer.active {
            display: block;
            opacity: 1;
        }
        .warp-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ====== 白屏过渡 ====== */
        #whiteFlash {
            position: fixed;
            inset: 0;
            z-index: 860;
            background: #fff;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #whiteFlash.active {
            display: block;
            opacity: 1;
        }

        /* ====== 回忆录主页面 ====== */
        #memoryBook {
            position: fixed;
            inset: 0;
            z-index: 700;
            display: none;
            overflow: hidden;
        }
        #memoryBook.active {
            display: block;
        }

        /* 宇宙星河背景 Canvas */
        #starfield {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* 页面容器 */
        .memory-pages {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .memory-page {
            width: 100%;
            min-height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
        }

        /* 玻璃态内容卡片 */
        .memory-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.2rem;
            padding: 2rem 1.8rem;
            max-width: 680px;
            width: 92vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }
        /* 保留边缘不虚化 */
        .memory-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.3rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.08) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* 第一页：数据统计 */
        .stats-page .memory-card {
            text-align: center;
            padding: 2.5rem 2rem;
        }
        .stats-greeting {
            font-size: 1.15rem;
            line-height: 2.2;
            color: rgba(255,255,255,0.92);
            margin-bottom: 1rem;
        }
        .stats-greeting .name {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .stats-greeting .role {
            color: #87CEFA;
            font-weight: bold;
        }
        .rolling-number {
            display: inline-block;
            font-variant-numeric: tabular-nums;
            color: #ff69b4;
            font-weight: bold;
            font-size: 1.4rem;
            min-width: 2.5em;
            text-align: center;
        }
        .stats-ending {
            margin-top: 1.2rem;
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        /* 时间节点页面 */
        .timeline-page .memory-card {
            padding: 2rem;
        }
        .timeline-date {
            font-size: 0.9rem;
            color: #87CEFA;
            margin-bottom: 0.6rem;
            letter-spacing: 0.08em;
        }
        .timeline-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .timeline-content {
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(255,255,255,0.88);
            margin-bottom: 1.2rem;
            white-space: pre-wrap;
        }
        .timeline-content.rich-text {
            white-space: normal;
        }
        .timeline-video {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 0.6rem;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .timeline-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .timeline-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .timeline-images img {
            width: 100%;
            border-radius: 0.5rem;
            object-fit: cover;
            aspect-ratio: 4/3;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .timeline-images img:hover {
            transform: scale(1.03);
        }

        /* 富文本内容样式（富文本编辑器插入的元素） */
        .timeline-content a {
            color: #667eea;
            text-decoration: underline;
            word-break: break-all;
        }
        .timeline-content img {
            max-width: 100%;
            border-radius: 0.4rem;
            margin: 0.3rem 0;
        }
        .timeline-content iframe {
            max-width: 100%;
            border-radius: 0.4rem;
        }
        .timeline-content > div:has(> a) {
            margin: 0.5rem 0;
        }
        /* 超链接按钮样式 */
        .timeline-content a[style*="display:inline-block"] {
            display: inline-block !important;
            text-decoration: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        .timeline-content a[style*="display:inline-block"]:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        /* 背景图片页面 - 让卡片更透明以显示背景 */
        .memory-page[style*="background-image"] .memory-card {
            background: rgba(0,0,0,0.45) !important;
        }
        .memory-page[style*="background-image"] {
            position: relative;
        }
        .memory-page[style*="background-image"]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 0;
        }
        .memory-page[style*="background-image"] > * {
            position: relative;
            z-index: 1;
        }

        /* 页码指示器 */
        .page-dots {
            position: fixed;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .page-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .page-dot.active {
            background: #ffd700;
            box-shadow: 0 0 8px rgba(255,215,0,0.5);
            transform: scale(1.3);
        }

        /* 页面切换提示 */
        .swipe-hint {
            position: fixed;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            animation: bounce 2s infinite;
            pointer-events: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .stats-greeting { font-size: 1rem; line-height: 2; }
            .stats-greeting .name { font-size: 1.15rem; }
            .rolling-number { font-size: 1.2rem; }
            .timeline-title { font-size: 1.2rem; }
            .memory-card { padding: 1.5rem; }
        }

        /* ====== 编辑按钮 ====== */
        #editToggleBtn {
            position: fixed;
            top: 0.8rem;
            right: 4rem;
            z-index: 1100;
            padding: 0.4rem 1rem;
            background: rgba(102,126,234,0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2rem;
            color: #fff;
            font-size: 0.82rem;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
        }
        #editToggleBtn:hover {
            background: rgba(102,126,234,1);
            transform: translateY(-1px);
        }
        #editToggleBtn.editing {
            background: rgba(220,38,38,0.85);
        }

        /* 编辑模式工具栏 */
        .edit-toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1200;
            background: rgba(15,15,30,0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.12);
            padding: 0.5rem;
            display: none;
            flex-direction: column;
            gap: 0.4rem;
        }
        .edit-toolbar.active {
            display: flex;
        }
        .edit-toolbar-row {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .edit-tool-btn {
            padding: 0.35rem 0.8rem;
            background: rgba(51,65,85,0.8);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0.4rem;
            color: #e2e8f0;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .edit-tool-btn:hover {
            background: rgba(71,85,105,0.9);
        }
        .edit-tool-btn.save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-weight: 600;
        }
        .edit-tool-btn.delete-btn {
            background: rgba(220,38,38,0.7);
            border: 1px solid rgba(239,68,68,0.5);
        }

        /* 编辑模式：内容区域可编辑 */
        .memory-card.editing .timeline-date,
        .memory-card.editing .timeline-title,
        .memory-card.editing .timeline-content {
            outline: 1px dashed rgba(102,126,234,0.5);
            outline-offset: 2px;
            cursor: text;
        }
        .memory-card.editing .timeline-date:focus,
        .memory-card.editing .timeline-title:focus,
        .memory-card.editing .timeline-content:focus {
            outline: 2px solid rgba(102,126,234,0.8);
            background: rgba(102,126,234,0.08);
            border-radius: 0.3rem;
        }

        /* 编辑模式：节点排序按钮 */
        .node-reorder {
            display: none;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
        }
        .memory-card.editing .node-reorder {
            display: flex;
        }
        .reorder-btn {
            padding: 0.25rem 0.6rem;
            background: rgba(51,65,85,0.8);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0.3rem;
            color: #e2e8f0;
            font-size: 0.72rem;
            cursor: pointer;
        }
        .reorder-btn:hover {
            background: rgba(71,85,105,0.9);
        }
        .reorder-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* 添加新节点页面 */
        .add-node-page {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .add-node-page.active {
            display: flex;
        }

        /* ====== BGM 背景音乐控制图标 ====== */
        #bgmToggle {
            position: fixed;
            top: 0.8rem;
            right: 0.8rem;
            z-index: 1100;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            display: none;            /* 进入回忆录后才显示 */
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(20,20,40,0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 4px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }
        #bgmToggle:hover {
            background: rgba(40,40,70,0.6);
            transform: scale(1.08);
            box-shadow: 0 6px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        #bgmToggle:active { transform: scale(0.96); }
        #bgmToggle .bgm-note {
            width: 1.3rem;
            height: 1.3rem;
            display: block;
            transform-origin: 50% 50%;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }
        /* 播放中：音符持续旋转 */
        #bgmToggle.playing .bgm-note {
            animation: bgmSpin 4s linear infinite;
        }
        /* 暂停时：音符归位（无动画即为正向 0deg） */
        #bgmToggle .bgm-slash {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transform: translate(-50%, -50%) rotate(45deg); /* 左上至右下 */
            box-shadow: 0 0 4px rgba(0,0,0,0.55);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        #bgmToggle.paused .bgm-slash { opacity: 0.95; }
        /* 播放光环呼吸效果 */
        #bgmToggle.playing {
            box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 0 0 rgba(135,206,250,0.5);
            animation: bgmGlow 3s ease-in-out infinite;
        }
        @keyframes bgmSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes bgmGlow {
            0%, 100% { box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 0 0 rgba(135,206,250,0.0); }
            50%      { box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 12px 2px rgba(135,206,250,0.35); }
        }

        /* ====== 版本号 & 更新历史 ====== */
        .version-label {
            position: fixed;
            bottom: 0.3rem;
            left: 0.5rem;
            z-index: 1000;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
        }
        .changelog-btn {
            position: fixed;
            bottom: 0.3rem;
            right: 0.5rem;
            z-index: 1000;
            padding: 0.3rem 0.7rem;
            background: rgba(30,30,50,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1rem;
            color: rgba(255,255,255,0.7);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .changelog-btn:hover { background: rgba(50,50,80,0.9); color: #fff; }
        .changelog-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .changelog-overlay:not(.hidden) { opacity: 1; pointer-events: auto; }
        .changelog-panel {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1rem;
            max-width: 90vw; max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem;
            color: #e0e0e0;
        }
        .changelog-panel h2 {
            font-size: 1.1rem; color: #fff; margin-bottom: 1rem;
            position: sticky; top: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding-bottom: 0.5rem;
        }
        .changelog-close {
            float: right; background: none; border: none;
            color: #aaa; font-size: 1.3rem; cursor: pointer;
        }
        .changelog-panel h3 { font-size: 0.95rem; color: #667eea; margin-top: 0.8rem; }

        // ====== 配置 ======

        // ====== Supabase 配置（通过 Cloudflare Pages 代理） ======
        const SUPABASE_URL = 'https://wh12z213mob.pages.dev/api/supabase';

        // 从 Supabase 加载回忆录时间节点
        async function loadHistoryNodesFromDB() {
            try {
                var url = SUPABASE_URL + '/rest/v1/history_nodes?select=id,node_date,title,content,font_family,font_color,images,video,background_image&order=node_date.asc';
                var resp = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var rows = await resp.json();
                if (rows && rows.length) {
                    return rows.map(function(r) {
                        return {
                            id: r.id,
                            date: r.node_date,
                            title: r.title,
                            content: r.content,
                            fontFamily: r.font_family || '',
                            fontColor: r.font_color || '',
                            images: r.images || '',
                            video: r.video || '',
                            bgImage: r.background_image || ''
                        };
                    });
                }
                return [];
            } catch(e) {
                console.warn('从数据库加载回忆录节点失败，回退到 localStorage:', e);
                // 尝试不含 background_image 列的旧查询
                try {
                    var url2 = SUPABASE_URL + '/rest/v1/history_nodes?select=id,node_date,title,content,font_family,font_color,images,video&order=node_date.asc';
                    var resp2 = await fetch(url2, { headers: { 'Content-Type': 'application/json' } });
                    if (resp2.ok) {
                        var rows2 = await resp2.json();
                        if (rows2 && rows2.length) {
                            return rows2.map(function(r) {
                                return { id: r.id, date: r.node_date, title: r.title, content: r.content, fontFamily: r.font_family || '', fontColor: r.font_color || '', images: r.images || '', video: r.video || '', bgImage: '' };
                            });
                        }
                    }
                } catch(e3) {}
                // 回退到 localStorage
                try {
                    var saved = localStorage.getItem('history_nodes');
                    return saved ? JSON.parse(saved) : [];
                } catch(e2) { return []; }
            }
        }

        // 当前用户信息（从移动端登录态读取）
        let userInfo = { name: '', role: '同学', isStudent: true, permissions: {} };
        try {

            var raw = localStorage.getItem('mobile_auth_user')
                   || localStorage.getItem('mobile_current_user')
                   || localStorage.getItem('study_timer_auth_user');
            if (raw) u = JSON.parse(raw);
            if (u) {
                // 优先真实姓名，其次用户名，都没有则留空
                userInfo.name = (u.realname && String(u.realname).trim()) || (u.username && String(u.username).trim()) || '';
                // 学生 -> 同学，教师(及其它) -> 老师
                userInfo.isStudent = (u.role === 'student');
                userInfo.role = userInfo.isStudent ? '同学' : '老师';
                // 读取权限信息
                userInfo.permissions = u.permissions || {};
            }
        } catch(e) {}

        // ====== 登录态与权限验证 ======

        if (userInfo.name && userInfo.permissions.viewMemory === false && !userInfo.permissions.isAdmin) {

        // ====== BGM 背景音乐系统 ======

            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Vibing%20Over%20Venus.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/End%20of%20the%20Era.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/George%20Street%20Shuffle.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Laid%20Back%20Guitars.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Life%20of%20Riley.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Light%20Awash.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Look%20Busy.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Master%20of%20the%20Feast.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Royal%20Banana.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Sneaky%20Adventure.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Somewhere%20Sunny.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Super%20Friendly.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Take%20a%20Chance.mp3',
            'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Welcome%20to%20the%20Show.mp3'
        ];

        let bgmAudio = null;
        let bgmIndex = -1;
        let bgmUserPaused = false;       // 用户手动暂停
        let bgmVideoPaused = false;      // 因播放 Bilibili 视频而暂停
        let bgmFadeTimer = null;
        let bgmWaitingGesture = false;   // 自动播放被拦截，等待用户手势后启动
        let bgmInited = false;
        let bgmPreloadIndex = -1;         // 预加载阶段缓存的首曲索引

        function bgmRandomIndex(exclude) {
            if (BGM_LIST.length <= 1) return 0;
            var i;
            do { i = Math.floor(Math.random() * BGM_LIST.length); } while (i === exclude);
            return i;
        }

        function bgmClearFade() {
            if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
        }

        // 线性渐变到目标音量
        function bgmFadeTo(target, duration, onDone) {
            bgmClearFade();
            if (!bgmAudio) { if (onDone) onDone(); return; }
            var start = bgmAudio.volume;
            var t0 = performance.now();
            bgmFadeTimer = setInterval(function() {
                var p = Math.min((performance.now() - t0) / duration, 1);
                bgmAudio.volume = Math.max(0, Math.min(1, start + (target - start) * p));
                if (p >= 1) { bgmClearFade(); if (onDone) onDone(); }
            }, 40);
        }

        function bgmSetPlaying(on) {
            var btn = document.getElementById('bgmToggle');
            if (!btn) return;
            if (on) { btn.classList.add('playing'); btn.classList.remove('paused'); }
            else { btn.classList.remove('playing'); btn.classList.add('paused'); }
        }

        // 播放一首新的随机曲目（淡入 6s 至 25%）
        function bgmPlayNew() {
            if (!bgmAudio) return;
            if (bgmVideoPaused) return; // 视频播放中不打扰
            bgmIndex = (bgmPreloadIndex >= 0) ? bgmPreloadIndex : bgmRandomIndex(bgmIndex);
            bgmPreloadIndex = -1;
            bgmAudio.src = BGM_LIST[bgmIndex];
            bgmAudio.volume = 0;
            bgmUserPaused = false;
            var onOk = function() { bgmFadeTo(BGM_VOLUME, BGM_FADE_MS); bgmSetPlaying(true); };
            var onFail = function() { bgmWaitingGesture = true; bgmArmGesture(); bgmSetPlaying(false); };
            var p = bgmAudio.play();
            if (p && p.then) p.then(onOk).catch(onFail); else onOk();
        }

        // 淡出至 0 后暂停（用户手动暂停时使用短淡出 800ms，视频联动使用长淡出）
        function bgmPauseFade(onDone, fast) {
            if (!bgmAudio) { if (onDone) onDone(); return; }
            var dur = fast ? 800 : BGM_FADE_MS;
            bgmFadeTo(0, dur, function() {
                try { bgmAudio.pause(); } catch(e) {}
                if (onDone) onDone();
            });
        }

        // 自动播放被拦截时：等待任意用户手势后启动
        function bgmArmGesture() {
            function fire(e) {
                if (!bgmWaitingGesture) return;
                // 图标自身的点击交由 bgmToggleClick 处理，避免 pointerdown 与 click 重复触发
                if (e && e.target && e.target.closest && e.target.closest('#bgmToggle')) return;
                bgmWaitingGesture = false;
                if (!bgmAudio) return;
                var ok = function() { bgmFadeTo(BGM_VOLUME, BGM_FADE_MS); bgmSetPlaying(true); };
                var p = bgmAudio.play();
                if (p && p.then) p.then(ok).catch(function(){}); else ok();
                document.removeEventListener('pointerdown', fire);
                document.removeEventListener('keydown', fire);
                document.removeEventListener('touchstart', fire);
            }
            document.addEventListener('pointerdown', fire);
            document.addEventListener('keydown', fire);
            document.addEventListener('touchstart', fire);
        }

        // 点击图标：播放/暂停切换
        function bgmToggleClick() {
            if (!bgmAudio) { initBGM(); return; }
            var wantPlay = bgmAudio.paused || bgmUserPaused || bgmWaitingGesture;
            if (wantPlay) {
                bgmWaitingGesture = false;
                bgmUserPaused = false;
                bgmVideoPaused = false;
                bgmSetPlaying(true);  // 立即更新图标为播放状态
                var onOk = function() { bgmFadeTo(BGM_VOLUME, BGM_FADE_MS); };
                var onFail = function() { bgmWaitingGesture = true; bgmArmGesture(); bgmSetPlaying(false); };
                var p = bgmAudio.play();
                if (p && p.then) p.then(onOk).catch(onFail); else onOk();
            } else {
                bgmUserPaused = true;
                bgmSetPlaying(false);  // 立即更新图标为暂停状态
                bgmPauseFade(null, true);  // 短淡出后暂停
            }
        }

        // 视频开始播放 -> 暂停 BGM
        function bgmOnVideoStart() {
            if (bgmUserPaused) return;
            if (bgmVideoPaused) return;
            if (!bgmAudio || bgmAudio.paused) return;
            bgmVideoPaused = true;
            bgmFadeTo(0, BGM_FADE_MS, function() {
                if (bgmVideoPaused && bgmAudio) { try { bgmAudio.pause(); } catch(e){} }
            });
            bgmSetPlaying(false);
        }

        // 视频结束/失焦 -> 恢复 BGM
        function bgmOnVideoEnd() {
            if (!bgmVideoPaused) return;
            bgmVideoPaused = false;
            if (bgmUserPaused) return;       // 尊重用户手动暂停
            if (!bgmAudio) return;
            var ok = function() { bgmFadeTo(BGM_VOLUME, BGM_FADE_MS); bgmSetPlaying(true); };
            var fail = function() { bgmWaitingGesture = true; bgmArmGesture(); };
            var p = bgmAudio.play();
            if (p && p.then) p.then(ok).catch(fail); else ok();
        }

        // 绑定 Bilibili 视频联动（iframe 无法直接监听，用焦点变化 + 点击近似处理）
        function bgmBindVideoFocus() {
            if (window._bgmFocusBound) return;
            window._bgmFocusBound = true;
            // 焦点进入 iframe（视频被操作）-> 暂停音乐
            window.addEventListener('blur', function() {
                setTimeout(function() {
                    var ae = document.activeElement;
                    if (ae && ae.tagName === 'IFRAME') bgmOnVideoStart();
                }, 0);
            });
            // 焦点回到页面 -> 视频交互结束 -> 恢复音乐
            window.addEventListener('focus', function() {
                if (bgmVideoPaused) bgmOnVideoEnd();
            });
            // 兜底：点击视频容器区域
            document.addEventListener('pointerdown', function(e) {
                var t = e.target;
                if (t && t.closest && t.closest('.timeline-video')) bgmOnVideoStart();
            }, true);
        }

        // 初始化 BGM（进入回忆录后调用，确保不在加载阶段播放）
        function initBGM() {
            if (bgmInited) return;
            bgmInited = true;
            bgmAudio = new Audio();
            bgmAudio.preload = 'auto';
            bgmAudio.volume = 0;
            bgmAudio.addEventListener('ended', function() {
                if (bgmUserPaused) return;
                bgmPlayNew(); // 一首结束自动播放新的随机曲
            });
            bgmAudio.addEventListener('error', function() {
                if (bgmUserPaused) return;
                setTimeout(function() { if (!bgmUserPaused) bgmPlayNew(); }, 1000); // 跳过坏链
            });
            var btn = document.getElementById('bgmToggle');
            if (btn) {
                btn.style.display = 'flex';
                btn.addEventListener('click', bgmToggleClick);
            }
            bgmBindVideoFocus();
            bgmPlayNew(); // 随机播放一首
        }

        // ====== 预加载所有资源 ======
        let assetsLoaded = false;
        let preloadedNodes = null;      // 预加载阶段获取的节点，供渲染复用

        function preloadImage(url) {
            return new Promise(function(resolve) {
                var img = new Image();
                img.onload = img.onerror = function() { resolve(); };
                img.src = url;
            });
        }

        // 真正预加载：从数据库获取所有 history_nodes 后，预加载图片、Bilibili 视频连接、BGM 音频
        function preloadAssets() {
            return new Promise(function(resolve) {
                var done = false;
                function finish() { if (done) return; done = true; assetsLoaded = true; resolve(); }
                // 安全兜底：最多等待 6 秒，避免卡在加载阶段
                setTimeout(finish, 6000);

                loadHistoryNodesFromDB().then(function(nodes) {
                    preloadedNodes = nodes || [];
                    var tasks = [];
                    // 1) 预加载所有图片 URL（images 字段）
                    for (var i = 0; i < preloadedNodes.length; i++) {
                        var imgs = preloadedNodes[i].images;
                        if (imgs) {
                            var urls = imgs.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
                            for (var k = 0; k < urls.length; k++) tasks.push(preloadImage(urls[k]));
                        }
                        // 1b) 预加载富文本内容中的图片
                        var content = preloadedNodes[i].content || '';
                        if (content.indexOf('<img') !== -1) {
                            var imgRegex = /<img[^>]+src="([^"]+)"/gi;
                            var match;
                            while ((match = imgRegex.exec(content)) !== null) {
                                tasks.push(preloadImage(match[1]));
                            }
                        }
                        // 1c) 预加载背景图片
                        if (preloadedNodes[i].bgImage) {
                            tasks.push(preloadImage(preloadedNodes[i].bgImage));
                        }
                    }
                    // 2) 预加载 Bilibili 视频：预热播放器与封面 CDN 连接（API 受 CORS 限制，用 preconnect 近似）
                    if (!document.getElementById('bgmPreconnectPlayer')) {
                        var pc1 = document.createElement('link');

        function runWarpAnimation() {
            var canvas = document.getElementById('warpCanvas');
            var ctx = canvas.getContext('2d');
            var w = canvas.width = window.innerWidth;
            var h = canvas.height = window.innerHeight;
            var cx = w / 2, cy = h / 2;
            var stars = [];
            for (var i = 0; i < 400; i++) {
                var angle = Math.random() * Math.PI * 2;
                var dist = Math.random() * Math.max(w, h) * 0.8;
                stars.push({
                    x: cx + Math.cos(angle) * dist,
                    y: cy + Math.sin(angle) * dist,
                    speed: 2 + Math.random() * 8,
                    size: 1 + Math.random() * 2
                });
            }
            var animId;
            function draw() {
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(0, 0, w, h);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    var dx = s.x - cx, dy = s.y - cy;
                    var dist = Math.sqrt(dx*dx + dy*dy);
                    var nx = dx / dist, ny = dy / dist;
                    s.x += nx * s.speed * 3;
                    s.y += ny * s.speed * 3;
                    s.speed *= 1.015;
                    var newDist = Math.sqrt((s.x-cx)*(s.x-cx)+(s.y-cy)*(s.y-cy));
                    if (newDist > Math.max(w,h) || newDist < 2) {
                        var angle = Math.random() * Math.PI * 2;
                        var d = 10 + Math.random() * 50;
                        s.x = cx + Math.cos(angle) * d;
                        s.y = cy + Math.sin(angle) * d;
                        s.speed = 2 + Math.random() * 5;
                    }
                    var alpha = Math.min(1, newDist / (Math.max(w,h)*0.3));
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(180,200,255,' + alpha * 0.6 + ')';
                    ctx.lineWidth = s.size * (1 + newDist / 300);
                    ctx.moveTo(s.x - nx * s.speed * 2, s.y - ny * s.speed * 2);
                    ctx.lineTo(s.x, s.y);
                    ctx.stroke();
                }
                animId = requestAnimationFrame(draw);
            }
            draw();
            setTimeout(function() { cancelAnimationFrame(animId); }, 3500);
        }

        // ====== 宇宙星河背景 ======
        function initStarfield() {
            var canvas = document.getElementById('starfield');
            var ctx = canvas.getContext('2d');
            var w = canvas.width = window.innerWidth;
            var h = canvas.height = window.innerHeight;
            var stars = [];
            for (var i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 2.5,
                    speed: 0.05 + Math.random() * 0.15,
                    brightness: 0.3 + Math.random() * 0.7,
                    twinkleSpeed: 0.01 + Math.random() * 0.03,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
            // 添加几个星云
            var nebulas = [];
            for (var n = 0; n < 4; n++) {
                nebulas.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    radius: 100 + Math.random() * 200,
                    hue: [260, 200, 320, 180][n],
                    opacity: 0.03 + Math.random() * 0.04
                });
            }

            function draw() {
                // 深空背景
                var grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0a0a1a');
                grad.addColorStop(0.5, '#0d0d1f');
                grad.addColorStop(1, '#050510');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // 星云
                for (var n = 0; n < nebulas.length; n++) {
                    var neb = nebulas[n];
                    var rg = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.radius);
                    rg.addColorStop(0, 'hsla(' + neb.hue + ', 60%, 50%, ' + neb.opacity + ')');
                    rg.addColorStop(1, 'hsla(' + neb.hue + ', 60%, 50%, 0)');
                    ctx.fillStyle = rg;
                    ctx.fillRect(neb.x - neb.radius, neb.y - neb.radius, neb.radius * 2, neb.radius * 2);
                }

                // 星星
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    s.y -= s.speed;
                    if (s.y < 0) { s.y = h; s.x = Math.random() * w; }
                    s.twinklePhase += s.twinkleSpeed;
                    var alpha = s.brightness * (0.6 + 0.4 * Math.sin(s.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', function() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });
        }

        // ====== 数字滚动动画 ======
        function animateRollingNumber(el, target, duration) {
            return new Promise(function(resolve) {
                var start = performance.now();
                var max = target * 1.5;
                function update(now) {
                    var progress = Math.min((now - start) / duration, 1);
                    var ease = 1 - Math.pow(1 - progress, 3);
                    var current = Math.round(max * ease);
                    if (progress >= 1) current = target;
                    el.textContent = current;
                    if (progress < 1) {
                        requestAnimationFrame(update);
                    } else {
                        resolve();
                    }
                }
                requestAnimationFrame(update);
            });
        }

            // 单节点滑动导航
            var pages = document.getElementById('memoryPages');
            var dots = document.getElementById('pageDots');
            var hint = document.getElementById('swipeHint');
            var isScrolling = false;
            var scrollTimer = null;

            pages.addEventListener('scroll', function() {
                var idx = Math.round(pages.scrollTop / window.innerHeight);
                var dotEls = dots.querySelectorAll('.page-dot');
                dotEls.forEach(function(d, i) {
                    d.classList.toggle('active', i === idx);
                });
                if (idx > 0) hint.style.display = 'none';

                // 节流：滚动停止后吸附到最近的页面
                if (scrollTimer) clearTimeout(scrollTimer);
                scrollTimer = setTimeout(function() {
                    var snapIdx = Math.round(pages.scrollTop / window.innerHeight);
                    var targetTop = snapIdx * window.innerHeight;
                    if (Math.abs(pages.scrollTop - targetTop) > 5) {
                        pages.scrollTo({ top: targetTop, behavior: 'smooth' });
                    }
                }, 100);
            });

            // 触摸事件：每次滑动仅切换一个节点
            var touchStartY = 0;
            var touchEndY = 0;
            pages.addEventListener('touchstart', function(e) {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            pages.addEventListener('touchend', function(e) {
                touchEndY = e.changedTouches[0].clientY;
                var diff = touchStartY - touchEndY;
                if (Math.abs(diff) > 50) {
                    var currentIdx = Math.round(pages.scrollTop / window.innerHeight);
                    var maxIdx = pages.children.length - 1;
                    if (diff > 0 && currentIdx < maxIdx) {
                        // 上滑 -> 下一个节点
                        scrollToPage(currentIdx + 1);
                    } else if (diff < 0 && currentIdx > 0) {
                        // 下滑 -> 上一个节点
                        scrollToPage(currentIdx - 1);
                    }
                }
            }, { passive: true });

            // 鼠标滚轮：每次仅切换一个节点
            var wheelTimer = null;
            pages.addEventListener('wheel', function(e) {
                e.preventDefault();
                if (wheelTimer) return;
                var currentIdx = Math.round(pages.scrollTop / window.innerHeight);
                var maxIdx = pages.children.length - 1;
                if (e.deltaY > 30 && currentIdx < maxIdx) {
                    scrollToPage(currentIdx + 1);
                } else if (e.deltaY < -30 && currentIdx > 0) {
                    scrollToPage(currentIdx - 1);
                }
                wheelTimer = setTimeout(function() { wheelTimer = null; }, 500);
            }, { passive: false });
        }

        function extractBvid(url) {
            if (!url) return null;

            if (!text) return '';

        function escapeAttr(s) {
            if (!s) return '';
            return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

            }
        }

        // 删除当前节点
        function editDeleteCurrentNode() {
            var pages = document.getElementById('memoryPages');
            var currentIdx = Math.round(pages.scrollTop / window.innerHeight);
            var pageEl = pages.children[currentIdx];
            if (!pageEl) return;
            var nodeIdx = pageEl.getAttribute('data-node-index');
            if (nodeIdx === null) {
                alert('当前页面不可删除');
                return;
            }
            nodeIdx = parseInt(nodeIdx);
            if (!confirm('确定删除该时间节点吗？')) return;
            var nodes = window._memoryNodes || [];
            var node = nodes[nodeIdx];
            if (!node) return;

            // 从数据库删除
            if (node.id) {
                var url = SUPABASE_URL + '/rest/v1/history_nodes?id=eq.' + encodeURIComponent(node.id);
                fetch(url, { method: 'DELETE', headers: { 'Content-Type': 'application/json' } })
                    .then(function() { alert('节点已删除'); location.reload(); })
                    .catch(function(e) { alert('删除失败：' + (e.message || '错误')); });
            } else {
                // localStorage 模式
                nodes.splice(nodeIdx, 1);
                localStorage.setItem('history_nodes', JSON.stringify(nodes));
                alert('节点已删除');
                location.reload();
            }
        }

        // 移动节点排序
        function editMoveNode(idx, direction) {
            var nodes = window._memoryNodes || [];
            var newIdx = idx + direction;
            if (newIdx < 0 || newIdx >= nodes.length) return;

            // 交换节点位置
            var temp = nodes[idx];
            nodes[idx] = nodes[newIdx];
            nodes[newIdx] = temp;

            // 交换日期以保持数据库排序（数据库按 node_date 排序）
            var tempDate = nodes[idx].date;
            nodes[idx].date = nodes[newIdx].date;
            nodes[newIdx].date = tempDate;

            window._memoryNodes = nodes;
            // 标记需要保存排序
            window._needsSaveOrder = true;

            // 重新渲染
            renderMemoryPagesForEdit();
        }

        // 编辑模式下重新渲染（保持编辑状态）
        function renderMemoryPagesForEdit() {
            var nodes = window._memoryNodes || [];
            var container = document.getElementById('memoryPages');
            var dots = document.getElementById('pageDots');
            var now = new Date();
            var daysPassed = Math.floor((now - CLASS_START) / (1000 * 60 * 60 * 24));
            var daysToGaokao = Math.ceil((GAOKAO_DATE - now) / (1000 * 60 * 60 * 24));
            var peopleCount = userInfo.isStudent ? STUDENT_COUNT : TEACHER_COUNT;

            var html = '';
            var dotsHtml = '';

            // 第1页
            var greetingHtml = '亲爱的';
            if (userInfo.name) greetingHtml += '<span class="name">' + escapeHtml(userInfo.name) + '</span>';
            greetingHtml += '<span class="role">' + userInfo.role + '</span>：';
            html += '<div class="memory-page stats-page"><div class="memory-card"><div class="stats-greeting">' +
                greetingHtml + '<br>13班已陪你走过<span class="rolling-number" id="numDays">0</span>天<br>' +
                '<span class="rolling-number" id="numPeople">0</span>位同学与你并肩奋斗<br>' +
                '距离高考还有<span class="rolling-number" id="numGaokao">0</span>天<br></div>' +
                '<div class="stats-ending">让我们一起为着理想大学而奋斗！</div></div></div>';
            dotsHtml += '<div class="page-dot active" onclick="scrollToPage(0)"></div>';

            for (var i = 0; i < nodes.length; i++) {
                var node = nodes[i];
                var videoHtml = '';
                if (node.video) {
                    var bvid = extractBvid(node.video);
                    if (bvid) videoHtml = '<div class="timeline-video"><iframe src="https://player.bilibili.com/player.html?bvid=' + bvid + '&page=1&high_quality=1&danmaku=0" allowfullscreen></iframe></div>';
                }
                var imagesHtml = '';
                if (node.images) {
                    var imgUrls = node.images.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
                    if (imgUrls.length) {
                        imagesHtml = '<div class="timeline-images">';
                        for (var k = 0; k < imgUrls.length; k++) imagesHtml += '<img src="' + escapeHtml(imgUrls[k]) + '" alt="" loading="lazy">';
                        imagesHtml += '</div>';
                    }
                }
                var contentHtml = node.content || '';
                var isRichText = contentHtml.indexOf('<') !== -1 && contentHtml.indexOf('>') !== -1;
                if (isRichText) {
                    contentHtml = contentHtml.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                                             .replace(/\son\w+\s*=\s*"[^"]*"/gi, '')
                                             .replace(/\son\w+\s*=\s*'[^']*'/gi, '')
                                             .replace(/javascript:/gi, '');
                } else {
                    contentHtml = escapeHtml(contentHtml);
                }
                html += '<div class="memory-page timeline-page" data-node-index="' + i + '">' +
                    '<div class="memory-card editing" data-node-id="' + (node.id || '') + '">' +
                    '<div class="node-reorder">' +
                        '<button class="reorder-btn" onclick="editMoveNode(' + i + ', -1)"' + (i === 0 ? ' disabled' : '') + '>↑ 上移</button>' +
                        '<button class="reorder-btn" onclick="editMoveNode(' + i + ', 1)"' + (i === nodes.length - 1 ? ' disabled' : '') + '>↓ 下移</button>' +
                    '</div>' +
                    '<div class="timeline-date" contenteditable="true">' + escapeHtml(node.date || '') + '</div>' +
                    '<div class="timeline-title" contenteditable="true">' + escapeHtml(node.title || '') + '</div>' +
                    '<div class="timeline-content' + (isRichText ? ' rich-text' : '') + '" contenteditable="true">' + contentHtml + '</div>' +
                    imagesHtml + videoHtml + '</div></div>';
                dotsHtml += '<div class="page-dot" onclick="scrollToPage(' + (i+1) + ')"></div>';
            }

            // 添加节点页面
            html += '<div class="memory-page add-node-page active" id="addNodePage">' +
                '<div class="memory-card editing">' +
                '<div class="node-reorder"><button class="reorder-btn" onclick="editMoveNode(' + nodes.length + ', -1)">↑ 上移</button></div>' +
                '<div class="timeline-date" contenteditable="true" data-placeholder="点击设置日期"></div>' +
                '<div class="timeline-title" contenteditable="true" data-placeholder="点击输入标题"></div>' +
                '<div class="timeline-content" contenteditable="true" data-placeholder="点击输入内容..."></div>' +
                '<div style="text-align:center;color:rgba(255,255,255,0.4);font-size:0.85rem;margin-top:1rem;">➕ 新时间节点</div>' +
                '</div></div>';
            dotsHtml += '<div class="page-dot" onclick="scrollToPage(' + (nodes.length + 1) + ')"></div>';

            container.innerHTML = html;
            dots.innerHTML = dotsHtml;

            // 重新绑定日期点击事件
            var dateEls = container.querySelectorAll('.timeline-date');
            dateEls.forEach(function(el) {
                el.addEventListener('click', editDateClickHandler);
            });

            // 触发数字滚动
            setTimeout(function() {
                animateRollingNumber(document.getElementById('numDays'), daysPassed, 2000);
                animateRollingNumber(document.getElementById('numPeople'), peopleCount, 2000);
                animateRollingNumber(document.getElementById('numGaokao'), daysToGaokao, 2000);
            }, 300);
        }

        // 保存所有编辑
        async function editSaveAll() {
            var nodes = window._memoryNodes || [];
            var pages = document.getElementById('memoryPages');
            var pageEls = pages.querySelectorAll('.timeline-page');
            var addPage = document.getElementById('addNodePage');
            var saved = 0;
            var errors = [];

            // 保存已有节点的修改
            for (var i = 0; i < pageEls.length; i++) {
                var card = pageEls[i].querySelector('.memory-card');
                if (!card) continue;
                var nodeIdx = parseInt(pageEls[i].getAttribute('data-node-index'));
                var node = nodes[nodeIdx];
                if (!node) continue;

                var dateEl = card.querySelector('.timeline-date');
                var titleEl = card.querySelector('.timeline-title');
                var contentEl = card.querySelector('.timeline-content');
                var videoData = card.getAttribute('data-video');

                var updates = {};
                if (dateEl) {
                    var newDate = dateEl.textContent.trim();
                    var originalDate = node._originalDate || node.date;
                    if (newDate && newDate !== originalDate) updates.node_date = newDate;
                }
                if (titleEl) {
                    var newTitle = titleEl.textContent.trim();
                    if (newTitle !== node.title) updates.title = newTitle;
                }
                if (contentEl) {
                    var newContent = contentEl.innerHTML.trim();
                    if (newContent !== node.content) updates.content = newContent;
                }
                if (videoData !== null) {
                    var currentVideo = card.getAttribute('data-video') || '';
                    if (currentVideo !== (node.video || '')) updates.video = currentVideo;
                }

                if (Object.keys(updates).length > 0) {
                    try {
                        if (node.id) {
                            var url = SUPABASE_URL + '/rest/v1/history_nodes?id=eq.' + encodeURIComponent(node.id);
                            var resp = await fetch(url, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(updates)
                            });
                            if (!resp.ok) throw new Error('HTTP ' + resp.status);
                            saved++;
                        }
                    } catch(e) {
                        errors.push('节点 ' + (nodeIdx + 1) + ' 保存失败: ' + (e.message || '错误'));
                    }
                }
            }

            // 检查添加节点页面
            if (addPage) {
                var addCard = addPage.querySelector('.memory-card');
                if (addCard) {
                    var addDate = addCard.querySelector('.timeline-date');
                    var addTitle = addCard.querySelector('.timeline-title');
                    var addContent = addCard.querySelector('.timeline-content');
                    var addVideo = addCard.getAttribute('data-video') || '';

                    var dateVal = addDate ? addDate.textContent.trim() : '';
                    var titleVal = addTitle ? addTitle.textContent.trim() : '';
                    var contentVal = addContent ? addContent.innerHTML.trim() : '';

                    if (dateVal && titleVal && contentVal && contentVal !== '<br>') {
                        try {
                            var newRow = {
                                node_date: dateVal,
                                title: titleVal,
                                content: contentVal,
                                font_family: '',
                                font_color: '',
                                images: '',
                                video: addVideo
                            };
                            var insertResp = await fetch(SUPABASE_URL + '/rest/v1/history_nodes', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(newRow)
                            });
                            if (!insertResp.ok) throw new Error('HTTP ' + insertResp.status);
                            saved++;
                        } catch(e) {
                            errors.push('新增节点保存失败: ' + (e.message || '错误'));
                        }
                    }
                }
            }

            // 排序变更已通过日期交换在上面的节点保存中处理
            if (window._needsSaveOrder) {
                window._needsSaveOrder = false;
            }

            if (errors.length > 0) {
                alert('保存完成，但有 ' + errors.length + ' 个错误：\n' + errors.join('\n'));
            } else if (saved > 0) {
                alert('保存成功（' + saved + ' 个节点已更新）');
            } else {
                alert('没有需要保存的更改');
            }

            // 退出编辑模式并重新加载
            isEditMode = false;
            location.reload();
        }

        // 启动（仅在已登录时执行，未登录已在上方拦截跳转）
        if (userInfo.name) {
            runLoader();
        }
    </script>

    <!-- 版本号标注 -->
    <div class="version-label">回忆录 v1.0.0</div>

    <!-- 更新历史按钮 -->
    <button class="changelog-btn" onclick="document.getElementById('changelogOverlay').classList.remove('hidden')">📜 更新历史</button>

    <!-- 更新历史弹窗 -->
    <div id="changelogOverlay" class="changelog-overlay hidden" onclick="if(event.target===this)this.classList.add('hidden')">
        <div class="changelog-panel">
            <h2>📜 回忆录 — 更新历史<button class="changelog-close" onclick="document.getElementById('changelogOverlay').classList.add('hidden')">&times;</button></h2>

            <h3>v1.0.0</h3>
            <ul>
                <li>回忆录编辑功能从后台移至查看页面，右上角"编辑"按钮可直接在查看界面编辑</li>
                <li>编辑模式支持：编辑时间/标题/内容、插入图片、B站视频、节点排序、添加新节点</li>
                <li>删除背景图片功能和字体样式编辑功能</li>
                <li>首页"探索时光记忆"按钮固定底部，诗句文字自动向上滚动</li>
                <li>时间节点滑动每次仅切换一个节点，避免跳过</li>
                <li>编辑模式下点击"保存"按钮保存更改，支持取消编辑</li>
                <li>无编辑权限用户点击编辑按钮时进行提示</li>
            </ul>
        </div>
    </div>
</body>
