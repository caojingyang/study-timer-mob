<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情怀：我们一起走过的日子</title>
    <link rel="icon" href="icon.jpg" type="image/jpeg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SimHei', 'STHeiti', 'Heiti SC', '黑体', 'Noto Sans CJK SC', sans-serif;
            overflow: hidden;
            background: #0a0a1a;
            color: #fff;
            height: 100vh;
            width: 100vw;
        }

        /* ====== 返回按钮 ====== */
        .back-to-mobile {
            position: fixed;
            top: 0.8rem;
            left: 0.8rem;
            z-index: 1000;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 0.45rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.3s ease;
        }
        .back-to-mobile:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }

        /* ====== 加载层 ====== */
        #loaderLayer {
            position: fixed;
            inset: 0;
            z-index: 900;
            background: linear-gradient(180deg, #1a0a2e 0%, #0d0d0d 50%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s ease;
        }
        #loaderLayer.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 拼图动画 */
        .puzzle-loader {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .puzzle-piece {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 4px;
            opacity: 0.9;
        }
        .puzzle-piece:nth-child(1) { top: 0; left: 0; animation: puzzleMove1 2s infinite ease-in-out; }
        .puzzle-piece:nth-child(2) { top: 0; right: 0; animation: puzzleMove2 2s infinite ease-in-out 0.3s; }
        .puzzle-piece:nth-child(3) { bottom: 0; left: 0; animation: puzzleMove3 2s infinite ease-in-out 0.6s; }
        .puzzle-piece:nth-child(4) { bottom: 0; right: 0; animation: puzzleMove4 2s infinite ease-in-out 0.9s; }

        @keyframes puzzleMove1 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(44px,0) rotate(90deg); }
            50% { transform: translate(44px,44px) rotate(180deg); }
            75% { transform: translate(0,44px) rotate(270deg); }
        }
        @keyframes puzzleMove2 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(0,44px) rotate(90deg); }
            50% { transform: translate(-44px,44px) rotate(180deg); }
            75% { transform: translate(-44px,0) rotate(270deg); }
        }
        @keyframes puzzleMove3 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(0,-44px) rotate(90deg); }
            50% { transform: translate(44px,-44px) rotate(180deg); }
            75% { transform: translate(44px,0) rotate(270deg); }
        }
        @keyframes puzzleMove4 {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(-44px,0) rotate(90deg); }
            50% { transform: translate(-44px,-44px) rotate(180deg); }
            75% { transform: translate(0,-44px) rotate(270deg); }
        }

        .loader-text {
            margin-top: 1.8rem;
            font-size: 1rem;
            color: #fff;
            letter-spacing: 0.15em;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* ====== 诗句层 ====== */
        #poemLayer {
            position: fixed;
            inset: 0;
            z-index: 800;
            background: linear-gradient(180deg, #1a0a2e 0%, #0d0d0d 50%, #000000 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 2rem;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #poemLayer.active {
            display: flex;
            opacity: 1;
        }
        .poem-inner {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
        }
        .poem-lines {
            text-align: center;
            line-height: 2.2;
            font-size: 1.05rem;
            color: rgba(255,255,255,0.9);
            max-width: 90vw;
        }
        .poem-lines .highlight {
            color: #ffd700;
            font-size: 1.25rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,215,0,0.4);
        }
        .explore-btn {
            margin-top: 2.5rem;
            padding: 0.85rem 2.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 2rem;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 0.1em;
            box-shadow: 0 4px 20px rgba(102,126,234,0.4);
            transition: all 0.3s ease;
        }
        .explore-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(102,126,234,0.6);
        }

        /* ====== 时光穿梭层 ====== */
        #warpLayer {
            position: fixed;
            inset: 0;
            z-index: 850;
            background: #000;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #warpLayer.active {
            display: block;
            opacity: 1;
        }
        .warp-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* ====== 白屏过渡 ====== */
        #whiteFlash {
            position: fixed;
            inset: 0;
            z-index: 860;
            background: #fff;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #whiteFlash.active {
            display: block;
            opacity: 1;
        }

        /* ====== 回忆录主页面 ====== */
        #memoryBook {
            position: fixed;
            inset: 0;
            z-index: 700;
            display: none;
            overflow: hidden;
        }
        #memoryBook.active {
            display: block;
        }

        /* 宇宙星河背景 Canvas */
        #starfield {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* 页面容器 */
        .memory-pages {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .memory-page {
            width: 100%;
            min-height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
        }

        /* 玻璃态内容卡片 */
        .memory-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.2rem;
            padding: 2rem 1.8rem;
            max-width: 680px;
            width: 92vw;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }
        /* 保留边缘不虚化 */
        .memory-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.3rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.08) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* 第一页：数据统计 */
        .stats-page .memory-card {
            text-align: center;
            padding: 2.5rem 2rem;
        }
        .stats-greeting {
            font-size: 1.15rem;
            line-height: 2.2;
            color: rgba(255,255,255,0.92);
            margin-bottom: 1rem;
        }
        .stats-greeting .name {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .stats-greeting .role {
            color: #87CEFA;
            font-weight: bold;
        }
        .rolling-number {
            display: inline-block;
            font-variant-numeric: tabular-nums;
            color: #ff69b4;
            font-weight: bold;
            font-size: 1.4rem;
            min-width: 2.5em;
            text-align: center;
        }
        .stats-ending {
            margin-top: 1.2rem;
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        /* 时间节点页面 */
        .timeline-page .memory-card {
            padding: 2rem;
        }
        .timeline-date {
            font-size: 0.9rem;
            color: #87CEFA;
            margin-bottom: 0.6rem;
            letter-spacing: 0.08em;
        }
        .timeline-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .timeline-content {
            font-size: 1rem;
            line-height: 1.9;
            color: rgba(255,255,255,0.88);
            margin-bottom: 1.2rem;
            white-space: pre-wrap;
        }
        .timeline-content.rich-text {
            white-space: normal;
        }
        .timeline-video {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 0.6rem;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .timeline-video iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .timeline-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .timeline-images img {
            width: 100%;
            border-radius: 0.5rem;
            object-fit: cover;
            aspect-ratio: 4/3;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .timeline-images img:hover {
            transform: scale(1.03);
        }

        /* 富文本内容样式（富文本编辑器插入的元素） */
        .timeline-content a {
            color: #667eea;
            text-decoration: underline;
            word-break: break-all;
        }
        .timeline-content img {
            max-width: 100%;
            border-radius: 0.4rem;
            margin: 0.3rem 0;
        }
        .timeline-content iframe {
            max-width: 100%;
            border-radius: 0.4rem;
        }
        .timeline-content > div:has(> a) {
            margin: 0.5rem 0;
        }
        /* 超链接按钮样式 */
        .timeline-content a[style*="display:inline-block"] {
            display: inline-block !important;
            text-decoration: none;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        .timeline-content a[style*="display:inline-block"]:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }
        /* 背景图片页面 - 让卡片更透明以显示背景 */
        .memory-page[style*="background-image"] .memory-card {
            background: rgba(0,0,0,0.45) !important;
        }
        .memory-page[style*="background-image"] {
            position: relative;
        }
        .memory-page[style*="background-image"]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 0;
        }
        .memory-page[style*="background-image"] > * {
            position: relative;
            z-index: 1;
        }

        /* 页码指示器 */
        .page-dots {
            position: fixed;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .page-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .page-dot.active {
            background: #ffd700;
            box-shadow: 0 0 8px rgba(255,215,0,0.5);
            transform: scale(1.3);
        }

        /* 页面切换提示 */
        .swipe-hint {
            position: fixed;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            animation: bounce 2s infinite;
            pointer-events: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .stats-greeting { font-size: 1rem; line-height: 2; }
            .stats-greeting .name { font-size: 1.15rem; }
            .rolling-number { font-size: 1.2rem; }
            .timeline-title { font-size: 1.2rem; }
            .memory-card { padding: 1.5rem; }
        }

        /* ====== BGM 背景音乐控制图标 ====== */
        #bgmToggle {
            position: fixed;
            top: 0.8rem;
            right: 0.8rem;
            z-index: 1100;
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 50%;
            display: none;            /* 进入回忆录后才显示 */
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(20,20,40,0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 4px 18px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }
        #bgmToggle:hover {
            background: rgba(40,40,70,0.6);
            transform: scale(1.08);
            box-shadow: 0 6px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        #bgmToggle:active { transform: scale(0.96); }
        #bgmToggle .bgm-note {
            width: 1.3rem;
            height: 1.3rem;
            display: block;
            transform-origin: 50% 50%;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }
        /* 播放中：音符持续旋转 */
        #bgmToggle.playing .bgm-note {
            animation: bgmSpin 4s linear infinite;
        }
        /* 暂停时：音符归位（无动画即为正向 0deg） */
        #bgmToggle .bgm-slash {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transform: translate(-50%, -50%) rotate(45deg); /* 左上至右下 */
            box-shadow: 0 0 4px rgba(0,0,0,0.55);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        #bgmToggle.paused .bgm-slash { opacity: 0.95; }
        /* 播放光环呼吸效果 */
        #bgmToggle.playing {
            box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 0 0 rgba(135,206,250,0.5);
            animation: bgmGlow 3s ease-in-out infinite;
        }
        @keyframes bgmSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes bgmGlow {
            0%, 100% { box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 0 0 rgba(135,206,250,0.0); }
            50%      { box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 12px 2px rgba(135,206,250,0.35); }
        }
    </style>
</head>
<body>
    <!-- 返回移动端 -->
    <a href="/" class="back-to-mobile">&#x2190; 返回移动端</a>

    <!-- BGM 背景音乐控制（进入回忆录后显示） -->
    <div id="bgmToggle" class="paused" title="背景音乐" role="button" aria-label="背景音乐开关">
        <svg class="bgm-note" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3z"/></svg>
        <span class="bgm-slash"></span>
    </div>

    <!-- 加载层 -->
    <div id="loaderLayer">
        <div class="puzzle-loader">
            <div class="puzzle-piece"></div>
            <div class="puzzle-piece"></div>
            <div class="puzzle-piece"></div>
            <div class="puzzle-piece"></div>
        </div>
        <div class="loader-text">记忆碎片搜索中...</div>
    </div>

    <!-- 诗句层 -->
    <div id="poemLayer">
        <div class="poem-inner">
            <div class="poem-lines" id="poemLines"></div>
            <button class="explore-btn" onclick="startWarp()">&#x2728; 探索时光记忆</button>
        </div>
    </div>

    <!-- 时光穿梭层 -->
    <div id="warpLayer">
        <canvas id="warpCanvas" class="warp-canvas"></canvas>
    </div>

    <!-- 白屏过渡 -->
    <div id="whiteFlash"></div>

    <!-- 回忆录主页面 -->
    <div id="memoryBook">
        <canvas id="starfield"></canvas>
        <div class="memory-pages" id="memoryPages"></div>
        <div class="page-dots" id="pageDots"></div>
        <div class="swipe-hint" id="swipeHint">&#x2191; 上滑查看更多</div>
    </div>

    <script>
        // ====== 配置 ======
        const CLASS_START = new Date('2026-03-14T00:00:00');
        const GAOKAO_DATE = new Date('2028-06-07T00:00:00');
        const STUDENT_COUNT = 61;
        const TEACHER_COUNT = 62;

        // ====== Supabase 配置（通过 Cloudflare Pages 代理） ======
        const SUPABASE_URL = 'https://wh12z213mob.pages.dev/api/supabase';

        // 从 Supabase 加载回忆录时间节点
        async function loadHistoryNodesFromDB() {
            try {
                var url = SUPABASE_URL + '/rest/v1/history_nodes?select=id,node_date,title,content,font_family,font_color,images,video,background_image&order=node_date.asc';
                var resp = await fetch(url, { headers: { 'Content-Type': 'application/json' } });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                var rows = await resp.json();
                if (rows && rows.length) {
                    return rows.map(function(r) {
                        return {
                            id: r.id,
                            date: r.node_date,
                            title: r.title,
                            content: r.content,
                            fontFamily: r.font_family || '',
                            fontColor: r.font_color || '',
                            images: r.images || '',
                            video: r.video || '',
                            bgImage: r.background_image || ''
                        };
                    });
                }
                // 数据库为空，自动写入两条默认节点
                var seeded = await seedDefaultNodes();
                if (seeded && seeded.length) return seeded;
                return [];
            } catch(e) {
                console.warn('从数据库加载回忆录节点失败，回退到 localStorage:', e);
                // 尝试不含 background_image 列的旧查询
                try {
                    var url2 = SUPABASE_URL + '/rest/v1/history_nodes?select=id,node_date,title,content,font_family,font_color,images,video&order=node_date.asc';
                    var resp2 = await fetch(url2, { headers: { 'Content-Type': 'application/json' } });
                    if (resp2.ok) {
                        var rows2 = await resp2.json();
                        if (rows2 && rows2.length) {
                            return rows2.map(function(r) {
                                return { id: r.id, date: r.node_date, title: r.title, content: r.content, fontFamily: r.font_family || '', fontColor: r.font_color || '', images: r.images || '', video: r.video || '', bgImage: '' };
                            });
                        }
                    }
                } catch(e3) {}
                // 回退到 localStorage
                try {
                    var saved = localStorage.getItem('history_nodes');
                    return saved ? JSON.parse(saved) : [];
                } catch(e2) { return []; }
            }
        }

        // 数据库为空时自动写入默认节点（使后台可修改/删除）
        var DEFAULT_NODES = [
            { node_date: '2026-03-14', title: '班级成立', content: '高二（13）班正式成立，来自不同班级的我们汇聚在一起，开始了新的征程。' },
            { node_date: '2026-04-01', title: '第一次月考', content: '全年级第一次统一考试，13班整体表现优异，班级凝聚力初显。' }
        ];

        async function seedDefaultNodes() {
            var results = [];
            for (var i = 0; i < DEFAULT_NODES.length; i++) {
                var d = DEFAULT_NODES[i];
                try {
                    var resp = await fetch(SUPABASE_URL + '/rest/v1/history_nodes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                        body: JSON.stringify({
                            node_date: d.node_date,
                            title: d.title,
                            content: d.content,
                            font_family: '',
                            font_color: '',
                            images: '',
                            video: '',
                            background_image: ''
                        })
                    });
                    if (resp.ok) {
                        var row = await resp.json();
                        if (row && row[0]) {
                            results.push({
                                id: row[0].id,
                                date: row[0].node_date,
                                title: row[0].title,
                                content: row[0].content,
                                fontFamily: '',
                                fontColor: '',
                                images: '',
                                video: '',
                                bgImage: ''
                            });
                        }
                    }
                } catch(e) {
                    console.warn('写入默认节点失败:', e);
                }
            }
            return results;
        }

        // 当前用户信息（从移动端登录态读取）
        let userInfo = { name: '', role: '同学', isStudent: true };
        try {
            var u = null;
            // 移动端 app 实际存储键为 mobile_auth_user；兼容历史/其它键名

        function bgmRandomIndex(exclude) {
            if (BGM_LIST.length <= 1) return 0;
            var i;
            do { i = Math.floor(Math.random() * BGM_LIST.length); } while (i === exclude);

        }

        function bgmClearFade() {
            if (bgmFadeTimer) { clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
        }

        // 线性渐变到目标音量
        function bgmFadeTo(target, duration, onDone) {
            bgmClearFade();
            if (!bgmAudio) { if (onDone) onDone(); return; }
            var start = bgmAudio.volume;
            var t0 = performance.now();
            bgmFadeTimer = setInterval(function() {
                var p = Math.min((performance.now() - t0) / duration, 1);
                bgmAudio.volume = Math.max(0, Math.min(1, start + (target - start) * p));
                if (p >= 1) { bgmClearFade(); if (onDone) onDone(); }
            }, 40);
        }

        function bgmSetPlaying(on) {
            var btn = document.getElementById('bgmToggle');
            if (!btn) return;
            if (on) { btn.classList.add('playing'); btn.classList.remove('paused'); }

        }

            if (!bgmAudio) return;

            bgmIndex = (bgmPreloadIndex >= 0) ? bgmPreloadIndex : bgmRandomIndex(bgmIndex);
            bgmPreloadIndex = -1;
            bgmAudio.src = BGM_LIST[bgmIndex];
            bgmAudio.volume = 0;
            bgmUserPaused = false;
            var onOk = function() { bgmFadeTo(BGM_VOLUME, BGM_FADE_MS); bgmSetPlaying(true); };
            var onFail = function() { bgmWaitingGesture = true; bgmArmGesture(); bgmSetPlaying(false); };
            var p = bgmAudio.play();
            if (p && p.then) p.then(onOk).catch(onFail); else onOk();
        }

        // 淡出至 0 后暂停
        function bgmPauseFade(onDone) {
            if (!bgmAudio) { if (onDone) onDone(); return; }
            bgmFadeTo(0, BGM_FADE_MS, function() {
                try { bgmAudio.pause(); } catch(e) {}
                if (onDone) onDone();
            });
        }

        // 自动播放被拦截时：等待任意用户手势后启动
        function bgmArmGesture() {
            function fire(e) {
                if (!bgmWaitingGesture) return;
                // 图标自身的点击交由 bgmToggleClick 处理，避免 pointerdown 与 click 重复触发
                if (e && e.target && e.target.closest && e.target.closest('#bgmToggle')) return;
                bgmWaitingGesture = false;
                if (!bgmAudio) return;
                var ok = function() { bgmFadeTo(BGM_VOLUME, BGM_FADE_MS); bgmSetPlaying(true); };
                var p = bgmAudio.play();
                if (p && p.then) p.then(ok).catch(function(){}); else ok();
                document.removeEventListener('pointerdown', fire);
                document.removeEventListener('keydown', fire);
                document.removeEventListener('touchstart', fire);
            }
            document.addEventListener('pointerdown', fire);
            document.addEventListener('keydown', fire);
            document.addEventListener('touchstart', fire);
        }

            if (wantPlay) {

                bgmUserPaused = false;
                bgmVideoPaused = false;
                var onOk = function() { bgmFadeTo(BGM_VOLUME, BGM_FADE_MS); bgmSetPlaying(true); };
                var onFail = function() { bgmWaitingGesture = true; bgmArmGesture(); bgmSetPlaying(false); };
                var p = bgmAudio.play();
                if (p && p.then) p.then(onOk).catch(onFail); else onOk();
            } else {
                bgmUserPaused = true;
                bgmPauseFade(function() { bgmSetPlaying(false); });

            var fail = function() { bgmWaitingGesture = true; bgmArmGesture(); };

        let assetsLoaded = false;

        function preloadImage(url) {
            return new Promise(function(resolve) {
                var img = new Image();
                img.onload = img.onerror = function() { resolve(); };
                img.src = url;
            });
        }

        // 真正预加载：从数据库获取所有 history_nodes 后，预加载图片、Bilibili 视频连接、BGM 音频
        function preloadAssets() {
            return new Promise(function(resolve) {
                var done = false;
                function finish() { if (done) return; done = true; assetsLoaded = true; resolve(); }
                // 安全兜底：最多等待 6 秒，避免卡在加载阶段
                setTimeout(finish, 6000);

                loadHistoryNodesFromDB().then(function(nodes) {
                    preloadedNodes = nodes || [];
                    var tasks = [];
                    // 1) 预加载所有图片 URL（images 字段）
                    for (var i = 0; i < preloadedNodes.length; i++) {
                        var imgs = preloadedNodes[i].images;
                        if (imgs) {
                            var urls = imgs.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
                            for (var k = 0; k < urls.length; k++) tasks.push(preloadImage(urls[k]));
                        }
                        // 1b) 预加载富文本内容中的图片
                        var content = preloadedNodes[i].content || '';
                        if (content.indexOf('<img') !== -1) {
                            var imgRegex = /<img[^>]+src="([^"]+)"/gi;
                            var match;
                            while ((match = imgRegex.exec(content)) !== null) {
                                tasks.push(preloadImage(match[1]));
                            }
                        }
                        // 1c) 预加载背景图片
                        if (preloadedNodes[i].bgImage) {
                            tasks.push(preloadImage(preloadedNodes[i].bgImage));
                        }
                    }
                    // 2) 预加载 Bilibili 视频：预热播放器与封面 CDN 连接（API 受 CORS 限制，用 preconnect 近似）
                    if (!document.getElementById('bgmPreconnectPlayer')) {
                        var pc1 = document.createElement('link');
                        pc1.id = 'bgmPreconnectPlayer'; pc1.rel = 'preconnect'; pc1.href = 'https://player.bilibili.com';
                        var pc2 = document.createElement('link');
                        pc2.id = 'bgmPreconnectHdslb'; pc2.rel = 'preconnect'; pc2.href = 'https://i0.hdslb.com';
                        document.head.appendChild(pc1);
                        document.head.appendChild(pc2);
                    }
                    // 3) 预加载 BGM：提前缓存即将播放的第一首
                    try {
                        bgmPreloadIndex = bgmRandomIndex(-1);
                        var a = new Audio();
                        a.preload = 'auto';
                        a.src = BGM_LIST[bgmPreloadIndex];
                    } catch(e) {}
                    Promise.all(tasks).then(finish).catch(finish);
                }).catch(finish);
            });
        }

        function runWarpAnimation() {
            var canvas = document.getElementById('warpCanvas');
            var ctx = canvas.getContext('2d');
            var w = canvas.width = window.innerWidth;
            var h = canvas.height = window.innerHeight;
            var cx = w / 2, cy = h / 2;
            var stars = [];
            for (var i = 0; i < 400; i++) {
                var angle = Math.random() * Math.PI * 2;
                var dist = Math.random() * Math.max(w, h) * 0.8;
                stars.push({
                    x: cx + Math.cos(angle) * dist,
                    y: cy + Math.sin(angle) * dist,
                    speed: 2 + Math.random() * 8,
                    size: 1 + Math.random() * 2
                });
            }
            var animId;
            function draw() {
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(0, 0, w, h);
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    var dx = s.x - cx, dy = s.y - cy;
                    var dist = Math.sqrt(dx*dx + dy*dy);
                    var nx = dx / dist, ny = dy / dist;
                    s.x += nx * s.speed * 3;
                    s.y += ny * s.speed * 3;
                    s.speed *= 1.015;
                    var newDist = Math.sqrt((s.x-cx)*(s.x-cx)+(s.y-cy)*(s.y-cy));
                    if (newDist > Math.max(w,h) || newDist < 2) {
                        var angle = Math.random() * Math.PI * 2;
                        var d = 10 + Math.random() * 50;
                        s.x = cx + Math.cos(angle) * d;
                        s.y = cy + Math.sin(angle) * d;
                        s.speed = 2 + Math.random() * 5;
                    }
                    var alpha = Math.min(1, newDist / (Math.max(w,h)*0.3));
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(180,200,255,' + alpha * 0.6 + ')';
                    ctx.lineWidth = s.size * (1 + newDist / 300);
                    ctx.moveTo(s.x - nx * s.speed * 2, s.y - ny * s.speed * 2);
                    ctx.lineTo(s.x, s.y);
                    ctx.stroke();
                }
                animId = requestAnimationFrame(draw);
            }
            draw();
            setTimeout(function() { cancelAnimationFrame(animId); }, 3500);
        }

        // ====== 宇宙星河背景 ======
        function initStarfield() {
            var canvas = document.getElementById('starfield');
            var ctx = canvas.getContext('2d');
            var w = canvas.width = window.innerWidth;
            var h = canvas.height = window.innerHeight;
            var stars = [];
            for (var i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 2.5,
                    speed: 0.05 + Math.random() * 0.15,
                    brightness: 0.3 + Math.random() * 0.7,
                    twinkleSpeed: 0.01 + Math.random() * 0.03,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
            // 添加几个星云
            var nebulas = [];
            for (var n = 0; n < 4; n++) {
                nebulas.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    radius: 100 + Math.random() * 200,
                    hue: [260, 200, 320, 180][n],
                    opacity: 0.03 + Math.random() * 0.04
                });
            }

            function draw() {
                // 深空背景
                var grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0a0a1a');
                grad.addColorStop(0.5, '#0d0d1f');
                grad.addColorStop(1, '#050510');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // 星云
                for (var n = 0; n < nebulas.length; n++) {
                    var neb = nebulas[n];
                    var rg = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.radius);
                    rg.addColorStop(0, 'hsla(' + neb.hue + ', 60%, 50%, ' + neb.opacity + ')');
                    rg.addColorStop(1, 'hsla(' + neb.hue + ', 60%, 50%, 0)');
                    ctx.fillStyle = rg;
                    ctx.fillRect(neb.x - neb.radius, neb.y - neb.radius, neb.radius * 2, neb.radius * 2);
                }

                // 星星
                for (var i = 0; i < stars.length; i++) {
                    var s = stars[i];
                    s.y -= s.speed;
                    if (s.y < 0) { s.y = h; s.x = Math.random() * w; }
                    s.twinklePhase += s.twinkleSpeed;
                    var alpha = s.brightness * (0.6 + 0.4 * Math.sin(s.twinklePhase));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();

            window.addEventListener('resize', function() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });
        }

        // ====== 数字滚动动画 ======
        function animateRollingNumber(el, target, duration) {
            return new Promise(function(resolve) {
                var start = performance.now();
                var max = target * 1.5;
                function update(now) {
                    var progress = Math.min((now - start) / duration, 1);
                    var ease = 1 - Math.pow(1 - progress, 3);
                    var current = Math.round(max * ease);
                    if (progress >= 1) current = target;
                    el.textContent = current;
                    if (progress < 1) {
                        requestAnimationFrame(update);
                    } else {
                        resolve();
                    }
                }
                requestAnimationFrame(update);
            });
        }

        // ====== 进入回忆录 ======
        function enterMemoryBook() {
            document.getElementById('whiteFlash').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('whiteFlash').style.display = 'none';
            }, 800);

            var book = document.getElementById('memoryBook');
            book.classList.add('active');
            initStarfield();
            renderMemoryPages();
            initBGM();   // 进入回忆录后才启动背景音乐（不在加载阶段播放）

            // 页面滚动监听
            var pages = document.getElementById('memoryPages');
            var dots = document.getElementById('pageDots');
            var hint = document.getElementById('swipeHint');
            pages.addEventListener('scroll', function() {
                var idx = Math.round(pages.scrollTop / window.innerHeight);
                var dotEls = dots.querySelectorAll('.page-dot');
                dotEls.forEach(function(d, i) {
                    d.classList.toggle('active', i === idx);
                });
                if (idx > 0) hint.style.display = 'none';
            });
        }

        // ====== 渲染回忆录页面 ======
        async function renderMemoryPages() {
            var container = document.getElementById('memoryPages');
            var dots = document.getElementById('pageDots');
            var now = new Date();
            var daysPassed = Math.floor((now - CLASS_START) / (1000 * 60 * 60 * 24));
            var daysToGaokao = Math.ceil((GAOKAO_DATE - now) / (1000 * 60 * 60 * 24));
            var peopleCount = userInfo.isStudent ? STUDENT_COUNT : TEACHER_COUNT;

            // 优先复用预加载阶段已获取的节点数据，避免重复请求
            var nodes = preloadedNodes;
            preloadedNodes = null;
            if (!nodes) {
                nodes = await loadHistoryNodesFromDB();
            }
            // 若仍没有数据（数据库不可用且 localStorage 也为空），使用临时默认数据
            if (!nodes.length) {
                nodes = [
                    { date: '2026-03-14', title: '班级成立', content: '高二（13）班正式成立，来自不同班级的我们汇聚在一起，开始了新的征程。', fontFamily: '', fontColor: '', video: '', bgImage: '' },
                    { date: '2026-04-01', title: '第一次月考', content: '全年级第一次统一考试，13班整体表现优异，班级凝聚力初显。', fontFamily: '', fontColor: '', video: '', bgImage: '' }
                ];
            }

            var html = '';
            var dotsHtml = '';

            // 第1页：数据统计
            var greetingHtml = '亲爱的';
            if (userInfo.name) {
                greetingHtml += '<span class="name">' + escapeHtml(userInfo.name) + '</span>';
            }
            greetingHtml += '<span class="role">' + userInfo.role + '</span>：';

            html += '<div class="memory-page stats-page">' +
                '<div class="memory-card">' +
                '<div class="stats-greeting">' +
                greetingHtml + '<br>' +
                '13班已陪你走过<span class="rolling-number" id="numDays">0</span>天<br>' +
                '<span class="rolling-number" id="numPeople">0</span>位同学与你并肩奋斗<br>' +
                '距离高考还有<span class="rolling-number" id="numGaokao">0</span>天<br>' +
                '</div>' +
                '<div class="stats-ending">让我们一起为着理想大学而奋斗！</div>' +
                '</div></div>';
            dotsHtml += '<div class="page-dot active" onclick="scrollToPage(0)"></div>';

            // 时间节点页面
            for (var i = 0; i < nodes.length; i++) {
                var node = nodes[i];
                var dateStr = node.date || '';
                var titleStyle = node.fontColor ? 'color:' + node.fontColor + ';' : '';
                        var titleFont = node.fontFamily ? 'font-family:' + node.fontFamily + ';' : '';
                        var contentStyle = node.fontColor ? 'color:' + node.fontColor + ';' : '';
                        var contentFont = node.fontFamily ? 'font-family:' + node.fontFamily + ';' : '';
                        // 背景图片样式
                        var bgStyle = '';
                        if (node.bgImage) {
                            bgStyle = 'background-image:url(' + node.bgImage + ');background-size:cover;background-position:center;';
                        }
                        var videoHtml = '';
                        if (node.video) {
                            var bvid = extractBvid(node.video);
                            if (bvid) {
                                videoHtml = '<div class="timeline-video"><iframe src="https://player.bilibili.com/player.html?bvid=' + bvid + '&page=1&high_quality=1&danmaku=0" allowfullscreen></iframe></div>';
                            }
                        }
                        var imagesHtml = '';
                        if (node.images) {
                            var imgUrls = node.images.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
                            if (imgUrls.length) {
                                imagesHtml = '<div class="timeline-images">';
                                for (var k = 0; k < imgUrls.length; k++) {
                                    imagesHtml += '<img src="' + escapeHtml(imgUrls[k]) + '" alt="" loading="lazy">';
                                }
                                imagesHtml += '</div>';
                            }
                        }
                        // 内容渲染：检测是否为富文本（含HTML标签），是则直接渲染HTML（过滤script），否则转义
                        var contentHtml = node.content || '';
                        var isRichText = contentHtml.indexOf('<') !== -1 && contentHtml.indexOf('>') !== -1;
                        if (isRichText) {
                            // 基本安全过滤：移除 script 标签和 on 事件属性
                            contentHtml = contentHtml.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                                                     .replace(/\son\w+\s*=\s*"[^"]*"/gi, '')
                                                     .replace(/\son\w+\s*=\s*'[^']*'/gi, '')
                                                     .replace(/javascript:/gi, '');
                        } else {
                            contentHtml = escapeHtml(contentHtml);
                        }
                        html += '<div class="memory-page timeline-page"' + (bgStyle ? ' style="' + bgStyle + '"' : '') + '>' +
                            '<div class="memory-card">' +
                            '<div class="timeline-date">' + escapeHtml(dateStr) + '</div>' +
                            '<div class="timeline-title" style="' + titleStyle + titleFont + '">' + escapeHtml(node.title || '') + '</div>' +
                            '<div class="timeline-content' + (isRichText ? ' rich-text' : '') + '" style="' + contentStyle + contentFont + '">' + contentHtml + '</div>' +
                            imagesHtml +
                            videoHtml +
                            '</div></div>';
                dotsHtml += '<div class="page-dot" onclick="scrollToPage(' + (i+1) + ')"></div>';
            }

            container.innerHTML = html;
            dots.innerHTML = dotsHtml;

            // 触发数字滚动
            setTimeout(function() {
                animateRollingNumber(document.getElementById('numDays'), daysPassed, 2000);
                animateRollingNumber(document.getElementById('numPeople'), peopleCount, 2000);
                animateRollingNumber(document.getElementById('numGaokao'), daysToGaokao, 2000);
            }, 500);
        }

        function scrollToPage(idx) {
            var pages = document.getElementById('memoryPages');
            pages.scrollTo({ top: idx * window.innerHeight, behavior: 'smooth' });
        }

        function extractBvid(url) {
            if (!url) return null;
            var m = url.match(/BV[0-9A-Za-z]+/);
            return m ? m[0] : null;
        }

        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 启动
        runLoader();
    </script>
</body>
