<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;

  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 24px 28px;
    display: flex;

  }
  .header h1 {
    font-size: 20px;

    align-items: center;
    gap: 10px;
  }
  .header .count {
    background: rgba(255,255,255,0.25);

    border-radius: 20px;

    font-weight: 600;
  }
  .header .date {
    font-size: 13px;
    opacity: 0.9;
  }
  .toolbar {
    padding: 14px 20px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;

    gap: 10px;

  }
  .toolbar button {
    padding: 7px 14px;
    border: 1px solid #cbd5e1;
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    color: #475569;
    transition: all 0.2s;
    font-weight: 500;
  }
  .toolbar button:hover {
    background: #f1f5f9;
    border-color: #94a3b8;
  }
  .toolbar button.primary {
    background: #667eea;

  }
  .toolbar button.primary:hover {
    background: #5a67d8;
    border-color: #5a67d8;
  }
  .toolbar .spacer { flex: 1; }
  .file-list {
    padding: 16px 20px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }
  .file-list::-webkit-scrollbar { width: 6px; }
  .file-list::-webkit-scrollbar-track { background: #f1f5f9; }
  .file-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;

  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state .text { font-size: 14px; }
  .record-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .record-card:hover {
    border-color: #cbd5e1;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .record-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    background: #fafbfc;
  }
  .record-header:hover { background: #f8fafc; }
  .record-sender {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sender-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }
  .sender-info .name {
    font-weight: 600;
    color: #1e293b;
    font-size: 14px;
  }
  .sender-info .meta {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 2px;
  }
  .silent-tag {
    display: inline-block;
    background: #fef3c7;
    color: #d97706;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
  }
  .record-time {
    font-size: 12px;
    color: #94a3b8;
  }
  .expand-icon {
    margin-left: 8px;
    transition: transform 0.2s;
    color: #94a3b8;
  }
  .record-card.expanded .expand-icon {
    transform: rotate(180deg);
  }
  .record-detail {
    display: none;
    padding: 12px 18px 16px;
    border-top: 1px solid #f1f5f9;
  }
  .record-card.expanded .record-detail {
    display: block;
  }
  .file-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    transition: background 0.15s;
  }
  .file-item:last-child { margin-bottom: 0; }
  .file-item:hover { background: #f8fafc; }
  .file-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .file-icon.image { background: #fef3c7; }
  .file-icon.document { background: #dbeafe; }
  .file-icon.video { background: #fce7f3; }
  .file-icon.audio { background: #d1fae5; }
  .file-icon.archive { background: #e0e7ff; }
  .file-icon.other { background: #f1f5f9; }
  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-size: 13px;
    font-weight: 500;
    color: #334155;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-size {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 2px;
  }
  .file-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .file-actions button {
    padding: 6px 10px;
    border: 1px solid #e2e8f0;
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    color: #64748b;
    transition: all 0.15s;
  }
  .file-actions button:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
    color: #334155;
  }
  .file-actions button.open {
    background: #667eea;
    color: #fff;
    border-color: #667eea;
  }
  .file-actions button.open:hover {
    background: #5a67d8;
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: #94a3b8;
    font-size: 14px;
  }
  .loading .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #e2e8f0;
    border-top-color: #667eea;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .refresh-tip {
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    padding: 8px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 接收文件列表 <span class="count" id="totalCount">0</span></h1>
    <div class="date" id="todayDate"></div>
  </div>
  <div class="toolbar">
    <button onclick="refreshList()">🔄 刷新</button>
    <button onclick="openReceiveDir()">📂 打开接收文件夹</button>
    <div class="spacer"></div>
    <button class="primary" onclick="window.close()">✕ 关闭</button>
  </div>
  <div class="file-list" id="fileList">
    <div class="loading">
      <div class="spinner"></div>
      <div>加载中...</div>
    </div>
  </div>
  <div class="refresh-tip">每5秒自动刷新</div>
</div>

<script>
  let autoRefreshTimer = null;

  function formatDate(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function formatTime(ts) {
    try {
      const d = new Date(ts);
      return String(d.getHours()).padStart(2, '0') + ':' +
             String(d.getMinutes()).padStart(2, '0') + ':' +
             String(d.getSeconds()).padStart(2, '0');
    } catch(e) { return ''; }
  }

  function getFileIcon(type, name) {
    const ext = name.split('.').pop().toLowerCase();
    const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'];
    const docExts = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'md', 'rtf'];
    const videoExts = ['mp4', 'avi', 'mkv', 'mov', 'wmv', 'flv', 'webm'];
    const audioExts = ['mp3', 'wav', 'flac', 'aac', 'ogg', 'wma'];
    const archiveExts = ['zip', 'rar', '7z', 'tar', 'gz', 'bz2'];

    if (imageExts.includes(ext)) return { icon: '🖼️', cls: 'image' };
    if (docExts.includes(ext)) return { icon: '📄', cls: 'document' };
    if (videoExts.includes(ext)) return { icon: '🎬', cls: 'video' };
    if (audioExts.includes(ext)) return { icon: '🎵', cls: 'audio' };
    if (archiveExts.includes(ext)) return { icon: '📦', cls: 'archive' };
    return { icon: '📎', cls: 'other' };
  }

  function getInitial(name) {
    return name.charAt(0).toUpperCase();
  }

  // 自动检测服务器基础URL
  function getBaseUrl() {
    // 如果通过 http:// 访问，用当前 origin
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      return location.origin;
    }
    // 如果通过 file:// 打开，尝试连接本地服务器
    return 'http://127.0.0.1:8080';
  }

  async function loadRecords() {
    try {
      const baseUrl = getBaseUrl();
      const resp = await fetch(baseUrl + '/api/received-records', {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });

      if (!resp.ok) {
        throw new Error('服务器返回 HTTP ' + resp.status);
      }

      const contentType = resp.headers.get('Content-Type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error('服务器未返回JSON（可能start_server.py未更新）');
      }

      const data = await resp.json();
      renderRecords(data.records || []);
    } catch(e) {
      let hint = '';
      if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
        hint = '<br><small>无法连接服务器，请确认大屏程序正在运行</small>';
      } else if (e.message.includes('Unexpected token')) {
        hint = '<br><small>服务器返回了HTML而非JSON，请更新start_server.py到最新版本</small>';
      } else if (e.message.includes('未更新')) {
        hint = '<br><small>请将新的start_server.py复制到大屏电脑并重启程序</small>';
      }
      document.getElementById('fileList').innerHTML =
        '<div class="empty-state"><div class="icon">⚠️</div><div class="text">加载失败：' + e.message + hint + '</div></div>';
    }
  }

  function renderRecords(records) {
    const listEl = document.getElementById('fileList');
    const totalFiles = records.reduce((sum, r) => sum + (r.files?.length || 0), 0);
    document.getElementById('totalCount').textContent = totalFiles + ' 个文件';

    if (records.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <div class="text">今日暂无接收文件</div>
        </div>`;
      return;
    }

    let html = '';
    records.forEach((rec, idx) => {
      const sender = rec.realname || rec.sender || '未知';
      const silent = rec.silent;
      const files = rec.files || [];
      const timeStr = formatTime(rec.timestamp);
      const initial = getInitial(sender);
      const isExpanded = idx === 0; // 默认展开第一条

      html += `<div class="record-card ${isExpanded ? 'expanded' : ''}" data-idx="${idx}">`;
      html += `  <div class="record-header" onclick="toggleRecord(${idx})">`;
      html += `    <div class="record-sender">`;
      html += `      <div class="sender-avatar">${initial}</div>`;
      html += `      <div class="sender-info">`;
      html += `        <div class="name">${escapeHtml(sender)}`;
      if (silent) html += `          <span class="silent-tag">静默</span>`;
      html += `        </div>`;
      html += `        <div class="meta">${files.length} 个文件</div>`;
      html += `      </div>`;
      html += `    </div>`;
      html += `    <div style="display:flex;align-items:center;">`;
      html += `      <span class="record-time">${timeStr}</span>`;
      html += `      <span class="expand-icon">▼</span>`;
      html += `    </div>`;
      html += `  </div>`;
      html += `  <div class="record-detail">`;

      files.forEach((f, fidx) => {
        const iconInfo = getFileIcon(f.type, f.name);
        html += `<div class="file-item">`;
        html += `  <div class="file-icon ${iconInfo.cls}">${iconInfo.icon}</div>`;
        html += `  <div class="file-info">`;
        html += `    <div class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>`;
        html += `    <div class="file-size">${formatSize(f.size || 0)}</div>`;
        html += `  </div>`;
        html += `  <div class="file-actions">`;
        html += `    <button class="open" onclick="openFile(${idx}, ${fidx})">打开</button>`;
        html += `    <button onclick="openFileDir(${idx}, ${fidx})">所在位置</button>`;
        html += `  </div>`;
        html += `</div>`;
      });

      html += `  </div>`;
      html += `</div>`;
    });

    listEl.innerHTML = html;
  }

  function toggleRecord(idx) {
    const card = document.querySelector(`.record-card[data-idx="${idx}"]`);
    if (card) {
      card.classList.toggle('expanded');
    }
  }

  async function openFile(recIdx, fileIdx) {
    try {
      await fetch(getBaseUrl() + `/api/open-file?rec=${recIdx}&file=${fileIdx}`);
    } catch(e) {
      alert('打开文件失败：' + e.message);
    }
  }

  async function openFileDir(recIdx, fileIdx) {
    try {
      await fetch(getBaseUrl() + `/api/open-file-dir?rec=${recIdx}&file=${fileIdx}`);
    } catch(e) {
      alert('打开文件夹失败：' + e.message);
    }
  }

  async function openReceiveDir() {
    try {
      await fetch(getBaseUrl() + '/api/open-receive-dir');
    } catch(e) {
      alert('打开文件夹失败：' + e.message);
    }
  }

  function refreshList() {
    loadRecords();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // 初始化
  document.getElementById('todayDate').textContent = formatDate(new Date());
  loadRecords();

  // 自动刷新
  autoRefreshTimer = setInterval(loadRecords, 5000);

  // 阻止关闭窗口时的确认（pywebview直接关闭）
  window.onbeforeunload = null;
</script>
</body>
</html>
