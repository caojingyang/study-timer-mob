// 导出当前座位表为 Excel 文件
function exportToExcel() {
    if (!state.currentTemplate || Object.keys(state.arrangement).length === 0) {
        showToast('请先排座再导出', 'warning');
        return;
    }

    const template = state.currentTemplate;
    const arrangement = state.arrangement;

    // 中文数字映射
    const cnNums = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

    // 计算总列数和列类型（第0列为行标签，之后为座位/过道）
    let totalCols = 1; // 第0列：行标签
    let colTypes = ['label'];
    for (const g of template.groups) {
        if (g.aisle) {
            totalCols += 1;
            colTypes.push('aisle');
        } else {
            totalCols += g.cols;
            for (let c = 0; c < g.cols; c++) colTypes.push('seat');
        }
    }

    const seatGroups = template.groups.filter(g => !g.aisle);
    // 最大行数需考虑offset：组实际占用的行数为 rows + offset
    const maxRows = Math.max(...seatGroups.map(g => g.rows + (g.offset || 0)));

    // 通用样式：宋体11pt不加粗、居中对齐、wrapText、thin边框
    const thinBorder = { top: { style: 'thin' }, bottom: { style: 'thin' }, left: { style: 'thin' }, right: { style: 'thin' } };
    const cellFont = { name: '宋体', sz: 11, bold: false };
    const centerAlign = { horizontal: 'center', vertical: 'center', wrapText: true };

    // 构建网格数据和座位标记（第0列为行标签）
    let grid = [];
    let seatCellMap = [];
    for (let r = 0; r < maxRows; r++) {
        let row = new Array(totalCols).fill('');
        let isSeatRow = new Array(totalCols).fill(false);

        // 行标签：第七排、第六排...
        row[0] = `第${cnNums[maxRows - r] || (maxRows - r)}排`;

        let col = 1; // 从第1列开始（跳过行标签列）
        let sgIdx = 0;
        for (const g of template.groups) {
            if (g.aisle) {
                col += 1;
            } else {
                const offset = g.offset || 0;
                for (let c = 0; c < g.cols; c++) {
                    const adjustedRow = r - offset;
                    if (adjustedRow >= 0 && adjustedRow < g.rows) {
                        const seatId = `seat-${sgIdx}-${adjustedRow}-${c}`;
                        const student = arrangement[seatId];
                        if (student) row[col + c] = student.name;
                        isSeatRow[col + c] = true;
                    }
                }
                col += g.cols;
                sgIdx++;
            }
        }
        grid.push(row);
        seatCellMap.push(isSeatRow);
    }

    // 座位与讲台间空一行
    grid.push(new Array(totalCols).fill(''));
    seatCellMap.push(new Array(totalCols).fill(false));

    // 讲台行
    let podiumRow = new Array(totalCols).fill('');
    const podiumStart = template.podium ? template.podium.startGroup : 0;
    const podiumEnd = template.podium ? template.podium.endGroup : 0;

    // 计算讲台列范围（列索引偏移+1，因第0列为行标签）
    let podiumStartCol = -1, podiumEndCol = -1;
    let col = 1, sgIdx = 0;
    for (const g of template.groups) {
        if (g.aisle) {
            if (sgIdx > podiumStart && sgIdx <= podiumEnd) {
                if (podiumStartCol === -1) podiumStartCol = col;
                podiumEndCol = col;
            }
            col += 1;
        } else {
            if (sgIdx >= podiumStart && sgIdx <= podiumEnd) {
                if (podiumStartCol === -1) podiumStartCol = col;
                podiumEndCol = col + g.cols - 1;
            }
            col += g.cols;
            sgIdx++;
        }
    }
    // 后备：居中
    if (podiumStartCol < 0 || podiumEndCol < 0) {
        const center = Math.floor(totalCols / 2);
        podiumStartCol = Math.max(1, center - 3);
        podiumEndCol = Math.min(totalCols - 1, center + 3);
    }
    // 收窄讲台范围：排除起始组首列和结束组末列，匹配上传表格的 F:J 合并范围
    if (podiumEndCol - podiumStartCol >= 4) {
        podiumStartCol += 1;
        podiumEndCol -= 1;
    }
    podiumRow[podiumStartCol] = '讲台';
    const podiumRowIdx = grid.length;
    grid.push(podiumRow);
    seatCellMap.push(new Array(totalCols).fill(false));

    // 创建工作表
    const ws = XLSX.utils.aoa_to_sheet(grid);

    // 列宽：行标签8，座位10，过道3
    ws['!cols'] = colTypes.map(t => ({ wch: t === 'label' ? 8 : (t === 'aisle' ? 3 : 10) }));

    // 行高：座位28，空行10，讲台26
    ws['!rows'] = [];
    for (let r = 0; r < maxRows; r++) ws['!rows'].push({ hpt: 28 });
    ws['!rows'].push({ hpt: 10 });
    ws['!rows'].push({ hpt: 26 });

    // 合并讲台单元格
    ws['!merges'] = [{ s: { r: podiumRowIdx, c: podiumStartCol }, e: { r: podiumRowIdx, c: podiumEndCol } }];

    // 隐藏网格线
    ws['!views'] = [{ showGridLines: false }];

    // 为座位格应用样式（空座位也保留框线，行标签列不加边框）
    for (let r = 0; r < maxRows; r++) {
        for (let c = 0; c < totalCols; c++) {
            if (seatCellMap[r][c]) {
                const cellRef = XLSX.utils.encode_cell({ r: r, c: c });
                if (ws[cellRef]) {
                    ws[cellRef].s = { border: thinBorder, alignment: centerAlign, font: cellFont };
                } else {
                    ws[cellRef] = { t: 's', v: '', s: { border: thinBorder, alignment: centerAlign, font: cellFont } };
                }
            }
        }
        // 行标签样式：居中、宋体11pt、无边框
        const labelRef = XLSX.utils.encode_cell({ r: r, c: 0 });
        if (ws[labelRef]) {
            ws[labelRef].s = { alignment: centerAlign, font: cellFont };
        }
    }

    // 讲台格样式
    const podiumCellRef = XLSX.utils.encode_cell({ r: podiumRowIdx, c: podiumStartCol });
    if (ws[podiumCellRef]) {
        ws[podiumCellRef].s = { border: thinBorder, alignment: centerAlign, font: cellFont };
    } else {
        ws[podiumCellRef] = { t: 's', v: '讲台', s: { border: thinBorder, alignment: centerAlign, font: cellFont } };
    }

    // 创建工作簿并写入文件
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '座位表');
    XLSX.writeFile(wb, (state.seatingTableName || '座位表') + '.xlsx');
    showToast('座位表已导出', 'success');
}

</script>
