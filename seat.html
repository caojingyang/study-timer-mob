<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高二（13）班智能排座系统</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- pinyin-pro 用于拼音/首字母搜索 -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>
    <!-- SheetJS 用于 Excel 导入导出 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome 本地 CSS -->
    <link rel="stylesheet" href="font-awesome.min.css">
    <style>
        /* ==================== CSS 变量与全局样式 ==================== */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --primary-bg: #eef2ff;
            --boy-bg: #dbeafe;
            --boy-text: #1e40af;
            --boy-border: #93c5fd;
            --girl-bg: #fbcfe8;
            --girl-text: #9d174d;
            --girl-border: #f472b6;
            --star-border: #f59e0b;
            --star-bg: #fef3c7;
            --progress-border: #22c55e;
            --progress-bg: #dcfce7;
            --seat-border: #94a3b8;
            --seat-empty-bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #1e293b;
        }

        /* ==================== 顶部标题栏 ==================== */
        .app-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #6366f1 100%);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.35); }
        .header-user {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ==================== 手机端提示横幅 ==================== */
        .mobile-banner {
            background: linear-gradient(90deg, #f59e0b, #f97316);
            color: white;
            padding: 10px 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ==================== 主区域布局 ==================== */
        .main-container {
            display: flex;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 60px);
        }
        .left-panel {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .right-panel {
            flex: 0 0 auto;
            width: 120px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .right-header {
            padding: 12px 10px 8px;
            border-bottom: 1px solid #f1f5f9;
        }
        .right-header h3 {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ==================== 搜索框 ==================== */
        .search-box {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--primary-light); }

        /* ==================== 学生名单 ==================== */
        .student-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }
        .student-list::-webkit-scrollbar { width: 6px; }
        .student-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .student-list::-webkit-scrollbar-track { background: transparent; }
        .student-card {
            padding: 4px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: grab;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 2px dashed var(--seat-border);
            text-align: center;
            position: relative;
            box-sizing: border-box;
            width: 78px;
            min-height: 52px;
            align-self: center;
            background: var(--seat-empty-bg);
        }
        .student-card:hover { transform: translateX(3px); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
        .student-card:active { cursor: grabbing; }
        .student-card.boy { background: var(--boy-bg); color: var(--boy-text); border-color: var(--boy-border); }
        .student-card.girl { background: var(--girl-bg); color: var(--girl-text); border-color: var(--girl-border); }
        .student-card.star { border: 2px dashed var(--star-border); background: var(--star-bg); }
        .student-card.progress { border: 2px dashed var(--progress-border); background: var(--progress-bg); }
        .student-card.seated { opacity: 0.4; text-decoration: line-through; }
        .card-number {
            position: absolute;
            top: -6px; right: -6px;
            background: var(--progress-border);
            color: white;
            border-radius: 50%;
            width: 20px; height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            z-index: 1;
        }
        .right-footer { padding: 10px; border-top: 1px solid #f1f5f9; }

        /* ==================== 按钮 ==================== */
        .btn {
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
        .btn-secondary { background: linear-gradient(135deg, #f1f5f9, #e2e8f0); color: #475569; }
        .btn-secondary:hover { background: linear-gradient(135deg, #e2e8f0, #cbd5e1); }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; box-shadow: 0 2px 8px rgba(34,197,94,0.3); }
        .btn-success:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,0.4); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
        .btn-lg { padding: 14px 28px; font-size: 16px; border-radius: 12px; }

        /* ==================== 空状态 ==================== */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #94a3b8;
        }
        .empty-state-icon { font-size: 64px; }
        .empty-state-text { font-size: 18px; font-weight: 500; }
        .empty-state-buttons { display: flex; gap: 16px; }

        /* ==================== 座位区域 ==================== */
        .seating-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px 0;
            transform-origin: top center;
        }
        .seating-scale-wrapper {
            flex: 1;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }
        .seat-groups-row { display: flex; gap: 12px; align-items: flex-start; }
        .seat-group { display: flex; flex-direction: column; gap: 8px; }
        .seat-row { display: flex; gap: 8px; }
        .seat {
            border: 2px dashed var(--seat-border);
            border-radius: 10px;
            min-height: 52px;
            min-width: 78px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--seat-empty-bg);
            font-size: 14px;
            font-weight: 600;
            padding: 4px;
            text-align: center;
            position: relative;
        }
        .seat:hover { border-color: var(--primary-light); background: var(--primary-bg); }
        .seat.drag-over {
            background: #c7d2fe;
            border-color: var(--primary);
            border-style: solid;
            transform: scale(1.05);
        }
        .seat.occupied {
            border-style: solid;
            border-color: var(--primary);
            background: var(--primary-bg);
            cursor: grab;
        }
        .seat.occupied.boy { background: var(--boy-bg); border-color: var(--boy-border); color: var(--boy-text); }
        .seat.occupied.girl { background: var(--girl-bg); border-color: var(--girl-border); color: var(--girl-text); }
        .seat.occupied.star { border: 2px dashed var(--star-border); background: var(--star-bg); }
        .seat.occupied.progress { border: 2px dashed var(--progress-border); background: var(--progress-bg); }
        .aisle-spacer { min-width: 24px; }
        .podium-spacer-row { height: 16px; }
        .podium-row { display: flex; gap: 12px; }
        .podium {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 8px;
            box-shadow: 0 4px 16px rgba(79,70,229,0.2);
        }

        /* ==================== 拖拽遮罩 ==================== */
        .drag-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            padding: 10px;
            z-index: 10;
            pointer-events: none;
        }

        /* ==================== 模态框 ==================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.95) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-card.large { width: 900px; }
        .modal-card.medium { width: 600px; }
        .modal-card.small { width: 400px; }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .modal-title { font-size: 20px; font-weight: 700; color: #1e293b; }
        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 32px; height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            color: #64748b;
        }
        .modal-close:hover { background: #e2e8f0; }
        .modal-body { margin-bottom: 16px; }
        .modal-footer { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }

        /* ==================== 模板/历史卡片 ==================== */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .template-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-card:hover { border-color: var(--primary-light); box-shadow: 0 4px 16px rgba(99,102,241,0.15); transform: translateY(-2px); }
        .template-card-name { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .template-card-info { font-size: 13px; color: #64748b; }
        .history-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
        }
        .history-card:hover { border-color: var(--primary-light); box-shadow: 0 4px 16px rgba(99,102,241,0.1); }
        .history-card.incomplete { border-color: var(--star-border); background: #fffbeb; }
        .history-card-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .history-card-meta { font-size: 13px; color: #64748b; margin-bottom: 10px; }
        .history-card-actions { display: flex; gap: 8px; }

        /* ==================== 预览表格 ==================== */
        .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .preview-table th, .preview-table td { border: 1px solid #e2e8f0; padding: 6px 10px; text-align: center; }
        .preview-table th { background: #f8fafc; font-weight: 600; }
        .preview-table th.highlighted { background: #fef3c7; border: 2px solid #f59e0b; }
        .preview-table td.highlighted { background: #fffbeb; }

        /* ==================== 星选网格 ==================== */
        .star-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin: 16px 0;
        }
        .star-card {
            padding: 8px 4px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            position: relative;
        }
        .star-card.boy { background: var(--boy-bg); color: var(--boy-text); }
        .star-card.girl { background: var(--girl-bg); color: var(--girl-text); }
        .star-card.is-star { border: 2px dashed var(--star-border); background: var(--star-bg); cursor: not-allowed; }
        .star-card.selected { border: 2px solid var(--progress-border); background: var(--progress-bg); }
        .star-card .star-badge {
            position: absolute;
            top: -6px; right: -6px;
            background: var(--progress-border);
            color: white;
            border-radius: 50%;
            width: 20px; height: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==================== 无权限界面 ==================== */
        .no-permission {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 9999;
        }
        .no-permission i { font-size: 64px; color: #ef4444; }
        .no-permission h2 { font-size: 28px; margin: 0; }
        .no-permission p { font-size: 16px; color: #94a3b8; }

        /* ==================== Toast 提示 ==================== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast.error { background: #dc2626; }
        .toast.success { background: #16a34a; }
        .toast.warning { background: #d97706; }

        /* ==================== 选座顺序指示器 ==================== */
        .selection-indicator {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #92400e;
        }
        .selection-indicator.active { display: flex; }
        .selection-indicator .next-name {
            background: white;
            padding: 4px 12px;
            border-radius: 8px;
            color: #1e40af;
            font-weight: 700;
        }

        /* ==================== 座位工具栏 ==================== */
        .seating-toolbar {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .seating-info { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 8px; }

        /* ==================== 表单元素 ==================== */
        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--primary-light); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #475569; }

        /* ==================== 文件上传区 ==================== */
        .file-upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-upload-area:hover { border-color: var(--primary-light); background: var(--primary-bg); }
        .file-upload-area i { font-size: 40px; color: #94a3b8; margin-bottom: 8px; }

        /* ==================== 标签 ==================== */
        .info-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-star { background: #fef3c7; color: #92400e; }
        .badge-progress { background: #dcfce7; color: #166534; }

        /* ==================== 拖拽幽灵元素 ==================== */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            transform: translate(-50%, -50%);
            transition: none;
        }

        /* ==================== 响应式 ==================== */
        @media (max-width: 900px) {
            .main-container { flex-direction: column; height: auto; min-height: calc(100vh - 60px); }
            .left-panel { flex: 1 1 auto; width: 100%; min-height: 400px; }
            .right-panel { flex: 1 1 auto; width: 100%; max-height: 380px; }
            .header-title { font-size: 16px; }
            .seat { min-width: 60px; min-height: 44px; font-size: 12px; }
            .student-card { width: 60px; min-height: 44px; font-size: 12px; }
            .star-grid { grid-template-columns: repeat(4, 1fr); }
            .left-toolbar { gap: 8px; }
            .left-toolbar h3 { font-size: 16px; }
            .toolbar-actions .btn { padding: 8px 12px; font-size: 13px; }
        }
    </style>
</head>
<body>

<!-- ==================== 无权限界面 ==================== -->
<div class="no-permission" id="noPermissionScreen">
    <i class="fa fa-lock"></i>
    <h2>无访问权限</h2>
    <p>您没有权限访问此页面，请联系管理员。</p>
</div>

<!-- ==================== 主应用内容 ==================== -->
<div id="appContent" style="display:none;">
    <!-- 顶部标题栏 -->
    <header class="app-header">
        <a href="javascript:history.back()" class="back-btn">
            <i class="fa fa-arrow-left"></i> 返回移动端
        </a>
        <div class="header-title">🪑 高二（13）班智能排座系统</div>
        <div class="header-user" id="headerUser">
            <i class="fa fa-user-circle"></i>
            <span id="userName">用户</span>
        </div>
    </header>

    <!-- 手机端提示横幅 -->
    <div class="mobile-banner" id="mobileBanner">
        <i class="fa fa-mobile"></i> 建议在电脑上打开此网页效果更佳
    </div>

    <!-- 主区域：左侧座位区 + 右侧名单区 -->
    <div class="main-container">
        <!-- 左侧座位区域 -->
        <div class="left-panel" id="leftPanel"></div>
        <!-- 右侧学生名单 -->
        <div class="right-panel">
            <div class="right-header">
                <h3><i class="fa fa-users"></i> 学生名单</h3>
                <input type="text" class="search-box" id="searchBox" placeholder="搜索姓名/拼音..." oninput="filterStudentList(this.value)">
            </div>
            <div class="student-list" id="studentList">
                <div class="drag-overlay" id="dragOverlay">
                    <div>
                        <i class="fa fa-trash" style="font-size:28px;"></i><br>
                        松开移回名单
                    </div>
                </div>
            </div>
            <div class="right-footer">
                <button class="btn btn-warning" style="width:100%;" onclick="startStarSelection()">
                    <i class="fa fa-trophy"></i> 学习之星、进步之星选座
                </button>
            </div>
        </div>

// 学生卡片拖拽事件委托：只需在容器上绑定一次

    const studentList = document.getElementById('studentList');

    // 学生卡片鼠标拖拽
    studentList.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const card = e.target.closest('.student-card');
        if (!card || card.classList.contains('seated')) return;
        e.preventDefault();
        startCustomDrag({
            type: 'student',
            name: card.dataset.name,
            gender: card.dataset.gender,
            sourceElement: card
        }, e);
    });

    // 学生卡片触摸拖拽
    studentList.addEventListener('touchstart', (e) => {
        const card = e.target.closest('.student-card');
        if (!card || card.classList.contains('seated')) return;
        e.preventDefault();
        const touch = e.touches[0];
        startCustomDrag({
            type: 'student',
            name: card.dataset.name,
            gender: card.dataset.gender,
            sourceElement: card
        }, { clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });

    // 座位拖拽事件委托：在座位容器上绑定一次
    const seatingContainer = document.getElementById('seatingContainer');

    // 已入座座位鼠标拖拽（移动）
    seatingContainer.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        const seat = e.target.closest('.seat.occupied');
        if (!seat) return;
        e.preventDefault();

        startCustomDrag({
            type: 'move',
            fromSeat: seat.dataset.seatId,
            name: seat.dataset.studentName,
            gender: seat.dataset.gender,
            sourceElement: seat
        }, e);
    });

    // 已入座座位触摸拖拽（移动）
    seatingContainer.addEventListener('touchstart', (e) => {
        const seat = e.target.closest('.seat.occupied');
        if (!seat) return;

        }, { clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });
}

// HTML 转义，防止XSS
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = String(text == null ? '' : text);
    return div.innerHTML;
}

// 显示Toast提示
function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type;
    toast.style.display = 'block';
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2800);
}

// 计算模板的总座位数
function countTotalSeats(template) {
    if (!template || !template.groups) return 0;
    return template.groups.filter(g => !g.aisle).reduce((sum, g) => sum + g.cols * g.rows, 0);
}

// 拼音匹配：检查学生姓名是否匹配关键词（支持中文、拼音、首字母）
function matchPinyin(name, keyword) {
    if (!keyword) return true;
    const kw = keyword.toLowerCase().trim();
    if (!kw) return true;
    // 直接包含中文
    if (name.includes(keyword)) return true;
    try {
        const { pinyin } = pinyinPro;
        const fullPinyin = pinyin(name, { toneType: 'none' }).replace(/\s/g, '').toLowerCase();
        const firstLetters = pinyin(name, { pattern: 'first', toneType: 'none' }).replace(/\s/g, '').toLowerCase();
        if (fullPinyin.includes(kw)) return true;
        if (firstLetters.includes(kw)) return true;
        // 逐字匹配（如输入 "bza" 匹配 "毕子昂"）
        const chars = name.split('');
        const charFirst = chars.map(c => pinyin(c, { pattern: 'first', toneType: 'none' }).replace(/\s/g, '').toLowerCase()).join('');
        if (charFirst.includes(kw)) return true;
    } catch(e) { /* pinyin-pro 未加载时回退到纯中文匹配 */ }
    return false;
}

async function continueIncomplete(tableId) {
    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/seat_tables?id=eq.${tableId}&select=*`);
        const data = await resp.json();
        if (data && data.length > 0) {
            const table = data[0];
            // CloudBase PostgREST 可能返回 JSON 字符串，需统一解析
            state.currentTemplate = typeof table.template_layout === 'string' ? JSON.parse(table.template_layout) : (table.template_layout || {});
            state.arrangement = typeof table.arrangement === 'string' ? JSON.parse(table.arrangement) : (table.arrangement || {});
            state.students = typeof table.student_list === 'string' ? JSON.parse(table.student_list) : (table.student_list || [...DEFAULT_STUDENTS]);
            state.starStudents = typeof table.star_students === 'string' ? JSON.parse(table.star_students) : (table.star_students || []);
            state.progressStudents = typeof table.progress_students === 'string' ? JSON.parse(table.progress_students) : (table.progress_students || []);
            state.seatingTableName = table.name;
            state.seatTableId = table.id;
            state.isCompleted = false;
            state.phase = 'arranging';
            buildSelectionOrder();
            renderStudentList();
            renderLeftPanel();
            showToast(`已恢复座位表: ${table.name}`, 'success');
        }
    } catch(e) {
        console.error('恢复座位表失败:', e);
        showToast('恢复座位表失败', 'error');
    }
}

/* ==================== 座位渲染 ==================== */

// 渲染主座位区域
function renderSeats() {
    const container = document.getElementById('seatingContainer');
    if (!container || !state.currentTemplate) return;
    container.innerHTML = '';
    const template = state.currentTemplate;

    // 预计算星标学生姓名集合（O(1) 查找，避免在循环内重复创建数组）
    const starNameSet = new Set(state.starStudents.map(s => s.name));
    const progressNameSet = new Set(state.progressStudents.map(s => s.name));

    // 使用 DocumentFragment 批量插入，减少布局回流
    const frag = document.createDocumentFragment();

    // 构建座位组行
    const groupsRow = document.createElement('div');
    groupsRow.className = 'seat-groups-row';

    let seatGroupIdx = 0;
    for (const g of template.groups) {
        if (g.aisle) {
            // 过道：空白间隔
            const spacer = document.createElement('div');
            spacer.className = 'aisle-spacer';
            groupsRow.appendChild(spacer);
        } else {
            // 座位组
            const groupDiv = document.createElement('div');
            groupDiv.className = 'seat-group';
            // 如果组有offset，向下平移
            if (g.offset && g.offset > 0) {
                const seatHeight = 52; // 座位最小高度
                const rowGap = 8; // 座位行间距
                groupDiv.style.marginTop = (g.offset * (seatHeight + rowGap)) + 'px';
            }
            for (let r = 0; r < g.rows; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';
                for (let c = 0; c < g.cols; c++) {
                    const seatId = `seat-${seatGroupIdx}-${r}-${c}`;
                    const seat = createSeat(seatId, starNameSet, progressNameSet);
                    rowDiv.appendChild(seat);
                }
                groupDiv.appendChild(rowDiv);
            }
            groupsRow.appendChild(groupDiv);
            seatGroupIdx++;
        }
    }
    frag.appendChild(groupsRow);

    // 讲台与座位间空一行
    const spacer = document.createElement('div');
    spacer.className = 'podium-spacer-row';
    frag.appendChild(spacer);

    // 讲台
    container.appendChild(frag);
    renderPodium(container, template, false);

    // 桌面端自动缩放
    requestAnimationFrame(() => scaleSeatingContainer());
}

// 创建单个座位元素（使用预计算的 Set 进行 O(1) 查找，不再绑定事件监听器）
function createSeat(seatId, starNameSet, progressNameSet) {
    const seat = document.createElement('div');
    seat.className = 'seat';
    seat.id = seatId;
    seat.dataset.seatId = seatId;
    seat.dataset.dropTarget = 'seat';

    const occupied = state.arrangement[seatId];
    if (occupied) {
        // 已入座：实线边框，按性别着色
        seat.classList.add('occupied');
        seat.classList.add(occupied.gender === '男' ? 'boy' : 'girl');

        // 学习之星/进步之星高亮（O(1) Set 查找）
        if (starNameSet.has(occupied.name)) seat.classList.add('star');
        if (progressNameSet.has(occupied.name)) seat.classList.add('progress');

        seat.textContent = occupied.name;
        seat.dataset.studentName = occupied.name;
        seat.dataset.gender = occupied.gender;
        // 拖拽事件通过事件委托处理（见 _initSeatDelegation）
    } else {
        seat.textContent = '';
    }
    return seat;
}

// 渲染讲台（根据模板的 podium 配置合并居中显示）
function renderPodium(container, template, mini = false) {
    const podiumStart = template.podium ? template.podium.startGroup : 0;
    const podiumEnd = template.podium ? template.podium.endGroup : 0;

    // 用 flex 值计算讲台前、讲台、讲台后的宽度比例
    let beforeFlex = 0, podiumFlex = 0, afterFlex = 0;
    let seatGroupIdx = 0;
    for (const g of template.groups) {
        if (g.aisle) {
            if (seatGroupIdx > podiumStart && seatGroupIdx <= podiumEnd) {
                podiumFlex += 1;
            } else if (seatGroupIdx <= podiumStart) {
                beforeFlex += 1;
            } else {
                afterFlex += 1;
            }
        } else {
            if (seatGroupIdx >= podiumStart && seatGroupIdx <= podiumEnd) {
                podiumFlex += g.cols;
            } else if (seatGroupIdx < podiumStart) {
                beforeFlex += g.cols;
            } else {
                afterFlex += g.cols;
            }
            seatGroupIdx++;
        }
    }

    const podiumRow = document.createElement('div');
    podiumRow.className = 'podium-row';
    podiumRow.style.width = '100%';

    if (beforeFlex > 0) {
        const before = document.createElement('div');
        before.style.flex = beforeFlex;
        podiumRow.appendChild(before);
    }
    const podium = document.createElement('div');
    podium.className = 'podium';
    podium.style.flex = podiumFlex;
    podium.textContent = '讲　台';
    if (mini) {
        podium.style.fontSize = '12px';
        podium.style.padding = '6px';
        podium.style.letterSpacing = '4px';
    }
    podiumRow.appendChild(podium);
    if (afterFlex > 0) {
        const after = document.createElement('div');
        after.style.flex = afterFlex;
        podiumRow.appendChild(after);
    }
    container.appendChild(podiumRow);
}

// 渲染模板预览（缩小版座位）
function renderSeatsPreview(container) {
    if (!state.currentTemplate) return;
    const template = state.currentTemplate;
    const groupsRow = document.createElement('div');
    groupsRow.className = 'seat-groups-row';

    let seatGroupIdx = 0;
    for (const g of template.groups) {

            spacer.className = 'aisle-spacer';
            spacer.style.minWidth = '16px';
            groupsRow.appendChild(spacer);
        } else {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'seat-group';
            // 如果组有offset，向下平移（预览模式缩小尺寸）
            if (g.offset && g.offset > 0) {
                const previewSeatHeight = 28;
                const previewRowGap = 4;
                groupDiv.style.marginTop = (g.offset * (previewSeatHeight + previewRowGap)) + 'px';
            }
            for (let r = 0; r < g.rows; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'seat-row';

// 座位表自动缩放以适应左侧面板（桌面端）
function scaleSeatingContainer() {
    const wrapper = document.getElementById('seatingScaleWrapper');
    const container = document.getElementById('seatingContainer');
    if (!wrapper || !container) return;
    container.style.transform = 'scale(1)';
    const wrapperRect = wrapper.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();
    if (containerRect.width === 0 || containerRect.height === 0) return;
    const scaleX = wrapperRect.width / containerRect.width;
    const scaleY = wrapperRect.height / containerRect.height;
    const scale = Math.min(scaleX, scaleY, 1); // 不放大超过100%
    if (scale < 1) {
        container.style.transform = `scale(${scale})`;
        container.style.transformOrigin = 'top center';
    }
}

// 窗口大小变化时重新缩放
window.addEventListener('resize', () => {
    if (state.phase === 'arranging') {
        clearTimeout(window._resizeTimer);
        window._resizeTimer = setTimeout(scaleSeatingContainer, 100);
    }
});

// 渲染右侧学生名单
function renderStudentList() {
    const list = document.getElementById('studentList');
    // 保留 dragOverlay 元素
    const overlay = document.getElementById('dragOverlay');
    list.innerHTML = '';
    if (overlay) list.appendChild(overlay);

    // 预计算查找集合（O(1) 查找，避免循环内 find/includes）
    const seatedNameSet = new Set(Object.values(state.arrangement).map(s => s.name));
    const starMap = new Map(state.starStudents.map(s => [s.name, s]));
    const progressMap = new Map(state.progressStudents.map(s => [s.name, s]));
    const keyword = state.searchKeyword;

    // 使用 DocumentFragment 批量插入
    const frag = document.createDocumentFragment();

    state.students.forEach(student => {
        // 搜索过滤
        if (keyword && !matchPinyin(student.name, keyword)) return;

        const card = document.createElement('div');
        card.className = `student-card ${student.gender === '男' ? 'boy' : 'girl'}`;
        card.textContent = student.name;
        card.dataset.name = student.name;
        card.dataset.gender = student.gender;

        // 学习之星/进步之星高亮（O(1) Map 查找）
        const starInfo = starMap.get(student.name);
        const progressInfo = progressMap.get(student.name);
        if (starInfo) {
            card.classList.add('star');
        } else if (progressInfo) {
            card.classList.add('progress');
            const badge = document.createElement('span');
            badge.className = 'card-number';
            badge.textContent = progressInfo.order;
            card.appendChild(badge);
        }

        // 已入座学生半透明（O(1) Set 查找）
        const isSeated = seatedNameSet.has(student.name);
        if (isSeated) {
            card.classList.add('seated');
        }

        // 拖拽事件通过事件委托处理（见 _initStudentCardDelegation），不再逐个绑定
        frag.appendChild(card);
    });

    list.appendChild(frag);

    // 无匹配结果提示
    if (list.children.length <= 1) {
        const empty = document.createElement('div');
        empty.style.cssText = 'text-align:center;color:#94a3b8;padding:20px;font-size:13px;';
        empty.textContent = keyword ? '未找到匹配学生' : '暂无学生';
        list.appendChild(empty);
    }
}

// 搜索过滤学生名单（防抖，避免每次按键都触发完整渲染）
let _searchTimer = null;
function filterStudentList(value) {

    if (_searchTimer) clearTimeout(_searchTimer);

/* ==================== 自定义拖拽系统（鼠标+触摸） ==================== */
// 使用自定义事件系统实现可靠的拖拽，不依赖HTML5原生drag API

let _dragState = {
    active: false,       // 是否正在拖拽
    data: null,          // 拖拽数据 {type, name, gender, sourceElement, fromSeat}
    ghost: null,         // 跟随鼠标的幽灵元素
    currentTarget: null  // 当前高亮的目标座位
};

// 开始拖拽
function startCustomDrag(data, e) {
    // 已入座的学生卡片不可拖动（使用 Set 优化）
    if (data.type === 'student') {
        const seatedNameSet = new Set(Object.values(state.arrangement).map(s => s.name));
        if (seatedNameSet.has(data.name)) return;
    }

    _dragState.active = true;
    _dragState.data = data;
    _dragState.currentTarget = null;

    // 创建拖拽幽灵元素（克隆源元素）
    const ghost = data.sourceElement.cloneNode(true);
    ghost.className = 'drag-ghost ' + data.sourceElement.className.replace('drag-ghost', '');
    ghost.style.width = data.sourceElement.offsetWidth + 'px';
    ghost.style.height = data.sourceElement.offsetHeight + 'px';
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    document.body.appendChild(ghost);
    _dragState.ghost = ghost;

    // 高亮源元素
    if (data.sourceElement) {
        data.sourceElement.style.opacity = '0.4';
    }

    // 添加全局事件监听
    document.addEventListener('mousemove', _onDragMove);
    document.addEventListener('mouseup', _onDragEnd);
    document.addEventListener('touchmove', _onDragMoveTouch, { passive: false });
    document.addEventListener('touchend', _onDragEndTouch);
}

// 鼠标移动处理
function _onDragMove(e) {
    if (!_dragState.active) return;
    e.preventDefault();
    _updateGhostPosition(e.clientX, e.clientY);
    _checkDropTarget(e.clientX, e.clientY);
}

// 触摸移动处理
function _onDragMoveTouch(e) {
    if (!_dragState.active) return;
    e.preventDefault();
    const touch = e.touches[0];
    _updateGhostPosition(touch.clientX, touch.clientY);
    _checkDropTarget(touch.clientX, touch.clientY);
}

// 更新幽灵元素位置
function _updateGhostPosition(x, y) {
    if (_dragState.ghost) {
        _dragState.ghost.style.left = x + 'px';
        _dragState.ghost.style.top = y + 'px';
    }
}

// 检查鼠标下方的放置目标
function _checkDropTarget(x, y) {
    // 清除之前的高亮
    if (_dragState.currentTarget) {
        _dragState.currentTarget.classList.remove('drag-over');
        _dragState.currentTarget = null;
    }

    // 临时隐藏幽灵元素以便 elementFromPoint 获取下方元素
    if (_dragState.ghost) _dragState.ghost.style.display = 'none';
    const elem = document.elementFromPoint(x, y);
    if (_dragState.ghost) _dragState.ghost.style.display = 'block';

    if (!elem) return;

    // 检查是否悬停在座位上
    const seatEl = elem.closest('.seat[data-drop-target="seat"]');
    if (seatEl) {
        seatEl.classList.add('drag-over');
        _dragState.currentTarget = seatEl;
    }

    // 检查是否悬停在学生列表区域（仅移动操作显示取消遮罩）
    const listEl = elem.closest('#studentList');
    const overlay = document.getElementById('dragOverlay');
    if (listEl && _dragState.data.type === 'move') {
        if (overlay) overlay.style.display = 'flex';
    } else {
        if (overlay) overlay.style.display = 'none';
    }
}

// 鼠标释放处理
function _onDragEnd(e) {
    if (!_dragState.active) return;
    _finishDrag(e.clientX, e.clientY);
}

// 触摸释放处理
function _onDragEndTouch(e) {
    if (!_dragState.active) return;
    const touch = e.changedTouches[0];
    _finishDrag(touch.clientX, touch.clientY);
}

// 完成拖拽：检测放置目标并执行操作
function _finishDrag(x, y) {
    const data = _dragState.data;

    // 临时隐藏幽灵元素以获取下方元素
    if (_dragState.ghost) _dragState.ghost.style.display = 'none';
    const elem = document.elementFromPoint(x, y);

    if (elem) {
        // 放置到座位
        const seatEl = elem.closest('.seat[data-drop-target="seat"]');
        if (seatEl) {
            const seatId = seatEl.dataset.seatId;
            handleDrop(seatId, data);
        }

        // 放置到学生列表（仅移动操作 → 移回名单取消排位）
        if (data.type === 'move') {
            const listEl = elem.closest('#studentList');
            if (listEl) {
                removeStudentFromSeat(data.fromSeat);
                showToast(`已将 ${data.name} 移回名单`, 'success');
            }
        }
    }

    _cleanupDrag();
}

// 清理拖拽状态
function _cleanupDrag() {
    // 移除幽灵元素
    if (_dragState.ghost) {
        _dragState.ghost.remove();
        _dragState.ghost = null;
    }
    // 恢复源元素透明度
    if (_dragState.data && _dragState.data.sourceElement) {
        _dragState.data.sourceElement.style.opacity = '';
    }
    // 清除目标高亮
    if (_dragState.currentTarget) {
        _dragState.currentTarget.classList.remove('drag-over');
    }
    // 隐藏取消遮罩
    const overlay = document.getElementById('dragOverlay');
    if (overlay) overlay.style.display = 'none';
    // 移除事件监听
    document.removeEventListener('mousemove', _onDragMove);
    document.removeEventListener('mouseup', _onDragEnd);
    document.removeEventListener('touchmove', _onDragMoveTouch);
    document.removeEventListener('touchend', _onDragEndTouch);

    _dragState.active = false;
    _dragState.data = null;
    _dragState.currentTarget = null;
}

/* ==================== 放置处理 ==================== */

// 处理拖拽放置到座位
function handleDrop(seatId, data) {
    if (data.type === 'student') {
        // 从名单拖到座位

        // 顺序选座模式：必须按名单顺序
        if (state.orderSelectionActive && state.currentSelectionIndex < state.selectionOrder.length) {
            const expectedName = state.selectionOrder[state.currentSelectionIndex];
            if (data.name !== expectedName) {
                showToast(`请按照右侧名单顺序选择座位，下一位选座的同学：${expectedName}`, 'warning');
                return;
            }
        }

        // 目标座位已有人
        if (state.arrangement[seatId]) {
            showToast('该座位已有人，请先移走原有学生', 'warning');
            return;
        }

        // 从其他座位移除（防止重复）
        removeStudentFromAllSeats(data.name);
        // 放入座位
        state.arrangement[seatId] = { name: data.name, gender: data.gender };

        // 推进顺序选座
        if (state.orderSelectionActive && state.currentSelectionIndex < state.selectionOrder.length) {
            state.currentSelectionIndex++;
            if (state.currentSelectionIndex >= state.selectionOrder.length) {
                state.orderSelectionActive = false;
                showToast('顺序选座完成，现在可以自由排座', 'success');
            }
        }

        renderSeats();
        renderStudentList();
        updateSelectionIndicator();
        updateModeToggleBtn();
        debouncedSave();

    } else if (data.type === 'move') {
        // 从一个座位移动到另一个座位
        if (state.arrangement[seatId]) {
            // 目标有人 → 交换座位
            const temp = state.arrangement[seatId];
            state.arrangement[seatId] = { name: data.name, gender: data.gender };
            state.arrangement[data.fromSeat] = temp;
        } else {
            // 目标为空 → 移动
            delete state.arrangement[data.fromSeat];
            state.arrangement[seatId] = { name: data.name, gender: data.gender };
        }
        renderSeats();
        renderStudentList();
        updateModeToggleBtn();
        debouncedSave();
    }
}

// 从所有座位中移除指定学生
function removeStudentFromAllSeats(name) {
    for (const seatId in state.arrangement) {
        if (state.arrangement[seatId].name === name) {
            delete state.arrangement[seatId];
        }
    }
}

// 从指定座位移除学生（拖回名单）
function removeStudentFromSeat(seatId) {
    if (state.arrangement[seatId]) {
        delete state.arrangement[seatId];
        renderSeats();
        renderStudentList();
        updateModeToggleBtn();
        debouncedSave();
    }
}

/* ==================== 顺序选座 ==================== */

// 更新选座顺序指示器
function updateSelectionIndicator() {
    const indicator = document.getElementById('selectionIndicator');
    const nameEl = document.getElementById('nextStudentName');
    if (!indicator) return;
    if (state.orderSelectionActive && state.currentSelectionIndex < state.selectionOrder.length) {
        indicator.classList.add('active');
        nameEl.textContent = state.selectionOrder[state.currentSelectionIndex];
    } else {
        indicator.classList.remove('active');
    }
}

// 更新模式切换按钮显示
function updateModeToggleBtn() {
    const btn = document.getElementById('modeToggleBtn');
    if (!btn) return;
    if (state.orderSelectionActive) {
        const remaining = state.selectionOrder.length - state.currentSelectionIndex;
        btn.innerHTML = `<i class="fa fa-list-ol"></i> 顺序选座中（剩余${remaining}人）`;
        btn.className = 'btn btn-secondary';
        btn.disabled = false;
    } else {
        const seatedCount = Object.keys(state.arrangement).length;
        const totalSeats = countTotalSeats(state.currentTemplate);
        if (seatedCount >= totalSeats) {
            btn.innerHTML = '<i class="fa fa-check"></i> 排座完成';
            btn.className = 'btn btn-success';
            btn.disabled = true;
        } else {
            btn.innerHTML = '<i class="fa fa-arrows"></i> 自由排座模式';
            btn.className = 'btn btn-secondary';
            btn.disabled = true;
        }
    }
}

// 切换/结束顺序选座模式
function toggleSelectionMode() {
    if (state.orderSelectionActive) {
        // 提前结束顺序选座，剩余学生加入跳过列表
        const remaining = state.selectionOrder.length - state.currentSelectionIndex;
        if (remaining > 0) {
            for (let i = state.currentSelectionIndex; i < state.selectionOrder.length; i++) {
                const name = state.selectionOrder[i];
                const student = state.students.find(s => s.name === name) || { name, gender: '男' };
                if (!state.skippedStudents.some(s => s.name === name)) {
                    state.skippedStudents.push(student);
                }
            }
        }
        state.orderSelectionActive = false;
        state.currentSelectionIndex = state.selectionOrder.length;
        showToast('已结束顺序选座，现在可以自由排座', 'success');
        renderSeats();
        renderStudentList();
        updateSelectionIndicator();
        updateModeToggleBtn();
        debouncedSave();
    }
}

// 显示跳过此人密码验证框
function showSkipPassword() {
    if (!state.orderSelectionActive) return;
    const currentName = state.selectionOrder[state.currentSelectionIndex] || '';
    showModal('small', '跳过此人验证', `
        <div class="modal-body">
            <p style="text-align:center;color:#475569;margin-bottom:12px;">即将跳过：<strong style="color:#d97706;">${escapeHtml(currentName)}</strong></p>
            <div class="form-group">
                <label class="form-label">请输入管理员密码</label>
                <input type="password" class="input-field" id="skipPasswordInput" placeholder="请输入密码" autofocus>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-warning" onclick="confirmSkip()">确认跳过</button>
        </div>
    `);
    document.getElementById('skipPasswordInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmSkip();
    });
}

// 确认跳过此人
function confirmSkip() {
    const input = document.getElementById('skipPasswordInput');
    const password = input.value;
    // 验证管理员主密码
    if (password !== MASTER_PASSWORD) {
        showToast('密码错误，请重新输入', 'error');
        input.value = '';
        input.focus();
        return;
    }
    const skippedName = state.selectionOrder[state.currentSelectionIndex];
    const student = state.students.find(s => s.name === skippedName) || { name: skippedName, gender: '男' };
    // 加入跳过列表
    state.skippedStudents.push(student);
    // 推进选座顺序
    state.currentSelectionIndex++;
    if (state.currentSelectionIndex >= state.selectionOrder.length) {
        state.orderSelectionActive = false;
        showToast(`已跳过 ${skippedName}，顺序选座完成`, 'success');
    } else {
        showToast(`已跳过 ${skippedName}，下一位：${state.selectionOrder[state.currentSelectionIndex]}`, 'success');
    }
    closeModal();
    renderStudentList();
    renderSeats();
    updateSelectionIndicator();
    updateModeToggleBtn();
    debouncedSave();
}

// 从数据库加载模板列表
async function loadTemplates() {
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_templates', {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data)) {
                state.templates = data.map(t => {
                    let layout = t.layout;
                    if (typeof layout === 'string') {
                        try { layout = JSON.parse(layout); } catch(e) { layout = null; }
                    }
                    layout = layout || {};
                    return {
                        id: t.id,
                        name: t.name,
                        groups: layout.groups || [],
                        podium: layout.podium || { startGroup: 0, endGroup: 0 },
                        createdBy: t.created_by,
                        createdAt: t.created_at
                    };
                });
            }
        }
    } catch(e) {
        console.warn('Failed to load templates:', e);
    }
    // 始终包含默认模板
    const hasDefault = state.templates.some(t => t.name === '默认模板');
    if (!hasDefault) {
        state.templates.unshift({ ...DEFAULT_TEMPLATE, id: 'default', isDefault: true });
    }
}

// 提交模板需求到数据库
async function submitTemplateRequest() {
    const name = document.getElementById('submitTemplateNameInput').value.trim();
    if (!name) { showToast('请输入模板名称', 'error'); return; }
    const file = window._submitTemplateFile;
    if (!file) { showToast('请上传座位表文件', 'error'); return; }

    const fileLink = 'uploads/' + Date.now() + '_' + file.name;
    try {
        await fetch(SUPABASE_URL + '/rest/v1/seat_templates_submitted', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                file_link: fileLink,
                submitted_by: state.currentUser ? state.currentUser.id : null,
                created_at: new Date().toISOString()

        });
        closeModal();
        showModal('small', '提交成功', `

        showToast('提交失败，请重试', 'error');
    }
}

// 检查未排完的座位表
async function checkIncompleteSeatTables() {
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?is_completed=eq.false', {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data)) {
                // 过滤超过90天的记录
                const ninetyDaysAgo = Date.now() - 90 * 24 * 60 * 60 * 1000;
                return data.filter(t => new Date(t.updated_at || t.created_at).getTime() > ninetyDaysAgo);
            }
        }
    } catch(e) {
        console.warn('Failed to check incomplete tables:', e);
    }
    return [];
}

// 显示未排完座位表的处理选项
function showIncompleteModal(incomplete, onIgnore) {
    const namesList = incomplete.map(t =>
        `<div style="padding:8px;background:#fef3c7;border-radius:6px;margin-bottom:4px;">${escapeHtml(t.name)} — 更新于 ${new Date(t.updated_at || t.created_at).toLocaleDateString()}</div>`
    ).join('');

            <p style="margin-bottom:12px;color:#475569;">以下座位表还有空位未排完：</p>

            <button class="btn btn-danger" onclick="confirmDeleteIncomplete()">删除并新建座位表</button>
            <button class="btn btn-primary" onclick="continueArranging()">继续排位</button>

// 确认删除未排完的座位表
function confirmDeleteIncomplete() {
    showModal('small', '确认删除', `
        <div class="modal-body">
            <p style="text-align:center;color:#475569;">确定要删除这些未排完的座位表吗？此操作不可撤销。</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-danger" onclick="deleteAndCreateNew()">确认删除</button>
        </div>
    `);
}

// 删除未排完的座位表并新建
async function deleteAndCreateNew() {
    const ids = window._incompleteIds || [];
    for (const id of ids) {
        try {
            await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + id, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });
        } catch(e) { console.warn('Failed to delete:', e); }
    }
    closeModal();
    showToast('已删除未排完的座位表', 'success');
    promptNewSeatTableName();
}

// 继续排位（加载第一个未排完的座位表）
async function continueArranging() {
    const ids = window._incompleteIds || [];
    if (ids.length === 0) return;
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + ids[0], {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data && data.length > 0) {
                loadSeatTable(data[0]);
                closeModal();
                return;
            }
        }
    } catch(e) { console.warn('Failed to load seat table:', e); }
    showToast('加载失败', 'error');
}

        if (resp.ok) tables = await resp.json();

// 确认另存为新座位表
async function confirmSaveAsNew(originalId) {
    const newName = document.getElementById('newSeatTableNameInput').value.trim();
    if (!newName) { showToast('请输入名称', 'error'); return; }
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + originalId, {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data && data.length > 0) {
                const original = data[0];
                const newRow = {
                    name: newName,
                    template_layout: original.template_layout,
                    arrangement: original.arrangement,
                    student_list: original.student_list,
                    star_students: original.star_students,
                    progress_students: original.progress_students,
                    created_by: state.currentUser ? state.currentUser.id : '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    is_completed: false
                };
                const postResp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRow)
                });
                if (postResp.ok) {
                    const postData = await postResp.json();

                return;
            }
        }
    } catch(e) { console.warn('Save as new failed:', e); }
    showToast('操作失败', 'error');
}

// 加载座位表数据到状态
function loadSeatTable(tableData) {
    state.seatingTableName = tableData.name;
    state.seatTableId = tableData.id;
    state.isCompleted = tableData.is_completed || false;
    // 解析排座结果
    state.arrangement = typeof tableData.arrangement === 'string' ? JSON.parse(tableData.arrangement) : (tableData.arrangement || {});
    // 解析模板
    const layout = typeof tableData.template_layout === 'string' ? JSON.parse(tableData.template_layout) : (tableData.template_layout || {});
    state.currentTemplate = layout;
    // 解析学生列表
    if (tableData.student_list) {
        state.students = typeof tableData.student_list === 'string' ? JSON.parse(tableData.student_list) : tableData.student_list;
    }
    // 解析学习之星/进步之星
    if (tableData.star_students) {
        state.starStudents = typeof tableData.star_students === 'string' ? JSON.parse(tableData.star_students) : tableData.star_students;
    }
    if (tableData.progress_students) {
        state.progressStudents = typeof tableData.progress_students === 'string' ? JSON.parse(tableData.progress_students) : tableData.progress_students;
    }
    state.phase = 'arranging';
    buildSelectionOrder();
    renderLeftPanel();
    renderStudentList();
    showToast(`已加载座位表：${tableData.name}`, 'success');
}

// 防抖保存（1秒内多次操作只保存一次）
function debouncedSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveSeatTable(), 1000);
}

// 保存当前座位表到数据库
async function saveSeatTable() {
    if (state.phase !== 'arranging' || !state.seatingTableName) return;
    try {
        const body = {
            name: state.seatingTableName,
            template_layout: JSON.stringify(state.currentTemplate),
            arrangement: JSON.stringify(state.arrangement),
            student_list: JSON.stringify(state.students),
            star_students: JSON.stringify(state.starStudents),
            progress_students: JSON.stringify(state.progressStudents),
            created_by: state.currentUser ? state.currentUser.id : '',
            updated_at: new Date().toISOString(),
            is_completed: Object.keys(state.arrangement).length >= countTotalSeats(state.currentTemplate)
        };
        if (state.seatTableId) {
            // 更新已有记录
            await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + state.seatTableId, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        } else {
            // 创建新记录
            body.created_at = new Date().toISOString();
            const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (resp.ok) {
                const data = await resp.json();
                if (data && data.length > 0) state.seatTableId = data[0].id;
            }
        }
    } catch(e) {
        console.warn('Save failed:', e);
    }
}

// 处理排名表格上传
function handleRankFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const aoa = XLSX.utils.sheet_to_json(ws, { header: 1 });
            state.excelData = aoa;

            // 检测表头行
            const rankKeywords = ['年排', '年级排名', '总分年排', '总分排名', '理六科排名', '排名'];
            const nameKeywords = ['姓名', '名字', '学生'];
            let headerRowIdx = -1;
            for (let r = 0; r < Math.min(3, aoa.length); r++) {
                const row = aoa[r] || [];
                let hasRank = false, hasName = false;
                for (let c = 0; c < row.length; c++) {
                    const cellVal = String(row[c] || '').trim();
                    if (rankKeywords.some(kw => cellVal.includes(kw))) hasRank = true;
                    if (nameKeywords.some(kw => cellVal.includes(kw))) hasName = true;
                }
                if (hasRank || hasName) { headerRowIdx = r; break; }
            }
            if (headerRowIdx === -1) headerRowIdx = 0;
            state.excelHeaders = aoa[headerRowIdx] || [];
            state.excelHeaderRowIdx = headerRowIdx;

            // 查找年排列（按优先级匹配）
            const rankColPriority = ['年排', '年级排名', '总分年排', '总分排名', '理六科排名', '排名'];
            let bestRankCol = -1, bestPriority = 999;
            for (let c = 0; c < state.excelHeaders.length; c++) {
                const header = String(state.excelHeaders[c] || '').trim();
                for (let p = 0; p < rankColPriority.length; p++) {
                    if (header.includes(rankColPriority[p]) && p < bestPriority) {
                        bestRankCol = c;
                        bestPriority = p;
                    }
                }
            }
            state.detectedRankCol = bestRankCol;

            // 查找姓名列
            let nameCol = -1;
            for (let c = 0; c < state.excelHeaders.length; c++) {
                const header = String(state.excelHeaders[c] || '').trim();
                if (nameKeywords.some(kw => header.includes(kw))) { nameCol = c; break; }
            }
            // 若无姓名表头，尝试匹配已知学生名
            if (nameCol === -1) {
                for (let c = 0; c < state.excelHeaders.length; c++) {
                    let matchCount = 0;
                    for (let r = headerRowIdx + 1; r < Math.min(headerRowIdx + 10, aoa.length); r++) {
                        const val = aoa[r] && aoa[r][c] ? String(aoa[r][c]).trim() : '';
                        if (state.originalStudents.some(s => s.name === val)) matchCount++;
                    }
                    if (matchCount > 3) { nameCol = c; break; }
                }
            }
            state.nameColIndex = nameCol;
            state.rankColIndex = bestRankCol;
            showExcelPreview(aoa, headerRowIdx, bestRankCol);
        } catch(err) {
            showToast('文件解析失败：' + err.message, 'error');
        }
    };
    reader.readAsArrayBuffer(file);
}

// 显示排名表格预览（高亮年排列）
function showExcelPreview(aoa, headerRowIdx, rankCol) {
    const startRow = headerRowIdx;
    const endRow = Math.min(startRow + 20, aoa.length);
    const maxCols = aoa.slice(startRow, endRow).reduce((max, row) => Math.max(max, (row || []).length), 0);

    let tableHtml = '<table class="preview-table"><thead><tr>';
    tableHtml += '<th style="background:#f1f5f9;width:40px;">#</th>';
    for (let c = 0; c < maxCols; c++) {
        const isRank = c === rankCol;
        tableHtml += `<th class="${isRank ? 'highlighted' : ''}">${aoa[headerRowIdx] && aoa[headerRowIdx][c] !== undefined ? escapeHtml(String(aoa[headerRowIdx][c])) : ''}</th>`;
    }
    tableHtml += '</tr></thead><tbody>';
    for (let r = headerRowIdx + 1; r < endRow; r++) {
        tableHtml += '<tr>';
        tableHtml += `<td style="background:#f8fafc;color:#94a3b8;">${r - headerRowIdx}</td>`;
        for (let c = 0; c < maxCols; c++) {
            const isRank = c === rankCol;
            const val = aoa[r] && aoa[r][c] !== undefined ? String(aoa[r][c]) : '';
            tableHtml += `<td class="${isRank ? 'highlighted' : ''}">${escapeHtml(val)}</td>`;
        }
        tableHtml += '</tr>';
    }
    tableHtml += '</tbody></table>';

    const rankColName = rankCol >= 0 ? escapeHtml(String(state.excelHeaders[rankCol] || '')) : '未找到';
    showModal('large', '排名表格预览', `
        <div class="modal-body">
            <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
                <span class="info-badge badge-star"><i class="fa fa-star"></i> 检测到年排列：${rankColName}</span>
                ${rankCol >= 0 ? '<span style="color:#22c55e;font-size:13px;"><i class="fa fa-check"></i> 已高亮</span>' : '<span style="color:#ef4444;font-size:13px;"><i class="fa fa-exclamation"></i> 未找到，请手动选择</span>'}
            </div>
            <div style="overflow:auto;max-height:400px;border:1px solid #e2e8f0;border-radius:8px;">${tableHtml}</div>
            ${rankCol < 0 ? `
                <div class="form-group" style="margin-top:12px;">
                    <label class="form-label">手动选择年排列（表头）</label>
                    <select class="input-field" id="manualRankColSelect">
                        <option value="-1">-- 请选择 --</option>
                        ${state.excelHeaders.map((h, i) => `<option value="${i}">${escapeHtml(String(h || '第' + (i+1) + '列'))}</option>`).join('')}
                    </select>
                </div>
            ` : ''}
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-secondary" onclick="skipRankSelection()">跳过</button>
            <button class="btn btn-primary" onclick="confirmRankSelection()">确认</button>
        </div>
    `);
}

// 跳过年排列选择
function skipRankSelection() {

// 确认年排列选择，识别学习之星
function confirmRankSelection() {
    let rankCol = state.detectedRankCol;
    const manualSelect = document.getElementById('manualRankColSelect');
    if (manualSelect && manualSelect.value !== '-1') {
        rankCol = parseInt(manualSelect.value);
        state.detectedRankCol = rankCol;
        state.rankColIndex = rankCol;
    }
    if (rankCol < 0) { showToast('请选择年排列或点击跳过', 'warning'); return; }

    const aoa = state.excelData;
    const headerRowIdx = state.excelHeaderRowIdx !== undefined ? state.excelHeaderRowIdx : 0;
    const nameCol = state.nameColIndex;
    state.studentRanks = {};
    const studentNamesWithRanks = [];

    for (let r = headerRowIdx + 1; r < aoa.length; r++) {
        const nameVal = nameCol >= 0 ? (aoa[r] && aoa[r][nameCol]) : null;
        const rankVal = aoa[r] && aoa[r][rankCol];
        if (nameVal && String(nameVal).trim()) {
            const name = String(nameVal).trim();
            const rank = rankVal ? parseInt(String(rankVal).replace(/[^\d]/g, '')) || 9999 : 9999;
            state.studentRanks[name] = rank;
            studentNamesWithRanks.push({ name, rank });
        }
    }

    // 按表格顺序重排学生
    const newStudents = [];
    for (const item of studentNamesWithRanks) {
        const orig = state.originalStudents.find(s => s.name === item.name);
        newStudents.push(orig ? { ...orig } : { name: item.name, gender: '男' });
    }
    // 追加Excel中未包含的学生
    for (const orig of state.originalStudents) {
        if (!studentNamesWithRanks.some(s => s.name === orig.name)) newStudents.push({ ...orig });
    }
    state.students = newStudents;

    // 识别学习之星（年排前100）
    const starStudents = studentNamesWithRanks.filter(s => s.rank > 0 && s.rank <= 100).sort((a, b) => a.rank - b.rank);
    state.starStudents = starStudents.map(s => ({ name: s.name, rank: s.rank }));

    closeModal();
    renderStudentList();
    debouncedSave();
    showToast(`已识别 ${state.starStudents.length} 名学习之星`, 'success');
    setTimeout(() => showProgressStarModal(starStudents.map(s => s.name)), 300);
}

// 显示进步之星选择弹窗（按点击顺序编号）
function showProgressStarModal(starNames) {
    const allStudents = state.students;
    let selectedProgress = [];

    const renderCards = () => {
        const grid = document.getElementById('progressStarGrid');
        if (!grid) return;
        grid.innerHTML = '';
        allStudents.forEach(student => {
            const card = document.createElement('div');
            card.className = `star-card ${student.gender === '男' ? 'boy' : 'girl'}`;
            card.textContent = student.name;
            card.dataset.name = student.name;
            if (starNames.includes(student.name)) {
                // 学习之星不可选择
                card.classList.add('is-star');
                card.title = '该同学为学习之星';
                card.onclick = () => showToast('该同学为学习之星', 'info');
            } else {
                const existing = selectedProgress.findIndex(s => s.name === student.name);
                if (existing >= 0) {
                    card.classList.add('selected');
                    const badge = document.createElement('span');
                    badge.className = 'star-badge';
                    badge.textContent = existing + 1;
                    card.appendChild(badge);
                }
                card.onclick = () => {
                    const idx = selectedProgress.findIndex(s => s.name === student.name);
                    if (idx >= 0) {
                        selectedProgress.splice(idx, 1);
                    } else {
                        selectedProgress.push({ name: student.name, order: selectedProgress.length + 1, gender: student.gender });
                    }
                    renderCards();
                    updateConfirmBtn();
                };
            }
            grid.appendChild(card);
        });
    };

    const updateConfirmBtn = () => {
        const btn = document.getElementById('progressConfirmBtn');
        if (btn) {
            if (selectedProgress.length === 0) {
                btn.textContent = '跳过';
                btn.className = 'btn btn-secondary';
            } else {
                btn.textContent = `确认（已选${selectedProgress.length}人）`;
                btn.className = 'btn btn-success';
            }
        }
    };

    showModal('large', '选择进步之星', `
        <div class="modal-body">
            <p style="margin-bottom:12px;color:#475569;font-size:14px;">请点击选择进步之星同学（按点击顺序排列）。黄色框为学习之星，不可选择。</p>
            <div class="form-group">
                <input type="text" class="input-field" id="progressSearchInput" placeholder="输入姓名或单字查找..." oninput="filterProgressCards(this.value)">
            </div>
            <div class="star-grid" id="progressStarGrid"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-secondary" id="progressConfirmBtn" onclick="confirmProgressStars()">跳过</button>
        </div>
    `);
    renderCards();
    updateConfirmBtn();
    window._selectedProgress = () => selectedProgress;
}

// 进步之星搜索过滤
function filterProgressCards(keyword) {
    const grid = document.getElementById('progressStarGrid');
    if (!grid) return;
    const cards = grid.querySelectorAll('.star-card');
    cards.forEach(card => {
        const name = card.dataset.name || '';
        if (!keyword || matchPinyin(name, keyword)) {
            card.style.display = '';
        } else {
            card.style.display = 'none';
        }
    });
}

// 确认进步之星选择
function confirmProgressStars() {
    const selected = window._selectedProgress ? window._selectedProgress() : [];
    state.progressStudents = selected.map((s, i) => ({ name: s.name, order: i + 1, gender: s.gender }));
    // 重排学生：学习之星(按排名) → 进步之星(按顺序) → 其余
    reorderStudentsForSelection();
    closeModal();
    renderStudentList();
    buildSelectionOrder();
    debouncedSave();
    showToast(`已选择 ${state.progressStudents.length} 名进步之星`, 'success');
    // 选完后提示推送至大屏
    if (state.starStudents.length > 0 || state.progressStudents.length > 0) {
        setTimeout(() => promptPushToScreen(), 500);
    }
}

// 重排学生名单：学习之星优先，其次进步之星，最后其余
function reorderStudentsForSelection() {
    const starNames = state.starStudents.map(s => s.name);
    const progressNames = state.progressStudents.map(s => s.name);
    const stars = [], progress = [], rest = [];
    for (const student of state.students) {
        if (starNames.includes(student.name)) {
            const star = state.starStudents.find(s => s.name === student.name);
            stars.push({ ...student, rank: star ? star.rank : 999 });
        } else if (progressNames.includes(student.name)) {
            const prog = state.progressStudents.find(s => s.name === student.name);
            progress.push({ ...student, order: prog ? prog.order : 999 });
        } else {
            rest.push(student);
        }
    }
    stars.sort((a, b) => a.rank - b.rank);
    progress.sort((a, b) => a.order - b.order);
    state.students = [
        ...stars.map(s => { const { rank, ...rest } = s; return rest; }),
        ...progress.map(s => { const { order, ...rest } = s; return rest; }),
        ...rest
    ];
}

// 构建顺序选座名单
function buildSelectionOrder() {
    const starNames = [...state.starStudents].sort((a, b) => a.rank - b.rank).map(s => s.name);
    const progressNames = state.progressStudents.map(s => s.name);
    state.selectionOrder = [...starNames, ...progressNames];
    state.currentSelectionIndex = 0;
    state.orderSelectionActive = state.selectionOrder.length > 0;
    if (state.phase === 'arranging') {
        updateSelectionIndicator();
        updateModeToggleBtn();
        const skipBtn = document.getElementById('skipBtn');
        if (skipBtn) skipBtn.style.display = state.orderSelectionActive ? '' : 'none';
    }
}
