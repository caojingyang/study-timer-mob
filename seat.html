function handleRankFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const aoa = XLSX.utils.sheet_to_json(ws, { header: 1 });
            
            state.excelData = aoa;
            
            // Detect header row (might be row 0 or row 1 if there's a title)
            let headerRowIdx = -1;
            const rankKeywords = ['年排', '年级排名', '总分年排', '总分排名', '理六科排名', '排名'];
            const nameKeywords = ['姓名', '名字', '学生'];
            
            for (let r = 0; r < Math.min(3, aoa.length); r++) {
                const row = aoa[r] || [];
                let hasRank = false;
                let hasName = false;
                for (let c = 0; c < row.length; c++) {
                    const cellVal = String(row[c] || '').trim();
                    if (rankKeywords.some(kw => cellVal.includes(kw))) hasRank = true;
                    if (nameKeywords.some(kw => cellVal.includes(kw))) hasName = true;
                }
                if (hasRank || hasName) {
                    headerRowIdx = r;
                    break;
                }
            }
            
            if (headerRowIdx === -1) headerRowIdx = 0;
            
            state.excelHeaders = aoa[headerRowIdx] || [];
            state.excelHeaderRowIdx = headerRowIdx;
            
            // Find rank column (best match)
            const rankColPriority = ['年排', '年级排名', '总分年排', '总分排名', '理六科排名', '排名'];
            let bestRankCol = -1;
            let bestPriority = 999;
            for (let c = 0; c < state.excelHeaders.length; c++) {
                const header = String(state.excelHeaders[c] || '').trim();
                for (let p = 0; p < rankColPriority.length; p++) {
                    if (header.includes(rankColPriority[p]) && p < bestPriority) {
                        bestRankCol = c;
                        bestPriority = p;
                    }
                }
            }
            state.detectedRankCol = bestRankCol;
            
            // Find name column
            let nameCol = -1;
            for (let c = 0; c < state.excelHeaders.length; c++) {
                const header = String(state.excelHeaders[c] || '').trim();
                if (nameKeywords.some(kw => header.includes(kw))) {
                    nameCol = c;
                    break;
                }
            }
            // If no name header, try to match with existing student names
            if (nameCol === -1) {
                for (let c = 0; c < state.excelHeaders.length; c++) {
                    let matchCount = 0;
                    for (let r = headerRowIdx + 1; r < Math.min(headerRowIdx + 10, aoa.length); r++) {
                        const val = aoa[r] && aoa[r][c] ? String(aoa[r][c]).trim() : '';
                        if (state.originalStudents.some(s => s.name === val)) matchCount++;
                    }
                    if (matchCount > 3) { nameCol = c; break; }
                }
            }
            state.nameColIndex = nameCol;
            state.rankColIndex = bestRankCol;
            
            // Show preview modal
            showExcelPreview(aoa, headerRowIdx, bestRankCol);
            
        } catch(err) {
            showToast('文件解析失败：' + err.message, 'error');
        }
    };
    reader.readAsArrayBuffer(file);
}

function showExcelPreview(aoa, headerRowIdx, rankCol) {
    // Show up to 20 rows starting from header row (including header)
    const startRow = headerRowIdx;
    const endRow = Math.min(startRow + 20, aoa.length);
    const maxCols = aoa.slice(startRow, endRow).reduce((max, row) => Math.max(max, (row || []).length), 0);
    
    let tableHtml = '<table class="preview-table"><thead><tr>';
    tableHtml += '<th style="background:#f1f5f9;width:40px;">#</th>';
    for (let c = 0; c < maxCols; c++) {
        const isRank = c === rankCol;
        tableHtml += `<th class="${isRank ? 'highlighted' : ''}">${aoa[headerRowIdx] && aoa[headerRowIdx][c] !== undefined ? escapeHtml(String(aoa[headerRowIdx][c])) : ''}</th>`;
    }
    tableHtml += '</tr></thead><tbody>';
    
    for (let r = headerRowIdx + 1; r < endRow; r++) {
        tableHtml += '<tr>';
        tableHtml += `<td style="background:#f8fafc;color:#94a3b8;">${r - headerRowIdx}</td>`;
        for (let c = 0; c < maxCols; c++) {
            const isRank = c === rankCol;
            const val = aoa[r] && aoa[r][c] !== undefined ? String(aoa[r][c]) : '';
            tableHtml += `<td class="${isRank ? 'highlighted' : ''}">${escapeHtml(val)}</td>`;
        }
        tableHtml += '</tr>';
    }
    tableHtml += '</tbody></table>';
    
    const rankColName = rankCol >= 0 ? escapeHtml(String(state.excelHeaders[rankCol] || '')) : '未找到';
    
    showModal('large', '排名表格预览', `
        <div class="modal-body">
            <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
                <span class="info-badge badge-star"><i class="fa fa-star"></i> 检测到年排列：${rankColName}</span>
                ${rankCol >= 0 ? '<span style="color:#22c55e;font-size:13px;"><i class="fa fa-check"></i> 已高亮</span>' : '<span style="color:#ef4444;font-size:13px;"><i class="fa fa-exclamation"></i> 未找到，请手动选择</span>'}
            </div>
            <div style="overflow:auto;max-height:400px;border:1px solid #e2e8f0;border-radius:8px;">
                ${tableHtml}
            </div>
            ${rankCol < 0 ? `
                <div class="form-group" style="margin-top:12px;">
                    <label class="form-label">手动选择年排列（表头）</label>
                    <select class="input-field" id="manualRankColSelect">
                        <option value="-1">-- 请选择 --</option>
                        ${state.excelHeaders.map((h, i) => `<option value="${i}">${escapeHtml(String(h || `第${i+1}列`))}</option>`).join('')}
                    </select>
                </div>
            ` : ''}
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-secondary" onclick="skipRankSelection()">跳过</button>
            <button class="btn btn-primary" onclick="confirmRankSelection()">确认</button>
        </div>
    `);
}

function skipRankSelection() {
    state.detectedRankCol = -1;
    state.rankColIndex = -1;
    closeModal();
    showToast('已跳过年排列选择', 'info');
    // Show progress star selection with all students
    showProgressStarModal([]);
}

function confirmRankSelection() {
    let rankCol = state.detectedRankCol;
    
    // Check manual selection
    const manualSelect = document.getElementById('manualRankColSelect');
    if (manualSelect && manualSelect.value !== '-1') {
        rankCol = parseInt(manualSelect.value);
        state.detectedRankCol = rankCol;
        state.rankColIndex = rankCol;
    }
    
    if (rankCol < 0) {
        showToast('请选择年排列或点击跳过', 'warning');
        return;
    }
    
    // Parse student ranks
    const aoa = state.excelData;
    const headerRowIdx = state.excelHeaderRowIdx !== undefined ? state.excelHeaderRowIdx : 0;
    const nameCol = state.nameColIndex;
    
    state.studentRanks = {};
    const studentNamesWithRanks = [];
    
    for (let r = headerRowIdx + 1; r < aoa.length; r++) {
        const nameVal = nameCol >= 0 ? (aoa[r] && aoa[r][nameCol]) : null;
        const rankVal = aoa[r] && aoa[r][rankCol];
        
        if (nameVal && String(nameVal).trim()) {
            const name = String(nameVal).trim();
            const rank = rankVal ? parseInt(String(rankVal).replace(/[^\d]/g, '')) || 9999 : 9999;
            state.studentRanks[name] = rank;
            studentNamesWithRanks.push({ name, rank });
        }
    }
    
    // Reorder students: clear and re-add in table order
    const newStudents = [];
    for (const item of studentNamesWithRanks) {
        const orig = state.originalStudents.find(s => s.name === item.name);
        if (orig) {
            newStudents.push({ ...orig });
        } else {
            // Unknown student, try to determine gender
            newStudents.push({ name: item.name, gender: '男' });
        }
    }
    
    // Add any students not in the Excel
    for (const orig of state.originalStudents) {
        if (!studentNamesWithRanks.some(s => s.name === orig.name)) {
            newStudents.push({ ...orig });
        }
    }
    
    state.students = newStudents;
    
    // Identify learning stars (rank <= 100)
    const starStudents = studentNamesWithRanks
        .filter(s => s.rank > 0 && s.rank <= 100)
        .sort((a, b) => a.rank - b.rank);
    
    state.starStudents = starStudents.map(s => ({ name: s.name, rank: s.rank }));
    
    closeModal();
    renderStudentList();
    showToast(`已识别 ${state.starStudents.length} 名学习之星`, 'success');
    
    // Show progress star selection modal
    setTimeout(() => showProgressStarModal(starStudents.map(s => s.name)), 300);
}

function showProgressStarModal(starNames) {
    const allStudents = state.students;
    let selectedProgress = [];
    
    const renderCards = () => {
        const grid = document.getElementById('progressStarGrid');
        if (!grid) return;
        grid.innerHTML = '';
        
        allStudents.forEach(student => {
            const card = document.createElement('div');
            card.className = `star-card ${student.gender === '男' ? 'boy' : 'girl'}`;
            card.textContent = student.name;
            card.dataset.name = student.name;
            
            if (starNames.includes(student.name)) {
                card.classList.add('is-star');
                card.title = '该同学为学习之星';
                card.onclick = () => {
                    showToast(`该同学为学习之星`, 'info');
                };
            } else {
                const existing = selectedProgress.findIndex(s => s.name === student.name);
                if (existing >= 0) {
                    card.classList.add('selected');
                    const badge = document.createElement('span');
                    badge.className = 'star-badge';
                    badge.textContent = existing + 1;
                    card.appendChild(badge);
                }
                card.onclick = () => {
                    const idx = selectedProgress.findIndex(s => s.name === student.name);
                    if (idx >= 0) {
                        selectedProgress.splice(idx, 1);
                    } else {
                        selectedProgress.push({ name: student.name, order: selectedProgress.length + 1, gender: student.gender });
                    }
                    renderCards();
                    updateConfirmBtn();
                };
            }
            
            grid.appendChild(card);
        });
    };
    
    const updateConfirmBtn = () => {
        const btn = document.getElementById('progressConfirmBtn');
        if (btn) {
            if (selectedProgress.length === 0) {
                btn.textContent = '跳过';
                btn.className = 'btn btn-secondary';
            } else {
                btn.textContent = `确认（已选${selectedProgress.length}人）`;
                btn.className = 'btn btn-success';
            }
        }
    };
    
    showModal('large', '选择进步之星', `
        <div class="modal-body">
            <p style="margin-bottom:12px;color:#475569;font-size:14px;">
                请点击选择进步之星同学（按点击顺序排列）。黄色框为学习之星，不可选择。
            </p>
            <div class="form-group">
                <input type="text" class="input-field" id="progressSearchInput" placeholder="输入姓名或单字查找..." oninput="filterProgressCards(this.value)">
            </div>
            <div class="star-grid" id="progressStarGrid"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-secondary" id="progressConfirmBtn" onclick="confirmProgressStars()">跳过</button>
        </div>
    `);
    
    renderCards();
    updateConfirmBtn();
    
    // Store selected for confirm
    window._selectedProgress = () => selectedProgress;
}

function filterProgressCards(keyword) {
    const cards = document.querySelectorAll('#progressStarGrid .star-card');
    cards.forEach(card => {
        const name = card.dataset.name || '';
        if (!keyword || matchStudent(name, keyword)) {
            card.style.display = '';
        } else {
            card.style.display = 'none';
        }
    });
}

function confirmProgressStars() {
    const selected = window._selectedProgress ? window._selectedProgress() : [];
    state.progressStudents = selected.map((s, i) => ({ name: s.name, order: i + 1, gender: s.gender }));
    
    // Re-sort students: stars first (by rank), then progress (by order), then rest
    reorderStudentsForSelection();
    
    closeModal();
    renderStudentList();
    
    // Build selection order
    buildSelectionOrder();
    
    showToast(`已选择 ${state.progressStudents.length} 名进步之星`, 'success');
}

function reorderStudentsForSelection() {
    const starNames = state.starStudents.map(s => s.name);
    const progressNames = state.progressStudents.map(s => s.name);
    
    const stars = [];
    const progress = [];
    const rest = [];
    
    for (const student of state.students) {
        if (starNames.includes(student.name)) {
            const star = state.starStudents.find(s => s.name === student.name);
            stars.push({ ...student, rank: star ? star.rank : 999 });
        } else if (progressNames.includes(student.name)) {
            const prog = state.progressStudents.find(s => s.name === student.name);
            progress.push({ ...student, order: prog ? prog.order : 999 });
        } else {
            rest.push(student);
        }
    }
    
    stars.sort((a, b) => a.rank - b.rank);
    progress.sort((a, b) => a.order - b.order);
    
    state.students = [...stars.map(s => { const {rank, ...rest} = s; return rest; }), ...progress.map(s => { const {order, ...rest} = s; return rest; }), ...rest];
}

function buildSelectionOrder() {
    const starNames = state.starStudents.sort((a, b) => a.rank - b.rank).map(s => s.name);
    const progressNames = state.progressStudents.map(s => s.name);
    
    state.selectionOrder = [...starNames, ...progressNames];
    state.currentSelectionIndex = 0;
    state.orderSelectionActive = state.selectionOrder.length > 0;
    
    if (state.phase === 'arranging') {
        updateSelectionIndicator();
        updateModeToggleBtn();
    }
}

// ==================== SEAT TABLE OPERATIONS ====================
async function startNewSeatTable() {
    // Check for incomplete seat tables
    const incomplete = await checkIncompleteSeatTables();
    
    if (incomplete && incomplete.length > 0) {
        showIncompleteModal(incomplete, () => promptNewSeatTableName());
    } else {
        promptNewSeatTableName();
    }
}

async function checkIncompleteSeatTables() {
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?is_completed=eq.false', {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data)) {
                // Filter out records older than 90 days
                const ninetyDaysAgo = Date.now() - 90 * 24 * 60 * 60 * 1000;
                return data.filter(t => new Date(t.updated_at || t.created_at).getTime() > ninetyDaysAgo);
            }
        }
    } catch(e) {
        console.warn('Failed to check incomplete tables:', e);
    }
    return [];
}

function showIncompleteModal(incomplete, onIgnore) {
    const namesList = incomplete.map(t => `<div style="padding:8px;background:#fef3c7;border-radius:6px;margin-bottom:4px;">${escapeHtml(t.name)} — 更新于 ${new Date(t.updated_at || t.created_at).toLocaleDateString()}</div>`).join('');
    const ids = incomplete.map(t => t.id);
    window._incompleteIgnore = onIgnore;
    window._incompleteIds = ids;
    
    showModal('medium', '检测到未排完的座位表', `
        <div class="modal-body">
            <p style="margin-bottom:12px;color:#475569;">以下座位表还有空位未排完：</p>
            ${namesList}
            <p style="margin-top:12px;font-size:13px;color:#94a3b8;">请选择如何处理：</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal(); if(window._incompleteIgnore) window._incompleteIgnore();">忽略</button>
            <button class="btn btn-danger" onclick="confirmDeleteIncomplete()">删除并新建座位表</button>
            <button class="btn btn-primary" onclick="continueArranging()">继续排位</button>
        </div>
    `);
}

function confirmDeleteIncomplete() {
    showModal('small', '确认删除', `
        <div class="modal-body">
            <p style="text-align:center;color:#475569;">确定要删除这些未排完的座位表吗？此操作不可撤销。</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-danger" onclick="deleteAndCreateNew()">确认删除</button>
        </div>
    `);
}

async function deleteAndCreateNew() {
    const ids = window._incompleteIds || [];
    for (const id of ids) {
        try {
            await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + id, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            });
        } catch(e) {
            console.warn('Failed to delete:', e);
        }
    }
    closeModal();
    showToast('已删除未排完的座位表', 'success');
    promptNewSeatTableName();
}

async function continueArranging() {
    const ids = window._incompleteIds || [];
    if (ids.length === 0) return;
    
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + ids[0], {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data && data.length > 0) {
                loadSeatTable(data[0]);
                closeModal();
                return;
            }
        }
    } catch(e) {
        console.warn('Failed to load seat table:', e);
    }
    showToast('加载失败', 'error');
}

function promptNewSeatTableName() {
    closeModal();
    setTimeout(() => {
        showModal('small', '新建座位表', `
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">座位表名称</label>
                    <input type="text" class="input-field" id="seatTableNameInput" placeholder="例如：2024秋季排座" autofocus>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="createNewSeatTable()">创建</button>
            </div>
        `);
        document.getElementById('seatTableNameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') createNewSeatTable();
        });
    }, 100);
}

function createNewSeatTable() {
    const name = document.getElementById('seatTableNameInput').value.trim();
    if (!name) {
        showToast('请输入座位表名称', 'error');
        return;
    }
    
    state.seatingTableName = name;
    state.seatTableId = null;
    state.arrangement = {};
    state.isCompleted = false;
    state.phase = 'arranging';
    
    // Build selection order if stars/progress exist
    buildSelectionOrder();
    
    closeModal();
    renderLeftPanel();
    showToast(`已创建座位表：${name}`, 'success');
    saveSeatTable();
}

// ==================== HISTORY ====================
async function showHistorySeatTables() {
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?order=updated_at.desc', {
            headers: { 'Content-Type': 'application/json' }
        });
        
        let tables = [];
        if (resp.ok) {
            tables = await resp.json();
        }
        
        // Filter out records older than 90 days
        const ninetyDaysAgo = Date.now() - 90 * 24 * 60 * 60 * 1000;
        tables = tables.filter(t => new Date(t.updated_at || t.created_at).getTime() > ninetyDaysAgo);
        
        state.historySeatTables = tables;
        
        if (tables.length === 0) {
            showModal('medium', '历史座位表', `
                <div class="modal-body">
                    <div style="text-align:center;padding:40px;color:#94a3b8;">
                        <i class="fa fa-inbox" style="font-size:48px;"></i>
                        <p style="margin-top:12px;">暂无历史座位表</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
                </div>
            `);
            return;
        }
        
        const cards = tables.map(t => {
            const arrangement = typeof t.arrangement === 'string' ? JSON.parse(t.arrangement) : (t.arrangement || {});
            const seatCount = Object.keys(arrangement).length;
            const templateLayout = typeof t.template_layout === 'string' ? JSON.parse(t.template_layout) : (t.template_layout || {});
            const totalSeats = templateLayout.groups ? templateLayout.groups.filter(g => !g.aisle).reduce((sum, g) => sum + g.cols * g.rows, 0) : 0;
            const incomplete = !t.is_completed;
            const updatedDate = new Date(t.updated_at || t.created_at).toLocaleDateString();
            
            return `
                <div class="history-card ${incomplete ? 'incomplete' : ''}">
                    <div class="history-card-name">${escapeHtml(t.name)} ${incomplete ? '<span class="info-badge badge-star" style="margin-left:4px;">未完成</span>' : '<span class="info-badge badge-progress" style="margin-left:4px;">已完成</span>'}</div>
                    <div class="history-card-meta">
                        <i class="fa fa-calendar"></i> ${updatedDate}<br>
                        <i class="fa fa-chair"></i> ${seatCount}/${totalSeats} 座位已排
                    </div>
                    <div class="history-card-actions">
                        <button class="btn btn-primary btn-sm" onclick="editHistorySeatTable('${t.id}')"><i class="fa fa-edit"></i> 修改</button>
                        <button class="btn btn-secondary btn-sm" onclick="saveAsNewHistorySeatTable('${t.id}')"><i class="fa fa-copy"></i> 另存为</button>
                    </div>
                </div>
            `;
        }).join('');
        
        showModal('large', '历史座位表', `
            <div class="modal-body">
                <div class="template-grid">${cards}</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
            </div>
        `);
        
    } catch(e) {
        showToast('加载历史座位表失败', 'error');
    }
}

async function editHistorySeatTable(id) {
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + id, {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data && data.length > 0) {
                loadSeatTable(data[0]);
                closeModal();
                return;
            }
        }
    } catch(e) {}
    showToast('加载失败', 'error');
}

async function saveAsNewHistorySeatTable(id) {
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + id, {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data && data.length > 0) {
                const original = data[0];
                closeModal();
                setTimeout(() => {
                    showModal('small', '另存为新的座位表', `
                        <div class="modal-body">
                            <div class="form-group">
                                <label class="form-label">新座位表名称</label>
                                <input type="text" class="input-field" id="newSeatTableNameInput" value="${escapeHtml(original.name)} (副本)" autofocus>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                            <button class="btn btn-primary" onclick="confirmSaveAsNew('${id}')">保存</button>
                        </div>
                    `);
                    document.getElementById('newSeatTableNameInput').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') confirmSaveAsNew(id);
                    });
                }, 100);
                return;
            }
        }
    } catch(e) {}
    showToast('操作失败', 'error');
}

async function confirmSaveAsNew(originalId) {
    const newName = document.getElementById('newSeatTableNameInput').value.trim();
    if (!newName) {
        showToast('请输入名称', 'error');
        return;
    }
    
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + originalId, {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (data && data.length > 0) {
                const original = data[0];
                const newRow = {
                    name: newName,
                    template_layout: original.template_layout,
                    arrangement: original.arrangement,
                    student_list: original.student_list,
                    star_students: original.star_students,
                    progress_students: original.progress_students,
                    created_by: state.currentUser ? state.currentUser.id : null,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    is_completed: false
                };
                
                const postResp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newRow)
                });
                
                if (postResp.ok) {
                    const postData = await postResp.json();
                    if (postData && postData.length > 0) {
                        loadSeatTable(postData[0]);
                    }
                }
                closeModal();
                showToast('已另存为新座位表', 'success');
                return;
            }
        }
    } catch(e) {
        console.warn('Save as new failed:', e);
    }
    showToast('操作失败', 'error');
}

function loadSeatTable(tableData) {
    state.seatingTableName = tableData.name;
    state.seatTableId = tableData.id;
    state.isCompleted = tableData.is_completed || false;
    
    // Parse arrangement
    state.arrangement = typeof tableData.arrangement === 'string' ? JSON.parse(tableData.arrangement) : (tableData.arrangement || {});
    
    // Parse template
    const layout = typeof tableData.template_layout === 'string' ? JSON.parse(tableData.template_layout) : (tableData.template_layout || {});
    state.currentTemplate = layout;
    
    // Parse students
    if (tableData.student_list) {
        state.students = typeof tableData.student_list === 'string' ? JSON.parse(tableData.student_list) : tableData.student_list;
    }
    
    // Parse star/progress students
    if (tableData.star_students) {
        state.starStudents = typeof tableData.star_students === 'string' ? JSON.parse(tableData.star_students) : tableData.star_students;
    }
    if (tableData.progress_students) {
        state.progressStudents = typeof tableData.progress_students === 'string' ? JSON.parse(tableData.progress_students) : tableData.progress_students;
    }
    
    state.phase = 'arranging';
    buildSelectionOrder();
    renderLeftPanel();
    renderStudentList();
    showToast(`已加载座位表：${tableData.name}`, 'success');
}

// ==================== DATABASE SAVE ====================
let saveTimer = null;
function debouncedSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveSeatTable(), 1000);
}

async function saveSeatTable() {
    if (state.phase !== 'arranging' || !state.seatingTableName) return;
    
    try {
        const templateLayout = JSON.stringify(state.currentTemplate);
        const arrangement = JSON.stringify(state.arrangement);
        const studentList = JSON.stringify(state.students);
        const starStudents = JSON.stringify(state.starStudents);
        const progressStudents = JSON.stringify(state.progressStudents);
        
        const totalSeats = countTotalSeats(state.currentTemplate);
        const seatedCount = Object.keys(state.arrangement).length;
        const isCompleted = seatedCount >= totalSeats;
        
        const body = {
            name: state.seatingTableName,
            template_layout: templateLayout,
            arrangement: arrangement,
            student_list: studentList,
            star_students: starStudents,
            progress_students: progressStudents,
            created_by: state.currentUser ? state.currentUser.id : null,
            updated_at: new Date().toISOString(),
            is_completed: isCompleted
        };
        
        if (state.seatTableId) {
            // Update existing
            await fetch(SUPABASE_URL + '/rest/v1/seat_tables?id=eq.' + state.seatTableId, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        } else {
            // Create new
            body.created_at = new Date().toISOString();
            const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (resp.ok) {
                const data = await resp.json();
                if (data && data.length > 0) {
                    state.seatTableId = data[0].id;
                }
            }
        }
    } catch(e) {
        console.warn('Save failed:', e);
    }
}

// ==================== EXPORT TO EXCEL ====================
function exportToExcel() {
    if (!state.currentTemplate || Object.keys(state.arrangement).length === 0) {
        showToast('请先排座再导出', 'warning');
        return;
    }
    
    const template = state.currentTemplate;
    const arrangement = state.arrangement;
    
    // Calculate total columns
    let totalCols = 0;
    for (const g of template.groups) {
        totalCols += g.aisle ? 1 : g.cols;
    }
    
    const seatGroups = template.groups.filter(g => !g.aisle);
    const maxRows = Math.max(...seatGroups.map(g => g.rows));
    
    // Build grid
    let grid = [];
    for (let r = 0; r < maxRows; r++) {
        let row = new Array(totalCols).fill('');
        let col = 0;
        let sgIdx = 0;
        for (const g of template.groups) {
            if (g.aisle) {
                col += 1;
            } else {
                for (let c = 0; c < g.cols; c++) {
                    if (r < g.rows) {
                        const seatId = `seat-${sgIdx}-${r}-${c}`;
                        const student = arrangement[seatId];
                        if (student) {
                            row[col + c] = student.name;
                        }
                    }
                }
                col += g.cols;
                sgIdx++;
            }
        }
        grid.push(row);
    }
    
    // Empty row between seats and podium
    grid.push(new Array(totalCols).fill(''));
    
    // Podium row
    let podiumRow = new Array(totalCols).fill('');
    const podiumStart = template.podium ? template.podium.startGroup : 0;
    const podiumEnd = template.podium ? template.podium.endGroup : 0;
    
    // Calculate podium column span
    let podiumStartCol = -1;
    let podiumEndCol = -1;
    let col = 0;
    let sgIdx = 0;
    for (const g of template.groups) {
        if (g.aisle) {
            if (sgIdx > podiumStart && sgIdx <= podiumEnd) {
                if (podiumStartCol === -1) podiumStartCol = col;
                podiumEndCol = col;
            }
            col += 1;
        } else {
            if (sgIdx >= podiumStart && sgIdx <= podiumEnd) {
                if (podiumStartCol === -1) podiumStartCol = col;
                podiumEndCol = col + g.cols - 1;
            }
            col += g.cols;
            sgIdx++;
        }
    }
    
    // Fill podium
    if (podiumStartCol >= 0 && podiumEndCol >= 0) {
        for (let c = podiumStartCol; c <= podiumEndCol; c++) {
            podiumRow[c] = '讲　台';
        }
    } else {
        // Fallback: center podium
        const center = Math.floor(totalCols / 2);
        podiumStartCol = Math.max(0, center - 3);
        podiumEndCol = Math.min(totalCols - 1, center + 3);
        for (let c = podiumStartCol; c <= podiumEndCol; c++) {
            podiumRow[c] = '讲　台';
        }
    }
    grid.push(podiumRow);
    
    // Create worksheet
    const ws = XLSX.utils.aoa_to_sheet(grid);
    
    // Set column widths
    ws['!cols'] = new Array(totalCols).fill({ wch: 10 });
    
    // Add merge for podium
    const podiumRowIdx = grid.length - 1;
    ws['!merges'] = [
        { s: { r: podiumRowIdx, c: podiumStartCol }, e: { r: podiumRowIdx, c: podiumEndCol } }
    ];
    
    // Try to add borders to seat cells
    const borderStyle = {
        top: { style: 'thin' },
        bottom: { style: 'thin' },
        left: { style: 'thin' },
        right: { style: 'thin' }
    };
    
    for (let r = 0; r < maxRows; r++) {
        let col = 0;
        let sgIdx = 0;
        for (const g of template.groups) {
            if (g.aisle) {
                col += 1;
            } else {
                for (let c = 0; c < g.cols; c++) {
                    if (r < g.rows) {
                        const cellRef = XLSX.utils.encode_cell({ r: r, c: col + c });
                        if (ws[cellRef]) {
                            ws[cellRef].s = { border: borderStyle, alignment: { horizontal: 'center', vertical: 'center' } };
                        } else {
                            ws[cellRef] = { t: 's', v: '', s: { border: borderStyle, alignment: { horizontal: 'center', vertical: 'center' } } };
                        }
                    }
                }
                col += g.cols;
                sgIdx++;
            }
        }
    }
    
    // Style podium cell
    const podiumCellRef = XLSX.utils.encode_cell({ r: podiumRowIdx, c: podiumStartCol });
    if (ws[podiumCellRef]) {
        ws[podiumCellRef].s = {
            border: borderStyle,
            alignment: { horizontal: 'center', vertical: 'center' },
            font: { bold: true, sz: 14 }
        };
    }
    
    // Create workbook
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '座位表');
    
    // Write file
    const fileName = (state.seatingTableName || '座位表') + '.xlsx';
    XLSX.writeFile(wb, fileName);
    
    showToast('座位表已导出', 'success');
}

// ==================== UTILITIES ====================
function countTotalSeats(template) {
    if (!template || !template.groups) return 0;
    return template.groups.filter(g => !g.aisle).reduce((sum, g) => sum + g.cols * g.rows, 0);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showModal(size, title, content) {
    const overlay = document.getElementById('modalOverlay');
    const card = document.getElementById('modalCard');
    card.className = 'modal-card ' + size;
    card.innerHTML = `
        <div class="modal-header">
            <div class="modal-title">${title}</div>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        ${content}
    `;
    overlay.classList.add('active');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalOverlay')) {
        closeModal();
    }
});

let toastTimer = null;
function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type;
    toast.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.style.display = 'none';
    }, 3000);
}

// Clean up old records (90+ days)
async function cleanupOldRecords() {
    try {
        const ninetyDaysAgo = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000).toISOString();
        await fetch(SUPABASE_URL + '/rest/v1/seat_tables?updated_at=lt.' + ninetyDaysAgo, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' }
        });
    } catch(e) {
        console.warn('Cleanup failed:', e);
    }
}

// Run cleanup on load
cleanupOldRecords();
