<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高二（13）班智能排座系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="font-awesome.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --primary-bg: #eef2ff;
            --boy-bg: #dbeafe;
            --boy-text: #1e40af;
            --boy-border: #93c5fd;
            --girl-bg: #fce7f3;
            --girl-text: #db2777;
            --girl-border: #f9a8d4;
            --star-border: #f59e0b;
            --star-bg: #fef3c7;
            --progress-border: #22c55e;
            --progress-bg: #dcfce7;
            --seat-border: #94a3b8;
            --seat-empty-bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 50%, #fff0f6 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #1e293b;
        }
        /* Header */
        .app-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #6366f1 100%);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover { background: rgba(255,255,255,0.35); }
        /* Mobile banner */
        .mobile-banner {
            background: linear-gradient(90deg, #f59e0b, #f97316);
            color: white;
            padding: 10px 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        /* Main layout */
        .main-container {
            display: flex;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 60px);
        }
        .left-panel {
            flex: 0 0 65%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 20px;
            overflow: auto;
            display: flex;
            flex-direction: column;
        }
        .right-panel {
            flex: 0 0 35%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .right-header {
            padding: 16px 16px 8px;
            border-bottom: 1px solid #f1f5f9;
        }
        .right-header h3 {
            margin: 0 0 10px;
            font-size: 16px;
            font-weight: 700;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--primary-light); }
        .student-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }
        .student-list::-webkit-scrollbar { width: 6px; }
        .student-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .student-list::-webkit-scrollbar-track { background: transparent; }
        .student-card {
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: grab;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            border: 2px solid transparent;
        }
        .student-card:hover { transform: translateX(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .student-card:active { cursor: grabbing; }
        .student-card.boy {
            background: var(--boy-bg);
            color: var(--boy-text);
            border-color: var(--boy-border);
        }
        .student-card.girl {
            background: var(--girl-bg);
            color: var(--girl-text);
            border-color: var(--girl-border);
        }
        .student-card.star {
            border: 2px dashed var(--star-border);
            background: var(--star-bg);
        }
        .student-card.progress {
            border: 2px dashed var(--progress-border);
            background: var(--progress-bg);
        }
        .student-card.seated {
            opacity: 0.4;
            text-decoration: line-through;
        }
        .student-card.dragging { opacity: 0.5; }
        .card-number {
            background: var(--progress-border);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        .right-footer {
            padding: 12px 16px;
            border-top: 1px solid #f1f5f9;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 2px 8px rgba(99,102,241,0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
        .btn-secondary {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            color: #475569;
        }
        .btn-secondary:hover { background: linear-gradient(135deg, #e2e8f0, #cbd5e1); }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 2px 8px rgba(34,197,94,0.3);
        }
        .btn-success:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,0.4); }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
        .btn-lg { padding: 14px 28px; font-size: 16px; border-radius: 12px; }
        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #94a3b8;
        }
        .empty-state-icon { font-size: 64px; }
        .empty-state-text { font-size: 18px; font-weight: 500; }
        .empty-state-buttons { display: flex; gap: 16px; }
        /* Seating area */
        .seating-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px 0;
        }
        .seat-groups-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .seat-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .seat-row {
            display: flex;
            gap: 8px;
        }
        .seat {
            border: 2px dashed var(--seat-border);
            border-radius: 10px;
            min-height: 52px;
            min-width: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--seat-empty-bg);
            font-size: 14px;
            font-weight: 600;
            padding: 4px;
            text-align: center;
            position: relative;
        }
        .seat:hover { border-color: var(--primary-light); background: var(--primary-bg); }
        .seat.drag-over {
            background: #c7d2fe;
            border-color: var(--primary);
            border-style: solid;
            transform: scale(1.05);
        }
        .seat.occupied {
            border-style: solid;
            border-color: var(--primary);
            background: var(--primary-bg);
            cursor: grab;
        }
        .seat.occupied.boy { background: var(--boy-bg); border-color: var(--boy-border); color: var(--boy-text); }
        .seat.occupied.girl { background: var(--girl-bg); border-color: var(--girl-border); color: var(--girl-text); }
        .seat.occupied.star { border: 2px dashed var(--star-border); background: var(--star-bg); }
        .seat.occupied.progress { border: 2px dashed var(--progress-border); background: var(--progress-bg); }
        .aisle-spacer {
            min-width: 24px;
        }
        .podium-spacer-row {
            height: 16px;
        }
        .podium-row {
            display: flex;
            gap: 12px;
        }
        .podium {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 8px;
            box-shadow: 0 4px 16px rgba(79,70,229,0.2);
        }
        /* Drag overlay */
        .drag-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 0 0 16px 16px;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.95) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-card.large { width: 900px; }
        .modal-card.medium { width: 600px; }
        .modal-card.small { width: 400px; }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .modal-title { font-size: 20px; font-weight: 700; color: #1e293b; }
        .modal-close {
            background: #f1f5f9;
            border: none;
            width: 32px; height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            color: #64748b;
        }
        .modal-close:hover { background: #e2e8f0; }
        .modal-body { margin-bottom: 16px; }
        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        /* Template cards */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .template-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-card:hover { border-color: var(--primary-light); box-shadow: 0 4px 16px rgba(99,102,241,0.15); transform: translateY(-2px); }
        .template-card.selected { border-color: var(--primary); background: var(--primary-bg); }
        .template-card-name { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .template-card-info { font-size: 13px; color: #64748b; }
        /* History cards */
        .history-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
        }
        .history-card:hover { border-color: var(--primary-light); box-shadow: 0 4px 16px rgba(99,102,241,0.1); }
        .history-card.incomplete { border-color: var(--star-border); background: #fffbeb; }
        .history-card-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .history-card-meta { font-size: 13px; color: #64748b; margin-bottom: 10px; }
        .history-card-actions { display: flex; gap: 8px; }
        /* Preview table */
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .preview-table th, .preview-table td {
            border: 1px solid #e2e8f0;
            padding: 6px 10px;
            text-align: center;
        }
        .preview-table th { background: #f8fafc; font-weight: 600; }
        .preview-table th.highlighted { background: #fef3c7; border: 2px solid #f59e0b; }
        .preview-table td.highlighted { background: #fffbeb; }
        /* Star selection grid */
        .star-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin: 16px 0;
        }
        .star-card {
            padding: 8px 4px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            position: relative;
        }
        .star-card.boy { background: var(--boy-bg); color: var(--boy-text); }
        .star-card.girl { background: var(--girl-bg); color: var(--girl-text); }
        .star-card.is-star { border: 2px dashed var(--star-border); background: var(--star-bg); cursor: not-allowed; }
        .star-card.selected { border: 2px solid var(--progress-border); background: var(--progress-bg); }
        .star-card .star-badge {
            position: absolute;
            top: -6px; right: -6px;
            background: var(--progress-border);
            color: white;
            border-radius: 50%;
            width: 20px; height: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* No permission */
        .no-permission {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 9999;
        }
        .no-permission i { font-size: 64px; color: #ef4444; }
        .no-permission h2 { font-size: 28px; margin: 0; }
        .no-permission p { font-size: 16px; color: #94a3b8; }
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast.error { background: #dc2626; }
        .toast.success { background: #16a34a; }
        .toast.warning { background: #d97706; }
        /* Selection indicator */
        .selection-indicator {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border: 2px solid #f59e0b;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #92400e;
        }
        .selection-indicator.active { display: flex; }
        .selection-indicator .next-name {
            background: white;
            padding: 4px 12px;
            border-radius: 8px;
            color: #1e40af;
            font-weight: 700;
        }
        /* Seating toolbar */
        .seating-toolbar {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .seating-info {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        /* Input */
        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--primary-light); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #475569; }
        /* File upload */
        .file-upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-upload-area:hover { border-color: var(--primary-light); background: var(--primary-bg); }
        .file-upload-area i { font-size: 40px; color: #94a3b8; margin-bottom: 8px; }
        /* Responsive */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; height: auto; }
            .left-panel, .right-panel { flex: 1; width: 100%; }
            .right-panel { max-height: 400px; }
            .header-title { font-size: 16px; }
            .seat { min-width: 60px; min-height: 44px; font-size: 12px; }
            .star-grid { grid-template-columns: repeat(4, 1fr); }
        }
        /* Group builder */
        .group-builder { display: flex; flex-direction: column; gap: 8px; }
        .group-builder-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .group-builder-item input {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            text-align: center;
        }
        .info-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-star { background: #fef3c7; color: #92400e; }
        .badge-progress { background: #dcfce7; color: #166534; }
        .badge-boy { background: var(--boy-bg); color: var(--boy-text); }
        .badge-girl { background: var(--girl-bg); color: var(--girl-text); }
    </style>
</head>
<body>

<!-- No Permission Screen -->
<div class="no-permission" id="noPermissionScreen">
    <i class="fa fa-lock"></i>
    <h2>无权限访问排座系统</h2>
    <p>您没有排座系统的访问权限，请联系管理员。</p>
    <a href="./" class="back-btn" style="margin-top:10px;">返回</a>
</div>

<!-- Main App (hidden until permission check passes) -->
<div id="appContent" style="display:none;">

<!-- Header -->
<div class="app-header">
    <a href="./" class="back-btn"><i class="fa fa-arrow-left"></i> 返回移动端</a>
    <div class="header-title">
        <span style="font-size:26px;">🪑</span>
        <span>高二（13）班智能排座系统</span>
    </div>
    <div style="width:120px;"></div>
</div>

<!-- Mobile Banner -->
<div class="mobile-banner" id="mobileBanner">
    <i class="fa fa-desktop"></i> 电脑上打开此网页效果更佳
</div>

<!-- Main Container -->
<div class="main-container">
    <!-- Left Panel: Seating Area -->
    <div class="left-panel" id="leftPanel">
        <!-- Content rendered dynamically -->
    </div>

    <!-- Right Panel: Student List -->
    <div class="right-panel" id="rightPanel">
        <div class="right-header">
            <h3><i class="fa fa-users"></i> 学生名单 <span id="studentCount" style="font-size:13px;color:#94a3b8;font-weight:400;"></span></h3>
            <input type="text" class="search-box" id="searchBox" placeholder="搜索姓名 / 拼音 / 首字母...">
        </div>
        <div class="student-list" id="studentList">
            <!-- Student cards rendered here -->
        </div>
        <div class="drag-overlay" id="dragOverlay">
            <div>
                <i class="fa fa-arrows" style="font-size:32px;margin-bottom:8px;display:block;"></i>
                移动到此处可重新安排该同学座位
            </div>
        </div>
        <div class="right-footer">
            <button class="btn btn-warning" style="width:100%;" id="starSelectionBtn" onclick="startStarSelection()">
                <i class="fa fa-trophy"></i> 学习之星、进步之星选座
            </button>
        </div>
    </div>
</div>

</div>

<!-- Modal Container -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
        <!-- Modal content rendered here -->
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== CONFIG ====================
const SUPABASE_URL = 'https://wh12z213mob.pages.dev/api/supabase';

// ==================== INITIALIZATION ====================
document.addEventListener('DOMContentLoaded', init);

async function init() {
    // Check permission
    if (!checkPermission()) {
        document.getElementById('noPermissionScreen').style.display = 'flex';
        return;
    }
    document.getElementById('appContent').style.display = 'block';

    // Mobile detection
    detectMobile();

    // Initialize students
    state.students = [...DEFAULT_STUDENTS];
    state.originalStudents = [...DEFAULT_STUDENTS];
    renderStudentList();

    // Load templates from DB
    await loadTemplates();

    // Add default template if no templates loaded
    if (state.templates.length === 0) {
        state.templates.push({ ...DEFAULT_TEMPLATE, id: 'default', isDefault: true });
    }

    // Render left panel
    renderLeftPanel();

    // Setup drag overlay for student list
    setupStudentListDrag();
}

// ==================== PERMISSION CHECK ====================
function checkPermission() {
    try {
        const userStr = localStorage.getItem('currentUser');
        if (!userStr) return false;
        const user = JSON.parse(userStr);
        state.currentUser = user;
        if (user.isAdmin) return true;
        if (user.permissions && user.permissions.seatSystem) return true;
        return false;
    } catch(e) {
        return false;
    }
}

// ==================== MOBILE DETECTION ====================
function detectMobile() {
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        || (window.screen.width < 768);
    if (isMobile) {
        const banner = document.getElementById('mobileBanner');
        banner.style.display = 'block';
        setTimeout(() => { banner.style.display = 'none'; }, 5000);
    }
}

// ==================== STUDENT LIST ====================
function renderStudentList() {
    const container = document.getElementById('studentList');
    const countEl = document.getElementById('studentCount');
    
    let displayStudents = state.students;
    
    // Filter by search
    if (state.searchKeyword) {
        displayStudents = state.students.filter(s => matchStudent(s.name, state.searchKeyword));
    }
    
    // Sort: star students first, then progress, then rest
    displayStudents = sortStudentsForDisplay(displayStudents);
    
    container.innerHTML = '';
    countEl.textContent = `(${displayStudents.length}/${state.students.length}人)`;
    
    if (displayStudents.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">未找到匹配的学生</div>';
        return;
    }
    
    displayStudents.forEach(student => {
        const card = createStudentCard(student);
        container.appendChild(card);
    });
}

function sortStudentsForDisplay(students) {
    const starNames = state.starStudents.map(s => s.name);
    const progressNames = state.progressStudents.map(s => s.name);
    const skippedNames = state.skippedStudents.map(s => s.name);
    const seatedNames = Object.values(state.arrangement).map(s => s.name);
    
    const stars = [];
    const progress = [];
    const skipped = [];
    const rest = [];
    
    for (const student of students) {
        if (starNames.includes(student.name)) {
            const star = state.starStudents.find(s => s.name === student.name);
            stars.push({ ...student, starRank: star ? star.rank : 999 });
        } else if (progressNames.includes(student.name)) {
            const prog = state.progressStudents.find(s => s.name === student.name);
            progress.push({ ...student, progressOrder: prog ? prog.order : 999 });
        } else if (skippedNames.includes(student.name)) {
            skipped.push(student);
        } else {
            rest.push(student);
        }
    }
    
    stars.sort((a, b) => a.starRank - b.starRank);
    progress.sort((a, b) => a.progressOrder - b.progressOrder);
    
    return [...stars, ...progress, ...skipped, ...rest];
}

function createStudentCard(student) {
    const card = document.createElement('div');
    card.className = `student-card ${student.gender === '男' ? 'boy' : 'girl'}`;
    card.draggable = true;
    card.dataset.name = student.name;
    card.dataset.gender = student.gender;
    
    const starNames = state.starStudents.map(s => s.name);
    const progressNames = state.progressStudents.map(s => s.name);
    const skippedNames = state.skippedStudents.map(s => s.name);
    
    if (starNames.includes(student.name)) {
        card.classList.add('star');
    } else if (progressNames.includes(student.name)) {
        card.classList.add('progress');
        const prog = state.progressStudents.find(s => s.name === student.name);
        if (prog) {
            const badge = document.createElement('span');
            badge.className = 'card-number';
            badge.textContent = prog.order;
            card.appendChild(badge);
        }
    }
    
    // Check if seated
    const seatedNames = Object.values(state.arrangement).map(s => s.name);
    if (seatedNames.includes(student.name)) {
        card.classList.add('seated');
    }
    
    const nameSpan = document.createElement('span');
    nameSpan.textContent = student.name;
    card.insertBefore(nameSpan, card.firstChild);
    
    // Drag start
    card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', JSON.stringify({
            type: 'student',
            name: student.name,
            gender: student.gender
        }));
        e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
    });
    
    return card;
}

// ==================== PINYIN SEARCH ====================
function matchStudent(name, keyword) {
    if (!keyword) return true;
    const kw = keyword.trim().toLowerCase();
    if (!kw) return true;
    
    // Direct match
    if (name.includes(keyword.trim())) return true;
    
    // Pinyin match
    try {
        const pinyinLib = window.pinyinPro;
        if (pinyinLib && pinyinLib.match) {
            const result = pinyinLib.match(name, kw);
            if (result && result.length > 0) return true;
        }
        if (pinyinLib && pinyinLib.pinyin) {
            const fullPinyin = pinyinLib.pinyin(name, { toneType: 'none' }).toLowerCase().replace(/\s/g, '');
            if (fullPinyin.includes(kw)) return true;
            const initials = pinyinLib.pinyin(name, { pattern: 'first', toneType: 'none' }).toLowerCase().replace(/\s/g, '');
            if (initials.includes(kw)) return true;
        }
    } catch(e) {
        console.warn('Pinyin match error:', e);
    }
    
    return false;
}

function renderPodium(container, template, mini = false) {
    const podiumStart = template.podium ? template.podium.startGroup : 0;
    const podiumEnd = template.podium ? template.podium.endGroup : 0;
    
    // Calculate flex values for podium row
    const seatGroups = template.groups.filter(g => !g.aisle);
    let beforeFlex = 0;
    let podiumFlex = 0;
    let afterFlex = 0;
    
    let colCount = 0;
    let seatGroupIdx = 0;
    for (const g of template.groups) {
        if (g.aisle) {
            if (seatGroupIdx > podiumStart && seatGroupIdx <= podiumEnd) {
                podiumFlex += 1;
            } else if (seatGroupIdx <= podiumStart) {
                beforeFlex += 1;
            } else {
                afterFlex += 1;
            }
        } else {
            if (seatGroupIdx >= podiumStart && seatGroupIdx <= podiumEnd) {
                podiumFlex += g.cols;
            } else if (seatGroupIdx < podiumStart) {
                beforeFlex += g.cols;
            } else {
                afterFlex += g.cols;
            }
            seatGroupIdx++;
        }
    }
    
    const podiumRow = document.createElement('div');
    podiumRow.className = 'podium-row';
    podiumRow.style.width = '100%';
    
    if (beforeFlex > 0) {
        const before = document.createElement('div');
        before.style.flex = beforeFlex;
        podiumRow.appendChild(before);
    }
    
    const podium = document.createElement('div');
    podium.className = 'podium';
    podium.style.flex = podiumFlex;
    podium.textContent = '讲　台';
    if (mini) {
        podium.style.fontSize = '12px';
        podium.style.padding = '6px';
        podium.style.letterSpacing = '4px';
    }
    podiumRow.appendChild(podium);
    
    if (afterFlex > 0) {
        const after = document.createElement('div');
        after.style.flex = afterFlex;
        podiumRow.appendChild(after);
    }
    
    container.appendChild(podiumRow);
}

function createSeat(seatId, groupIdx, row, col) {
    const seat = document.createElement('div');
    seat.className = 'seat';
    seat.id = seatId;
    seat.dataset.seatId = seatId;
    
    const occupied = state.arrangement[seatId];
    if (occupied) {
        seat.classList.add('occupied');
        seat.classList.add(occupied.gender === '男' ? 'boy' : 'girl');
        
        const starNames = state.starStudents.map(s => s.name);
        const progressNames = state.progressStudents.map(s => s.name);
        if (starNames.includes(occupied.name)) seat.classList.add('star');
        if (progressNames.includes(occupied.name)) seat.classList.add('progress');
        
        seat.textContent = occupied.name;
        seat.draggable = true;
        seat.dataset.studentName = occupied.name;
        seat.dataset.gender = occupied.gender;
        
        // Drag occupied seat
        seat.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', JSON.stringify({
                type: 'move',
                fromSeat: seatId,
                name: occupied.name,
                gender: occupied.gender
            }));
            e.dataTransfer.effectAllowed = 'move';
            seat.style.opacity = '0.5';
        });
        seat.addEventListener('dragend', () => {
            seat.style.opacity = '1';
        });
    } else {
        seat.textContent = '';
    }
    
    // Drop zone
    seat.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        seat.classList.add('drag-over');
    });
    seat.addEventListener('dragleave', () => {
        seat.classList.remove('drag-over');
    });
    seat.addEventListener('drop', (e) => {
        e.preventDefault();
        seat.classList.remove('drag-over');
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        handleDrop(seatId, data);
    });
    
    return seat;
}

function handleDrop(seatId, data) {
    if (data.type === 'student') {
        // Check order if active
        if (state.orderSelectionActive && state.currentSelectionIndex < state.selectionOrder.length) {
            const expectedName = state.selectionOrder[state.currentSelectionIndex];
            if (data.name !== expectedName) {
                showToast(`请按照右侧名单顺序选择座位，下一位选座的同学：${expectedName}`, 'warning');
                return;
            }
        }
        
        // Check if seat is occupied
        if (state.arrangement[seatId]) {
            showToast('该座位已有人，请先移走原有学生', 'warning');
            return;
        }
        
        // Remove from any other seat
        removeStudentFromAllSeats(data.name);
        
        // Place in seat
        state.arrangement[seatId] = { name: data.name, gender: data.gender };
        
        // Advance selection order
        if (state.orderSelectionActive && state.currentSelectionIndex < state.selectionOrder.length) {
            state.currentSelectionIndex++;
            if (state.currentSelectionIndex >= state.selectionOrder.length) {
                state.orderSelectionActive = false;
                showToast('顺序选座完成，现在可以自由排座', 'success');
            }
        }
        
        renderSeats();
        renderStudentList();
        updateSelectionIndicator();
        updateModeToggleBtn();
        debouncedSave();
        
    } else if (data.type === 'move') {
        // Moving from one seat to another
        if (state.arrangement[seatId]) {
            // Swap seats
            const temp = state.arrangement[seatId];
            state.arrangement[seatId] = { name: data.name, gender: data.gender };
            state.arrangement[data.fromSeat] = temp;
        } else {
            // Move to empty seat
            delete state.arrangement[data.fromSeat];
            state.arrangement[seatId] = { name: data.name, gender: data.gender };
        }
        renderSeats();
        renderStudentList();
        debouncedSave();
    }
}

function removeStudentFromAllSeats(name) {
    for (const seatId in state.arrangement) {
        if (state.arrangement[seatId].name === name) {
            delete state.arrangement[seatId];
        }
    }
}

function removeStudentFromSeat(seatId) {
    if (state.arrangement[seatId]) {
        delete state.arrangement[seatId];
        renderSeats();
        renderStudentList();
        debouncedSave();
    }
}

    });
    
    list.addEventListener('dragenter', (e) => {
        e.preventDefault();
        if (e.target === list || list.contains(e.target)) {
            overlay.style.display = 'flex';
        }
    });
    
    list.addEventListener('dragleave', (e) => {
        if (!list.contains(e.relatedTarget)) {
            overlay.style.display = 'none';
        }
    });
    
    list.addEventListener('drop', (e) => {
        e.preventDefault();
        overlay.style.display = 'none';
        try {
            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            if (data.type === 'move') {
                removeStudentFromSeat(data.fromSeat);
                showToast(`已将 ${data.name} 移回名单`, 'success');
            }
        } catch(err) {}
    });
    
    list.addEventListener('dragend', () => {
        overlay.style.display = 'none';
    });
}

// ==================== SELECTION ORDER ====================
function updateSelectionIndicator() {
    const indicator = document.getElementById('selectionIndicator');
    const nameEl = document.getElementById('nextStudentName');
    if (!indicator) return;
    
    if (state.orderSelectionActive && state.currentSelectionIndex < state.selectionOrder.length) {
        indicator.classList.add('active');
        nameEl.textContent = state.selectionOrder[state.currentSelectionIndex];
    } else {
        indicator.classList.remove('active');
    }
}

function updateModeToggleBtn() {
    const btn = document.getElementById('modeToggleBtn');
    if (!btn) return;
    
    if (state.orderSelectionActive) {
        const remaining = state.selectionOrder.length - state.currentSelectionIndex;
        btn.innerHTML = `<i class="fa fa-list-ol"></i> 顺序选座中（剩余${remaining}人）`;
        btn.className = 'btn btn-secondary';
        btn.disabled = false;
    } else {
        const seatedCount = Object.keys(state.arrangement).length;
        const totalSeats = countTotalSeats(state.currentTemplate);
        if (seatedCount >= totalSeats) {
            btn.innerHTML = '<i class="fa fa-check"></i> 排座完成';
            btn.className = 'btn btn-success';
            btn.disabled = true;
        } else {
            btn.innerHTML = '<i class="fa fa-arrows"></i> 自由排座模式';
            btn.className = 'btn btn-secondary';
            btn.disabled = true;
        }
    }
}

function toggleSelectionMode() {
    if (state.orderSelectionActive) {
        // End ordered selection early
        const remaining = state.selectionOrder.length - state.currentSelectionIndex;
        if (remaining > 0) {
            // Add remaining ordered students to skipped list
            for (let i = state.currentSelectionIndex; i < state.selectionOrder.length; i++) {
                const name = state.selectionOrder[i];
                const student = state.students.find(s => s.name === name) || { name, gender: '男' };
                if (!state.skippedStudents.some(s => s.name === name)) {
                    state.skippedStudents.push(student);
                }
            }
        }
        state.orderSelectionActive = false;
        state.currentSelectionIndex = state.selectionOrder.length;
        showToast('已结束顺序选座，现在可以自由排座', 'success');
        renderSeats();
        renderStudentList();
        updateSelectionIndicator();
        updateModeToggleBtn();
        debouncedSave();
    }
}

// ==================== SKIP PERSON ====================
function showSkipPassword() {
    if (!state.orderSelectionActive || state.currentSelectionIndex >= state.selectionOrder.length) {
        showToast('当前无需跳过', 'info');
        return;
    }
    
    const currentName = state.selectionOrder[state.currentSelectionIndex];
    showModal('small', '验证密码', `
        <div class="modal-body">
            <p style="margin-bottom:12px;color:#475569;">即将跳过 <strong style="color:#1e40af;">${currentName}</strong> 的选座</p>
            <p style="margin-bottom:12px;font-size:13px;color:#94a3b8;">请输入当前用户密码或主密码以确认跳过</p>
            <div class="form-group">
                <input type="password" class="input-field" id="skipPasswordInput" placeholder="请输入密码" autofocus>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-warning" onclick="confirmSkip()">确认跳过</button>
        </div>
    `);
    document.getElementById('skipPasswordInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmSkip();
    });
}

function confirmSkip() {
    const input = document.getElementById('skipPasswordInput');
    const password = input.value;
    
    // Check master password
    if (password !== MASTER_PASSWORD) {
        // Try to check user password via API (if available)
        // For now, only master password is accepted
        showToast('密码错误，请重新输入', 'error');
        input.value = '';
        input.focus();
        return;
    }
    
    const skippedName = state.selectionOrder[state.currentSelectionIndex];
    const student = state.students.find(s => s.name === skippedName) || { name: skippedName, gender: '男' };
    
    // Add to skipped list
    state.skippedStudents.push(student);
    
    // Advance selection
    state.currentSelectionIndex++;
    if (state.currentSelectionIndex >= state.selectionOrder.length) {
        state.orderSelectionActive = false;
        showToast(`已跳过 ${skippedName}，顺序选座完成`, 'success');
    } else {
        showToast(`已跳过 ${skippedName}，下一位：${state.selectionOrder[state.currentSelectionIndex]}`, 'success');
    }
    
    closeModal();
    renderStudentList();
    renderSeats();
    updateSelectionIndicator();
    updateModeToggleBtn();
    debouncedSave();
}

// ==================== TEMPLATE LIBRARY ====================
async function loadTemplates() {
    try {
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_templates', {
            headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data)) {
                state.templates = data.map(t => {
                    let layout = t.layout;
                    if (typeof layout === 'string') {
                        try { layout = JSON.parse(layout); } catch(e) { layout = null; }
                    }
                    layout = layout || {};
                    return {
                        id: t.id,
                        name: t.name,
                        groups: layout.groups || [],
                        podium: layout.podium || { startGroup: 0, endGroup: 0 },
                        createdBy: t.created_by,
                        createdAt: t.created_at
                    };
                });
            }
        }
    } catch(e) {
        console.warn('Failed to load templates:', e);
    }
    
    // Always include default template
    const hasDefault = state.templates.some(t => t.name === '默认模板');
    if (!hasDefault) {
        state.templates.unshift({ ...DEFAULT_TEMPLATE, id: 'default', isDefault: true });
    }

function handleTemplateExcel(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const aoa = XLSX.utils.sheet_to_json(ws, { header: 1 });
            const merges = ws['!merges'] || [];
            
            // Auto-detect template structure
            const detected = detectTemplateFromAOA(aoa, merges);
            
            showTemplateConfigForm(detected, file.name);
        } catch(err) {
            showToast('Excel解析失败：' + err.message, 'error');

function handleTemplateImage(file) {

        };

    };
    reader.readAsDataURL(file);

function detectTemplateFromAOA(aoa, merges) {
    const maxRows = aoa.length;
    const maxCols = aoa.reduce((max, row) => Math.max(max, (row || []).length), 0);
    
    // Detect podium from merged cells containing "讲台"
    let podiumRow = -1;
    let podiumStartCol = -1;
    let podiumEndCol = -1;
    for (const merge of merges) {
        const val = aoa[merge.s.r] && aoa[merge.s.r][merge.s.c];
        if (val && String(val).includes('讲台')) {
            podiumRow = merge.s.r;
            podiumStartCol = merge.s.c;
            podiumEndCol = merge.e.c;
        }
    }
    
    // Also check for "讲台" text in cells
    if (podiumRow === -1) {
        for (let r = 0; r < maxRows; r++) {
            for (let c = 0; c < maxCols; c++) {
                const val = aoa[r] && aoa[r][c];
                if (val && String(val).includes('讲台')) {
                    podiumRow = r;
                    podiumStartCol = c;
                    podiumEndCol = c;
                    break;
                }
            }
            if (podiumRow !== -1) break;
        }
    }
    
    // Find data rows (exclude podium and title rows)
    const dataEndRow = podiumRow > 0 ? podiumRow - 1 : maxRows - 1;
    
    // Detect column groups
    let colHasData = new Array(maxCols).fill(false);
    for (let r = 0; r <= dataEndRow; r++) {
        for (let c = 0; c < maxCols; c++) {
            const val = aoa[r] && aoa[r][c];
            if (val !== undefined && val !== null && String(val).trim() !== '' && !String(val).includes('讲台')) {
                colHasData[c] = true;
            }
        }
    }
    
    // Group contiguous columns
    let groups = [];
    let currentStart = -1;
    for (let c = 0; c < maxCols; c++) {
        if (colHasData[c]) {
            if (currentStart === -1) currentStart = c;
        } else {
            if (currentStart !== -1) {
                groups.push({ startCol: currentStart, endCol: c - 1 });
                currentStart = -1;
            }
        }
    }
    if (currentStart !== -1) groups.push({ startCol: currentStart, endCol: maxCols - 1 });
    
    // Build template groups
    let templateGroups = [];
    let seatGroupIndices = [];
    for (let i = 0; i < groups.length; i++) {
        const g = groups[i];
        const cols = g.endCol - g.startCol + 1;
        // Count rows with data in this group
        let rows = 0;
        for (let r = 0; r <= dataEndRow; r++) {
            let hasData = false;
            for (let c = g.startCol; c <= g.endCol; c++) {
                const val = aoa[r] && aoa[r][c];
                if (val !== undefined && val !== null && String(val).trim() !== '' && !String(val).includes('讲台')) {
                    hasData = true;
                    break;
                }
            }
            if (hasData) rows++;
        }
        templateGroups.push({ cols, rows });
        seatGroupIndices.push(i);
        if (i < groups.length - 1) {
            templateGroups.push({ cols: 0, rows: 0, aisle: true });
        }
    }
    
    // Determine podium position
    let podium = { startGroup: 0, endGroup: Math.max(0, seatGroupIndices.length - 1) };
    if (podiumStartCol >= 0 && podiumEndCol >= 0) {
        let startG = -1, endG = -1;
        for (let i = 0; i < groups.length; i++) {
            const g = groups[i];
            if (g.startCol >= podiumStartCol && g.endCol <= podiumEndCol) {
                const seatIdx = seatGroupIndices.indexOf(i);
                if (seatIdx !== -1) {
                    if (startG === -1) startG = seatIdx;
                    endG = seatIdx;
                }
            } else if (g.endCol >= podiumStartCol && g.startCol <= podiumEndCol) {
                const seatIdx = seatGroupIndices.indexOf(i);
                if (seatIdx !== -1) {
                    if (startG === -1) startG = seatIdx;
                    endG = seatIdx;
                }
            }
        }
        if (startG >= 0) podium = { startGroup: startG, endGroup: endG };
    }
    
    return {
        name: '上传模版',
        groups: templateGroups.length > 0 ? templateGroups : JSON.parse(JSON.stringify(DEFAULT_TEMPLATE.groups)),
        podium: podium
    };
}

function saveTemplateFromForm() {
    const name = document.getElementById('templateNameInput').value.trim();
    if (!name) {
        showToast('请输入模板名称', 'error');
        return;
    }
    
    const detected = window._detectedTemplate;
    const inputs = document.querySelectorAll('[data-group-idx]');
    
    // Update group configs
    const seatGroups = detected.groups.filter(g => !g.aisle);
    inputs.forEach(input => {
        const idx = parseInt(input.dataset.groupIdx);
        const field = input.dataset.field;
        const val = parseInt(input.value);
        if (seatGroups[idx]) {
            seatGroups[idx][field] = val;
        }
    });
    
    const podiumStart = parseInt(document.getElementById('podiumStartInput').value) - 1;
    const podiumEnd = parseInt(document.getElementById('podiumEndInput').value) - 1;
    
    const template = {
        name: name,
        groups: detected.groups,
        podium: { startGroup: podiumStart, endGroup: podiumEnd }
    };
    
    // Save to database
    saveTemplateToDB(template);
}

async function saveTemplateToDB(template) {
    try {
        const layout = JSON.stringify({
            groups: template.groups,
            podium: template.podium
        });
        
        const body = {
            name: template.name,
            layout: layout,
            created_by: state.currentUser ? state.currentUser.id : null,
            created_at: new Date().toISOString()
        };
        
        const resp = await fetch(SUPABASE_URL + '/rest/v1/seat_templates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        
        if (resp.ok) {
            const data = await resp.json();
            template.id = data[0] ? data[0].id : Date.now();
        }
    } catch(e) {
        console.warn('Failed to save template to DB:', e);
    }
    
    // Add to local templates
    state.templates.push(template);
    closeModal();
    showToast(`模板"${template.name}"保存成功`, 'success');
    
    // Auto-select the new template
    selectTemplate(state.templates.length - 1);
}
